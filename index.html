<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<style>:root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}img{max-width:100%}[hidden]{display:none!important}</style>
<title>CSS-Atlas – CSS zum Anfassen</title>
<meta name="description" content="CSS-Eigenschaften und Selektoren mit Live-Vorschau: Wert anklicken, Wirkung sehen, CSS und Tailwind-Klasse ablesen.">
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:ital,wght@0,400;0,700;1,400&family=Figtree:wght@600;800&family=JetBrains+Mono:wght@400;500;600;700&display=swap">
<style>
:root{
  --bg:#F3F5F7; --surface:#FFFFFF; --surface-2:#EBEFF3; --ink:#15191F; --muted:#545C6A;
  --line:#D8DDE4; --line-strong:#838C9B;
  --success:#1B6B40; --success-bg:#E3F2E9; --warn:#7A4D00; --warn-bg:#FBF0D9;
  --danger:#B3261E; --danger-bg:#FBE8E6; --danger-ink:#FFFFFF;
  --toast-bg:#1D2229; --toast-ink:#F2F4F7; --toast-ok:#7BD9A1; --toast-err:#FF9A8F;
  --shadow:0 1px 2px rgb(16 24 40 / .06), 0 10px 28px rgb(16 24 40 / .14);

  --brand-l:#1F5FAD; --brand-ink-l:#FFFFFF; --brand-soft-l:#E6EEF8;
  --brand-d:#86B6F2; --brand-ink-d:#0A1A2F; --brand-soft-d:#16263A;
  --radius-ctl:10px; --radius-sm:8px; --radius-lg:14px; --radius-mark:10px;
  --font-display:"Figtree", "Atkinson Hyperlegible", system-ui, sans-serif; --display-wt:800;

  --brand:var(--brand-l); --brand-ink:var(--brand-ink-l); --brand-soft:var(--brand-soft-l);
  --toast-action:var(--brand-d);
  --focus:var(--brand);
  --font-body:"Atkinson Hyperlegible", system-ui, -apple-system, "Segoe UI", sans-serif;
  --font-mono:"JetBrains Mono", ui-monospace, "Cascadia Mono", Consolas, monospace;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    color-scheme:dark;
    --bg:#0E1115; --surface:#161A20; --surface-2:#1E232B; --ink:#E7EAEE; --muted:#A0A8B4;
    --line:#2B313A; --line-strong:#6B7483;
    --success:#74D39B; --success-bg:#15291E; --warn:#F2C063; --warn-bg:#2C2210;
    --danger:#FF8A80; --danger-bg:#34171A; --danger-ink:#2B0A07;
    --toast-bg:#E9ECF0; --toast-ink:#15191F; --toast-ok:#1B6B40; --toast-err:#B3261E;
    --shadow:0 1px 2px rgb(0 0 0 / .4), 0 10px 28px rgb(0 0 0 / .5);
    --brand:var(--brand-d); --brand-ink:var(--brand-ink-d); --brand-soft:var(--brand-soft-d);
    --toast-action:var(--brand-l);
  }
}
:root[data-theme="dark"]{
  color-scheme:dark;
  --bg:#0E1115; --surface:#161A20; --surface-2:#1E232B; --ink:#E7EAEE; --muted:#A0A8B4;
  --line:#2B313A; --line-strong:#6B7483;
  --success:#74D39B; --success-bg:#15291E; --warn:#F2C063; --warn-bg:#2C2210;
  --danger:#FF8A80; --danger-bg:#34171A; --danger-ink:#2B0A07;
  --toast-bg:#E9ECF0; --toast-ink:#15191F; --toast-ok:#1B6B40; --toast-err:#B3261E;
  --shadow:0 1px 2px rgb(0 0 0 / .4), 0 10px 28px rgb(0 0 0 / .5);
  --brand:var(--brand-d); --brand-ink:var(--brand-ink-d); --brand-soft:var(--brand-soft-d);
  --toast-action:var(--brand-l);
}

*,*::before,*::after{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--font-body);font-size:1rem;line-height:1.55;-webkit-font-smoothing:antialiased}
a{color:var(--brand);text-decoration:underline;text-underline-offset:.16em;text-decoration-thickness:.08em}
a:hover{text-decoration-thickness:.14em}
:focus-visible{outline:3px solid var(--focus);outline-offset:2px}
h1[tabindex="-1"]:focus,main:focus,[tabindex="-1"]:focus:not(:focus-visible){outline:none}
code{font-family:var(--font-mono);font-size:.86em;background:var(--surface-2);padding:.1em .35em;border-radius:4px;overflow-wrap:anywhere}
kbd{font-family:var(--font-mono);font-size:.8rem;border:1px solid var(--line-strong);border-bottom-width:2px;border-radius:4px;padding:0 .4em;background:var(--surface);white-space:nowrap}
.sr-only{position:absolute!important;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap;border:0}
.ic{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex:none}

/* Skip link */
.skip{position:absolute;left:12px;top:-100px;z-index:100;background:var(--brand);color:var(--brand-ink);padding:10px 16px;border-radius:var(--radius-ctl);font-weight:700;text-decoration:none}
.skip:focus{top:calc(8px + env(safe-area-inset-top,0px))}

/* App shell */
.app{height:100%;display:grid;grid-template-rows:auto minmax(0,1fr)}
.appbar{display:flex;align-items:center;gap:8px 14px;flex-wrap:wrap;padding:8px 16px;background:var(--surface);border-bottom:1px solid var(--line);position:relative}
.logo{display:flex;align-items:center;gap:10px;margin-right:auto;min-width:0;position:relative}
.logo-mark{width:36px;height:36px;border-radius:var(--radius-mark);background:var(--brand);color:var(--brand-ink);display:grid;place-items:center;font:var(--display-wt) 1.15rem/1 var(--font-display);flex:none}
.logo-name{font:var(--display-wt) 1.125rem/1.15 var(--font-display);letter-spacing:-.01em;margin:0}
.logo-sub{display:block;font:400 .75rem/1.3 var(--font-body);color:var(--muted);letter-spacing:.02em}
.hdr-ctl{display:flex;align-items:center;gap:8px;position:relative}
.hdr-ctl label{font-weight:700;font-size:.9375rem}
.shell{display:grid;grid-template-columns:minmax(280px,340px) minmax(0,1fr);min-height:0}
.master{overflow:auto;background:var(--surface);border-right:1px solid var(--line);position:relative;overscroll-behavior:contain}
.detail{overflow:auto;position:relative;overscroll-behavior:contain}
.detail-top{display:none}
@media (max-width:799px){
  .shell{grid-template-columns:minmax(0,1fr)}
  .master{border-right:0}
  .shell[data-view="detail"] .master{display:none}
  .shell[data-view="master"] .detail{display:none}
  .detail-top{display:block;padding:10px 16px 0}
}

/* Controls */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:44px;padding:0 18px;border-radius:var(--radius-ctl);border:1.5px solid transparent;font:inherit;font-weight:700;line-height:1.2;cursor:pointer;text-decoration:none;transition:background-color .15s,border-color .15s,transform .1s;text-align:center}
.btn:active{transform:translateY(1px)}
.btn-primary{background:var(--brand);color:var(--brand-ink)}
.btn-primary:hover{background:color-mix(in srgb,var(--brand) 86%,var(--ink))}
.btn-secondary{background:var(--surface);color:var(--ink);border-color:var(--line-strong)}
.btn-secondary:hover{background:var(--surface-2)}
.btn-ghost{background:transparent;color:var(--brand)}
.btn-ghost:hover{background:var(--brand-soft)}
.btn-danger{background:var(--danger);color:var(--danger-ink)}
.btn-danger:hover{background:color-mix(in srgb,var(--danger) 86%,var(--ink))}
.btn[aria-disabled="true"]{opacity:.5;cursor:not-allowed}
.btn[aria-disabled="true"]:active{transform:none}
.btn-row{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.icon-btn{width:44px;height:44px;display:inline-grid;place-items:center;border-radius:var(--radius-ctl);background:transparent;border:0;color:var(--ink);cursor:pointer;flex:none}
.icon-btn:hover{background:var(--surface-2)}
.spinner{width:18px;height:18px;border:2.5px solid currentColor;border-right-color:transparent;border-radius:50%;animation:spin .8s linear infinite;display:none;flex:none}
.is-loading .spinner{display:inline-block}
@keyframes spin{to{transform:rotate(360deg)}}
.input,select{min-height:44px;border:1.5px solid var(--line-strong);border-radius:var(--radius-ctl);background:var(--surface);color:var(--ink);font:inherit;padding:0 14px;max-width:100%}
select{padding-right:10px;cursor:pointer}
.input{width:100%}
.input[aria-invalid="true"]{border-color:var(--danger);border-width:2px}
.input-short{max-width:10rem}
.field{display:grid;gap:6px}
.field>label{font-weight:700}
.opt{font-weight:400;color:var(--muted)}
.hint{font-size:.875rem;color:var(--muted);margin:0;line-height:1.45}
.hint-err{color:var(--danger);font-weight:700}
.err{display:flex;gap:6px;align-items:flex-start;font-size:.9rem;color:var(--danger);font-weight:700;margin:0;line-height:1.4}
.err .ic{width:18px;height:18px;margin-top:1px}
.check-row{display:flex;align-items:center;gap:10px;min-height:44px}
.check-row input{width:22px;height:22px;accent-color:var(--brand);margin:0;flex:none}

/* Master list */
.master-top{position:sticky;top:0;z-index:2;background:var(--surface);padding:16px 16px 12px;border-bottom:1px solid var(--line);display:grid;gap:12px}
.search{display:grid;gap:6px;position:relative}
.search label{font-weight:700;font-size:.9375rem;display:flex;justify-content:space-between;align-items:center}
.search-box{position:relative}
.search-box .ic{position:absolute;left:12px;top:50%;transform:translateY(-50%);color:var(--muted);pointer-events:none}
.search-box .input{padding-left:40px}
.q-status{margin:0;font-size:.8125rem;color:var(--muted)}
.side-nav{padding-bottom:24px;position:relative}
.grp{margin:18px 16px 6px 22px;font-size:.75rem;font-weight:700;letter-spacing:.09em;text-transform:uppercase;color:var(--muted)}
.items{list-style:none;margin:0;padding:0 8px}
.items:first-child{padding-top:8px}
.item{display:grid;grid-template-columns:minmax(0,1fr) auto;align-items:baseline;gap:2px 8px;padding:10px 12px 11px 14px;border-radius:var(--radius-sm);color:inherit;text-decoration:none;position:relative;min-height:44px}
.item:hover{background:var(--surface-2)}
.item[aria-current="page"]{background:var(--brand-soft)}
.item[aria-current="page"]::before{content:"";position:absolute;left:3px;top:10px;bottom:10px;width:4px;border-radius:4px;background:var(--brand)}
.item-title{font-weight:700;line-height:1.3}
.item-short{grid-column:1/-1;font-size:.875rem;color:var(--muted);line-height:1.4}
.item-badge{display:inline-flex;align-items:center;gap:3px;font-size:.75rem;font-weight:700;color:var(--success)}
.item-badge .ic{width:15px;height:15px;stroke-width:2.6}
.list-empty{padding:28px 20px;display:grid;justify-items:start;gap:8px}
.list-empty .ic{width:28px;height:28px;color:var(--muted)}
.le-title{font-weight:700;margin:0}

/* Lesson */
.lesson{max-width:48rem;margin:0 auto;padding:28px 28px 96px;container-type:inline-size}
@media (max-width:599px){.lesson{padding:16px 16px 96px}}
.eyebrow{font-size:.8125rem;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--brand);margin:0 0 8px}
.lesson h1{font:var(--display-wt) clamp(1.75rem,1.3rem + 1.8vw,2.375rem)/1.12 var(--font-display);letter-spacing:-.015em;margin:0 0 14px;text-wrap:balance}
.lesson h2{font:700 1.25rem/1.3 var(--font-display);margin:40px 0 12px;text-wrap:balance}
.rule{font-size:1.1875rem;line-height:1.55;margin:20px 0 0;max-width:62ch}
.pager{display:flex;justify-content:space-between;gap:12px;margin-top:24px;flex-wrap:wrap;position:relative}
.pager a{display:flex;flex-direction:column;gap:2px;padding:12px 16px;border:1.5px solid var(--line);border-radius:var(--radius-lg);text-decoration:none;color:inherit;flex:1 1 220px;min-width:0;font-weight:700}
.pager a:hover{border-color:var(--line-strong);background:var(--surface)}
.pager small{font-weight:400;color:var(--muted);font-size:.8125rem}
.pager .next{text-align:right}
.back{display:inline-flex;align-items:center;gap:4px;min-height:44px;padding:0 12px 0 6px;font-weight:700;text-decoration:none;border-radius:var(--radius-ctl);position:relative}
.back:hover{background:var(--surface-2)}

/* Start page */
.start-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px;margin-top:28px}
.tile{padding:16px 18px;border:1.5px solid var(--line);border-radius:var(--radius-lg);background:var(--surface);display:grid;gap:6px;align-content:start}
.tile h3{margin:0;font:700 1rem/1.3 var(--font-body);display:flex;gap:8px;align-items:center}
.tile p{margin:0;font-size:.9375rem;color:var(--muted)}
.tile .btn{justify-self:start;margin-top:6px}
.empty{display:grid;justify-items:start;gap:10px;padding-top:24px}
.empty>.ic{width:40px;height:40px;color:var(--muted)}

/* Toasts */
.toasts{position:fixed;left:0;right:0;bottom:0;z-index:50;display:flex;flex-direction:column;align-items:center;gap:8px;padding:16px 16px calc(16px + env(safe-area-inset-bottom,0px));pointer-events:none}
@media (min-width:800px){.toasts{align-items:flex-end;padding-right:24px}}
.toast{pointer-events:auto;position:relative;display:flex;align-items:center;gap:8px;width:min(100%,440px);padding:8px 6px 8px 14px;min-height:56px;background:var(--toast-bg);color:var(--toast-ink);border-radius:var(--radius-lg);box-shadow:var(--shadow);overflow:hidden;animation:toast-in .24s cubic-bezier(.2,.8,.2,1)}
.toast.leaving{animation:toast-out .16s ease-in forwards}
.toast-ic{display:grid;color:var(--toast-action)}
.toast-success .toast-ic{color:var(--toast-ok)}
.toast-error .toast-ic{color:var(--toast-err)}
.toast-msg{margin:0;flex:1;font-size:.9375rem;line-height:1.4;padding:6px 0}
.toast-action{background:transparent;border:0;color:var(--toast-action);font:inherit;font-weight:700;min-height:44px;padding:0 12px;border-radius:var(--radius-sm);cursor:pointer;flex:none}
.toast-action:hover,.toast .icon-btn:hover{background:color-mix(in srgb,var(--toast-ink) 12%,transparent)}
.toast .icon-btn{color:var(--toast-ink)}
.toast :focus-visible{outline-color:var(--toast-action)}
.toast-timer{position:absolute;left:0;bottom:0;height:3px;width:100%;background:var(--toast-action);transform-origin:left;animation:toast-timer linear forwards}
.toast:hover .toast-timer,.toast:focus-within .toast-timer{animation-play-state:paused}
@keyframes toast-in{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:none}}
@keyframes toast-out{to{opacity:0;transform:translateY(8px)}}
@keyframes toast-timer{from{transform:scaleX(1)}to{transform:scaleX(0)}}

.chips{list-style:none;margin:0;padding:0;display:flex;flex-wrap:wrap;gap:6px}
.chips a{display:inline-flex;align-items:center;gap:6px;min-height:40px;padding:0 12px;border:1.5px solid var(--line-strong);border-radius:var(--radius-ctl);background:var(--surface);color:var(--ink);text-decoration:none;font-weight:700;font-size:.9375rem}
.chips a:hover{background:var(--surface-2)}
.chips a[aria-current="page"]{background:var(--brand);border-color:var(--brand);color:var(--brand-ink)}
.chips .ic{width:18px;height:18px}
.code{margin:0;padding:12px 14px;font:400 .8125rem/1.55 var(--font-mono);overflow-x:auto;white-space:pre;tab-size:2}
.code code{background:none;padding:0;font-size:inherit;overflow-wrap:normal}
.count{margin:16px 0 0;font-weight:700;color:var(--muted);min-height:1.5em}
.table{width:100%;border-collapse:collapse;font-size:.9375rem}
.table th,.table td{text-align:left;padding:8px 10px;border-bottom:1px solid var(--line);vertical-align:top}
.table th{font-weight:700;white-space:nowrap}
.table-wrap{overflow-x:auto;border:1px solid var(--line);border-radius:var(--radius-lg)}
/* Seitenleiste im Stil einer Doku: Kapitel als Überschrift, Einträge darunter */
.grp{display:block;text-decoration:none}
a.grp:hover{color:var(--brand)}
a.grp[aria-current="page"]{color:var(--brand)}
.items .item{grid-template-columns:minmax(0,1fr);min-height:36px;padding:6px 12px 6px 14px}
.item code{background:none;padding:0;font-size:.875rem;font-weight:600}
.item.item-page{padding-top:10px;padding-bottom:11px}
@media (pointer:coarse){.items .item{min-height:44px;align-content:center}}
.hdr-link{display:inline-flex;align-items:center;gap:6px;min-height:44px;padding:0 12px;font-weight:700;text-decoration:none;border-radius:var(--radius-ctl)}
.hdr-link:hover{background:var(--surface-2)}
.hdr-link .ic{width:18px;height:18px}
@media (max-width:479px){.hdr-long{display:none}.appbar{flex-wrap:nowrap}}
.xlink::after{content:" ↗"}
/* CSS-Atlas */
:root{--ca-hl:#DB2777;--ca-hl-bg:rgb(219 39 119 / .14)}
.ca-toc{margin-top:20px;position:relative}
.ca-toc code{background:none;padding:0;font-size:.875rem}
.ca-entry{padding:28px 0 32px;border-bottom:1px solid var(--line);scroll-margin-top:16px;position:relative}
.ca-entry.ca-hit{border:2px solid var(--brand);border-radius:var(--radius-lg);padding:22px 16px 26px;margin:12px -16px 0;box-shadow:0 0 0 4px var(--brand-soft)}
.lesson .ca-entry h2{margin:0;display:flex;flex-wrap:wrap;align-items:baseline;gap:4px 12px}
.ca-entry h2 code{font-size:1.25rem;background:none;padding:0;color:var(--brand)}
.ca-sub{font:400 1rem/1.4 var(--font-body);color:var(--muted)}
.ca-desc{margin:8px 0 14px;max-width:68ch}
.ca-vals{border:0;margin:0 0 12px;padding:0;display:flex;flex-wrap:wrap;gap:6px;min-width:0;position:relative}
.ca-vals label{position:relative;display:inline-flex;align-items:center;min-height:36px;padding:0 10px;border:1.5px solid var(--line-strong);border-radius:var(--radius-sm);background:var(--surface);cursor:pointer}
.ca-vals label:hover{background:var(--surface-2)}
.ca-vals input{position:absolute;inset:0;opacity:0;margin:0;cursor:pointer}
.ca-vals code{background:none;padding:0;font-size:.8125rem}
.ca-vals label:has(input:checked){background:var(--brand);border-color:var(--brand);color:var(--brand-ink)}
.ca-vals label:has(input:focus-visible){outline:3px solid var(--focus);outline-offset:2px}
.ca-stage{position:relative;isolation:isolate;overflow:hidden;padding:20px;min-height:96px;border:1.5px dashed var(--line-strong);border-radius:var(--radius-lg);
  background:radial-gradient(var(--line) 1px,transparent 1.2px) 0 0/14px 14px,var(--surface)}
.ca-meas,.ca-note{margin:8px 0 0;font-size:.875rem;font-weight:700;color:var(--muted)}
.ca-note{color:var(--ink);font-weight:400;padding:8px 12px;border-left:4px solid var(--brand);background:var(--brand-soft);border-radius:0 var(--radius-sm) var(--radius-sm) 0;max-width:68ch}
.ca-codebox{margin-top:12px;border:1.5px solid var(--line);border-radius:var(--radius-lg);background:var(--surface);overflow:hidden;position:relative}
.ca-pre{background:var(--surface)}
.ca-hl{background:var(--brand-soft);color:var(--brand);font-weight:700;border-radius:3px}
.ca-tw{margin:0;padding:8px 14px;border-top:1px solid var(--line);font-size:.8125rem;color:var(--muted);background:var(--surface-2)}
.ca-tw code{background:none;padding:0;color:var(--ink)}
.ca-tip{margin:12px 0 0;padding:10px 14px;border-left:4px solid var(--warn);background:var(--warn-bg);border-radius:0 var(--radius-sm) var(--radius-sm) 0;font-size:.9375rem;max-width:68ch;position:relative}
.ca-links{margin:10px 0 0;font-size:.875rem;color:var(--muted)}
.ca-find{margin:8px 0 0;position:relative}
.ca-index code{background:none;padding:0}
/* Bausteine der Vorschau */
.ca-i{display:grid;place-items:center;min-width:48px;min-height:48px;padding:8px 12px;border-radius:8px;color:#FFFFFF;font:700 .9375rem/1.25 var(--font-mono);text-align:center}
.ca-t1{background:#6D28D9}.ca-t2{background:#BE185D}.ca-t3{background:#0369A1}.ca-t4{background:#047857}
.ca-c{border-radius:8px;outline:1.5px solid color-mix(in srgb,var(--line-strong) 60%,transparent);outline-offset:4px}
.ca-flow{margin:0;line-height:1.9;max-width:44ch}
.ca-flow .ca-i{padding:6px 10px}
.ca-scroll{height:170px;overflow:auto;padding:0 12px;border:1px solid var(--line);border-radius:8px;background:var(--surface)}
.ca-scroll p{margin:10px 0;font-size:.875rem;max-width:40ch}
.ca-pos{width:90px;z-index:1}
.ca-outer{position:relative;min-height:190px;padding:28px 12px 12px;border:1.5px dashed #0369A1;border-radius:8px}
.ca-parent{min-height:110px;margin-top:8px;padding:28px 12px 12px;border:1.5px dashed #BE185D;border-radius:8px;width:62%}
.ca-lbl{position:absolute;margin-top:-22px;font:600 .75rem/1.2 var(--font-mono);color:var(--muted)}
.ca-stack{position:relative;height:150px}
.ca-stack .ca-i{position:absolute;width:110px;height:80px;box-shadow:0 4px 10px rgb(0 0 0 / .25)}
.ca-z1{left:0;top:0}.ca-z2{left:60px;top:30px}.ca-z3{left:120px;top:60px}

/* ---------- Toasts ---------- */
const toastBox=$('#toasts');
let activeUndo=null;
function announce(text,assertive){
  const r=$(assertive?'#live-assert':'#live-polite');
  r.textContent='';
  setTimeout(()=>{r.textContent=text},60);
}
function toast({msg,type='info',action,duration}){
  duration=duration??(action?8000:5000);
  const t=document.createElement('div');
  t.className='toast toast-'+type;
  t.innerHTML=`<span class="toast-ic">${ic(type==='success'?'ok':type==='error'?'alert':'info')}</span><p class="toast-msg"></p>`;
  $('.toast-msg',t).textContent=msg;
  let actionBtn=null;
  if(action){
    actionBtn=document.createElement('button');
    actionBtn.type='button';actionBtn.className='toast-action';actionBtn.textContent=action.label;
    t.append(actionBtn);
  }
  const closeBtn=document.createElement('button');
  closeBtn.type='button';closeBtn.className='icon-btn';closeBtn.setAttribute('aria-label','Meldung schließen');closeBtn.innerHTML=ic('x');
  t.append(closeBtn);
  const timer=document.createElement('span');
  timer.className='toast-timer';timer.style.animationDuration=duration+'ms';
  t.append(timer);
  toastBox.append(t);
  while(toastBox.children.length>3) toastBox.firstElementChild.remove();

  let remaining=duration,start=Date.now(),id=setTimeout(close,remaining),closed=false;
  function pause(){clearTimeout(id);remaining-=Date.now()-start}
  function resume(){start=Date.now();clearTimeout(id);id=setTimeout(close,Math.max(remaining,1200))}
  function close(){
    if(closed)return;closed=true;clearTimeout(id);
    if(activeUndo&&activeUndo.toast===t) activeUndo=null;
    const hadFocus=t.contains(document.activeElement);
    const done=()=>{t.remove();if(hadFocus) focusMainHeading()};
    if(reducedMotion()) done(); else {t.classList.add('leaving');setTimeout(done,170)}
  }
  t.addEventListener('mouseenter',pause);
  t.addEventListener('mouseleave',()=>{if(!t.contains(document.activeElement))resume()});
  t.addEventListener('focusin',pause);
  t.addEventListener('focusout',e=>{if(!t.contains(e.relatedTarget)&&!t.matches(':hover'))resume()});
  closeBtn.addEventListener('click',close);
  if(action){
    const run=()=>{action.fn();close()};
    actionBtn.addEventListener('click',run);
    activeUndo={toast:t,run};
  }
  announce(msg+(action?` ${action.label} mit Strg plus Z.`:''),type==='error');
  return close;
}

{id:'z-index',cat:'layout',name:'z-index',sub:'Was liegt oben?',mdn:'z-index',
 desc:'<code>z-index</code> ordnet übereinanderliegende positionierte Elemente: Der höhere Wert liegt oben. Ohne Angabe gilt die Reihenfolge im DOM – das spätere Element liegt oben.',
 stage:`<div class="ca-stack"><div class="ca-i ca-t1 ca-z1">1</div><div class="ca-i ca-t2 ca-z2">2</div><div class="ca-i ca-t3 ca-z3">3</div></div>`,
 base:[['.ca-z2','.karte-2',{position:'absolute'}]],t:['.ca-z2','.karte-2'],
 vals:[['auto','auto','z-auto'],['10','10','z-10'],['-1','-1','-z-1']],
 tip:'<code>z-index</code> wirkt nur innerhalb desselben Stacking Context. <code>opacity</code> unter 1, <code>transform</code> oder <code>isolation: isolate</code> erzeugen einen neuen – dann hilft auch <code>z-index: 9999</code> nicht gegen ein Element außerhalb. Diese Vorschau hat <code>isolation: isolate</code>, sonst würde −1 hinter ihrem Hintergrund verschwinden.'},
{id:'overflow',cat:'layout',name:'overflow',sub:'Wenn der Inhalt größer ist als der Kasten',mdn:'overflow',
 desc:'Der gestrichelte Kasten ist 90 px hoch, der Text länger. <code>overflow</code> entscheidet, was mit dem Rest passiert.',
 stage:`<div class="ca-ovf" tabindex="0" role="region" aria-label="Kasten mit zu viel Text"><p>Dieser Text ist länger, als der Kasten hoch ist. visible lässt ihn einfach herausragen, hidden schneidet ihn ab, auto zeigt eine Scrollleiste nur bei Bedarf und scroll immer. Abgeschnittener Text ist für alle weg, die ihn brauchen.</p></div>`,
 t:['.ca-ovf','.kasten'],vals:[['visible','visible','overflow-visible'],['hidden','hidden','overflow-hidden'],['auto','auto','overflow-auto'],['scroll','scroll','overflow-scroll']],
 tip:'Scrollbare Bereiche brauchen <code>tabindex="0"</code> und einen Namen, sonst kommt man per Tastatur nicht hinein. Und <code>overflow: hidden</code> an einem Vorfahren bricht <code>position: sticky</code>.'},
{id:'box-sizing',cat:'layout',name:'box-sizing',sub:'Was width eigentlich meint',mdn:'box-sizing',
 desc:'Bei <code>content-box</code> (Standard) meint <code>width</code> nur den Inhalt – Padding und Rahmen kommen dazu. Bei <code>border-box</code> ist alles in der Breite enthalten.',
 stage:`<div class="ca-i ca-t4 ca-bs">width: 200px</div>`,
 base:[['.ca-bs','.box',{width:'200px',padding:'20px',border:'6px solid #FCD34D'}]],t:['.ca-bs','.box'],
 vals:[['content-box','content-box','box-content'],['border-box','border-box','box-border']],
 measure:st=>`Gemessene Breite: ${$('.ca-bs',st).offsetWidth} px`,
 tip:'Fast jedes Projekt setzt global <code>*, *::before, *::after { box-sizing: border-box }</code> – Tailwind und diese App auch. Dann heißt 200 px wirklich 200 px.'},
/* Flexbox */
{id:'flex-direction',cat:'flex',name:'flex-direction',sub:'Welche Achse ist die Hauptachse?',mdn:'flex-direction',
 desc:'<code>flex-direction</code> legt die Hauptachse fest: waagrecht (<code>row</code>) oder senkrecht (<code>column</code>). <code>justify-content</code> arbeitet immer entlang der Hauptachse, <code>align-items</code> quer dazu.',
 stage:cC(cN(3)),base:FLEX,t:['.ca-c','.container'],
 vals:[['row','row','flex-row'],['row-reverse','row-reverse','flex-row-reverse'],['column','column','flex-col'],['column-reverse','column-reverse','flex-col-reverse']],
 tip:`<code>-reverse</code> dreht nur die Optik. Tab-Taste und Screenreader folgen weiter dem DOM – das verletzt schnell ${W1412}.`},
{id:'justify-content',cat:'flex',name:'justify-content',sub:'Verteilung entlang der Hauptachse',mdn:'justify-content',
 desc:'<code>justify-content</code> verteilt den freien Platz entlang der Hauptachse: alles an den Anfang, in die Mitte, ans Ende – oder als Abstand zwischen die Elemente.',
 stage:cC(cN(3)),base:FLEX,t:['.ca-c','.container'],
 vals:[['flex-start','flex-start','justify-start'],['center','center','justify-center'],['flex-end','flex-end','justify-end'],['space-between','space-between','justify-between'],['space-around','space-around','justify-around'],['space-evenly','space-evenly','justify-evenly']],
 tip:'Wirkt nur, wenn Platz übrig ist. Hat ein Element <code>flex: 1</code>, frisst es den ganzen Platz, und <code>justify-content</code> ändert sichtbar nichts.'},
{id:'align-items',cat:'flex',name:'align-items',sub:'Ausrichtung quer zur Hauptachse',mdn:'align-items',
 desc:'<code>align-items</code> richtet die Elemente quer zur Hauptachse aus. <code>stretch</code> (Standard) zieht sie auf die volle Höhe, <code>baseline</code> richtet die Textgrundlinien aneinander aus.',
 stage:cC(`${cI(1)}<div class="ca-i ca-t2 ca-n2" style="padding:26px 14px">2</div><div class="ca-i ca-t3 ca-n3" style="font-size:1.5rem">3</div>`),
 base:[['.ca-c','.container',{display:'flex',gap:'8px','min-height':'150px'}]],t:['.ca-c','.container'],
 vals:[['stretch','stretch','items-stretch'],['flex-start','flex-start','items-start'],['center','center','items-center'],['flex-end','flex-end','items-end'],['baseline','baseline','items-baseline']],
 tip:'Das klassische „senkrecht zentrieren“ ist <code>display: flex; align-items: center</code>. Eine feste Höhe am Element schaltet <code>stretch</code> ab.'},
{id:'flex-wrap',cat:'flex',name:'flex-wrap',sub:'Umbrechen oder quetschen',mdn:'flex-wrap',
 desc:'Standardmäßig bleibt alles in einer Zeile. Mit <code>flex-wrap: wrap</code> brechen Elemente in die nächste Zeile um, sobald der Platz nicht reicht.',
 stage:cC(cN(8)),base:[...FLEX,['.ca-i','.item',{width:'72px','flex-shrink':'0'}]],t:['.ca-c','.container'],
 vals:[['nowrap','nowrap','flex-nowrap'],['wrap','wrap','flex-wrap'],['wrap-reverse','wrap-reverse','flex-wrap-reverse']],
 tip:'Ohne <code>wrap</code> laufen Inhalte auf schmalen Bildschirmen aus dem Container – ein häufiger Grund für seitliches Scrollen (<a class="xlink" href="https://daniel-hopium.github.io/pattern-library/#wcag-kriterien/1.4.10">WCAG 1.4.10</a>).'},
{id:'gap',cat:'flex',name:'gap',sub:'Abstand zwischen den Elementen',mdn:'gap',
 desc:'<code>gap</code> setzt den Abstand zwischen den Elementen – nur dazwischen, nie außen herum. Funktioniert in Flexbox und Grid.',
 stage:cC(cN(6)),base:[['.ca-c','.container',{display:'flex','flex-wrap':'wrap'}]],t:['.ca-c','.container'],
 vals:[['0','0','gap-0'],['8px','8px','gap-2'],['16px','16px','gap-4'],['32px','32px','gap-8']],def:2,
 tip:'Früher brauchte man dafür <code>margin</code> an jedem Element und eine negative Margin am Container. Heute nicht mehr. <code>row-gap</code> und <code>column-gap</code> trennen die Richtungen.'},
{id:'flex',cat:'flex',name:'flex',sub:'Wachsen, schrumpfen, Ausgangsgröße',mdn:'flex',
 desc:'<code>flex</code> ist die Kurzform für <code>flex-grow</code>, <code>flex-shrink</code> und <code>flex-basis</code>: Wie stark darf ein Element wachsen, wie stark schrumpfen – und von welcher Größe aus?',
 stage:cC(`${cI(1,'Kurz')}${cI(2,'Ein deutlich längerer Text')}${cI(3,'Mittel')}`),base:FLEX,t:['.ca-i','.item'],
 vals:[['initial','0 1 auto','flex-initial'],['1','1 1 0%','flex-1'],['auto','1 1 auto','flex-auto'],['none','none','flex-none']],
 tip:'<code>flex: 1</code> startet bei Breite 0 und verteilt den Platz gleichmäßig – alle Spalten werden gleich breit, egal wie viel Text drinsteht. <code>flex: auto</code> startet bei der Inhaltsbreite: Längerer Text bekommt mehr.'},
{id:'min-width-0',cat:'flex',name:'min-width: 0',sub:'Warum Text in Flexbox nicht kürzt',mdn:'min-width',
 desc:'Flex-Elemente schrumpfen standardmäßig nicht unter die Breite ihres Inhalts – <code>min-width</code> steht dort auf <code>auto</code>. Ein langer Dateiname sprengt dann den Container, statt mit … gekürzt zu werden.',
 stage:cC(`${cI(1,'PDF')}<div class="ca-mw"><p class="ca-trunc">Rechnung_2026_Kunde_Maier_Jänner_final_v2.pdf</p><p class="ca-small">vor 3 Tagen</p></div>`,'ca-narrow'),
 base:[['.ca-c','.zeile',{display:'flex',gap:'8px','align-items':'center'}]],t:['.ca-mw','.text-spalte'],
 vals:[['auto',{'min-width':'auto'},'min-w-auto'],['0',{'min-width':'0'},'min-w-0']],
 tip:'Die Lösung gehört ans Flex-Element, das den Text enthält – nicht an den Text selbst. In Grid gilt dasselbe: <code>minmax(0, 1fr)</code> statt <code>1fr</code>.'},
{id:'align-self',cat:'flex',name:'align-self',sub:'Ein Element tanzt aus der Reihe',mdn:'align-self',
 desc:'<code>align-self</code> überschreibt <code>align-items</code> für ein einzelnes Element – hier für Nummer 2.',
 stage:cC(cN(3)),base:[['.ca-c','.container',{display:'flex',gap:'8px','align-items':'flex-start','min-height':'150px'}]],t:['.ca-n2','.item-2'],
 vals:[['auto','auto','self-auto'],['flex-start','flex-start','self-start'],['center','center','self-center'],['flex-end','flex-end','self-end'],['stretch','stretch','self-stretch']],
 tip:'Bei <code>stretch</code> darf das Element keine feste Höhe haben, sonst passiert nichts.'},
{id:'order',cat:'flex',name:'order',sub:'Reihenfolge nur für das Auge',mdn:'order',
 desc:'<code>order</code> ändert die Reihenfolge der Darstellung, ohne das HTML anzufassen. Kleinere Werte kommen zuerst, Standard ist 0. Hier gilt es für Nummer 3.',
 stage:cC(cN(4)),base:FLEX,t:['.ca-n3','.item-3'],
 vals:[['0','0','order-none'],['-1','-1','-order-1'],['9999','9999','order-last']],
 tip:`Nur die Optik ändert sich: Tab-Taste und Screenreader folgen weiter dem DOM. Wer so die Reihenfolge wirklich umbaut, verletzt ${W1412} – besser das HTML umsortieren.`},
/* Grid */
{id:'grid-template-columns',cat:'grid',name:'grid-template-columns',sub:'Die Spalten festlegen',mdn:'grid-template-columns',
 desc:'<code>grid-template-columns</code> legt die Spalten fest. <code>fr</code> ist ein Anteil am freien Platz: <code>1fr 2fr</code> heißt, die zweite Spalte bekommt doppelt so viel.',
 stage:cC(cN(6)),base:GRID,t:['.ca-c','.container'],
 vals:[['repeat(2, 1fr)','repeat(2, 1fr)','grid-cols-2'],['repeat(3, 1fr)','repeat(3, 1fr)','grid-cols-3'],['200px 1fr','200px 1fr','grid-cols-[200px_1fr]'],['1fr 2fr','1fr 2fr','grid-cols-[1fr_2fr]'],['repeat(auto-fit, minmax(90px, 1fr))','repeat(auto-fit, minmax(90px, 1fr))','grid-cols-[repeat(auto-fit,minmax(90px,1fr))]']],
 tip:'<code>repeat(auto-fit, minmax(90px, 1fr))</code> ist der Responsive-Klassiker: so viele Spalten, wie mit mindestens 90 px hineinpassen – ganz ohne Media Query. Zieh das Fenster schmaler.'},
{id:'grid-column',cat:'grid',name:'grid-column',sub:'Über mehrere Spalten reichen',mdn:'grid-column',
 desc:'<code>grid-column</code> legt fest, über wie viele Spalten ein Element reicht – hier Nummer 1 in einem Raster mit drei Spalten.',
 stage:cC(cN(6)),base:[['.ca-c','.container',{display:'grid',gap:'8px','grid-template-columns':'repeat(3, 1fr)'}]],t:['.ca-n1','.item-1'],
 vals:[['auto','auto','col-auto'],['span 2','span 2','col-span-2'],['span 3','span 3','col-span-3'],['1 / -1','1 / -1','col-span-full']],
 tip:'<code>1 / -1</code> heißt „von der ersten bis zur letzten Linie“: volle Breite, auch wenn sich die Spaltenzahl ändert. Negative Linien zählen von hinten.'},
{id:'auto-fill-fit',cat:'grid',name:'auto-fill vs. auto-fit',sub:'Leere Spalten behalten oder weglassen',mdn:'repeat',
 desc:'Beide erzeugen so viele Spalten, wie hineinpassen. Der Unterschied zeigt sich erst, wenn es weniger Elemente als Spalten gibt: <code>auto-fill</code> behält die leeren Spalten, bei <code>auto-fit</code> fallen sie weg und die vorhandenen Elemente wachsen.',
 stage:cC(cN(3)),base:GRID,t:['.ca-c','.container'],
 vals:[['auto-fill',{'grid-template-columns':'repeat(auto-fill, minmax(80px, 1fr))'},'grid-cols-[repeat(auto-fill,minmax(80px,1fr))]'],['auto-fit',{'grid-template-columns':'repeat(auto-fit, minmax(80px, 1fr))'},'grid-cols-[repeat(auto-fit,minmax(80px,1fr))]']],
 tip:'Für Kartenraster meist <code>auto-fit</code>. <code>auto-fill</code>, wenn wenige Karten nicht riesig werden sollen.'},
{id:'place-items',cat:'grid',name:'place-items',sub:'Wo sitzt das Element in seiner Zelle?',mdn:'place-items',
 desc:'<code>place-items</code> ist die Kurzform für <code>align-items</code> und <code>justify-items</code>: wo ein Element innerhalb seiner Zelle sitzt, senkrecht und waagrecht.',
 stage:cC(cN(3)),base:[['.ca-c','.container',{display:'grid',gap:'8px','grid-template-columns':'repeat(3, 1fr)','grid-auto-rows':'100px'}]],t:['.ca-c','.container'],
 vals:[['stretch','stretch','place-items-stretch'],['start','start','place-items-start'],['center','center','place-items-center'],['end','end','place-items-end']],
 tip:'<code>display: grid; place-items: center</code> ist die kürzeste Art, etwas in die Mitte zu setzen.'},
{id:'grid-template-areas',cat:'grid',name:'grid-template-areas',sub:'Layout als ASCII-Bild',mdn:'grid-template-areas',
 desc:'Jedes Kind bekommt mit <code>grid-area</code> einen Namen, der Container zeichnet das Layout mit diesen Namen wie ein kleines Bild.',
 stage:cC(['head','nav','main','foot'].map((a,i)=>`<div class="ca-i ca-t${i+1}" style="grid-area:${a}">${a}</div>`).join('')),
 base:[['.ca-c','.container',{display:'grid',gap:'8px','min-height':'200px'}]],t:['.ca-c','.container'],
 vals:[['Desktop',{'grid-template-columns':'110px 1fr','grid-template-areas':'"head head" "nav main" "foot foot"'},'grid-cols-[110px_1fr] [grid-template-areas:…]'],['Mobil',{'grid-template-columns':'1fr','grid-template-areas':'"head" "main" "nav" "foot"'},'grid-cols-1 [grid-template-areas:…]'],['Seitenleiste',{'grid-template-columns':'110px 1fr','grid-template-areas':'"nav head" "nav main" "nav foot"'},'grid-cols-[110px_1fr] [grid-template-areas:…]']],
 tip:`Tailwind hat dafür keine eigene Utility, nur den Umweg über eckige Klammern. Und Vorsicht: In „Mobil“ steht main vor nav, der DOM bleibt aber gleich – ${W1412} im Blick behalten.`},
/* Box */
{id:'box-model',cat:'box',name:'Box Model',sub:'Inhalt, Padding, Rahmen, Margin',mdn:'CSS_box_model/Introduction_to_the_CSS_box_model',
 desc:'Jedes Element ist ein Kasten aus vier Schichten: Inhalt, Padding (Innenabstand, trägt die Hintergrundfarbe), Border (Rahmen) und Margin (Außenabstand, immer durchsichtig). Die Farben entsprechen denen der Browser-DevTools.',
 stage:`<div class="ca-bm-wrap"><div class="ca-bm"><div class="ca-bm-c">Inhalt</div></div></div><ul class="ca-legend" aria-label="Legende"><li><i style="background:#8CB6C0"></i>Inhalt</li><li><i style="background:#C3D08B"></i>Padding</li><li><i style="background:#E8C46A"></i>Border</li><li><i class="ca-hatch"></i>Margin</li></ul>`,
 t:['.ca-bm','.box'],
 vals:[['nur Inhalt',{padding:'0',border:'0 solid #E8C46A',margin:'0'},'p-0'],['+ padding',{padding:'20px',border:'0 solid #E8C46A',margin:'0'},'p-5'],['+ border',{padding:'20px',border:'8px solid #E8C46A',margin:'0'},'p-5 border-8'],['+ margin',{padding:'20px',border:'8px solid #E8C46A',margin:'24px'},'p-5 border-8 m-6']],
 tip:'Padding gehört zum Element: Es ist klickbar und hat Hintergrund. Margin ist Abstand zu den Nachbarn. Für Abstände zwischen Geschwistern ist <code>gap</code> am Eltern-Element meist die bessere Wahl.'},
{id:'margin-collapse',cat:'box',name:'Margin Collapsing',sub:'Warum 24 + 24 nicht 48 ergibt',mdn:'CSS_box_model/Mastering_margin_collapsing',
 desc:'Senkrechte Margins zweier Blöcke untereinander addieren sich nicht, sie fallen zusammen: Es gilt die größere. In Flex- und Grid-Containern passiert das nicht.',
 stage:`<div class="ca-mc">${cI(1,'margin-bottom: 24px')}${cI(2,'margin-top: 24px')}</div>`,
 base:[['.ca-n1','.oben',{'margin-bottom':'24px'}],['.ca-n2','.unten',{'margin-top':'24px'}]],t:['.ca-mc','.container'],
 vals:[['block',{display:'block'},'block'],['flex (Spalte)',{display:'flex','flex-direction':'column'},'flex flex-col'],['grid',{display:'grid'},'grid']],
 measure:st=>{const a=$('.ca-n1',st).getBoundingClientRect(),b=$('.ca-n2',st).getBoundingClientRect();return `Abstand zwischen den beiden: ${Math.round(b.top-a.bottom)} px`},
 tip:'Auch die Margin eines ersten Kindes kann durch das Eltern-Element „durchfallen“ und außen landen. Abhilfe: Padding am Eltern-Element, <code>display: flow-root</code> – oder gleich <code>gap</code> statt Margin.'},
{id:'width',cat:'box',name:'width & max-width',sub:'Feste, relative und begrenzte Breite',mdn:'width',
 desc:'<code>width</code> setzt eine feste oder relative Breite. Block-Elemente sind ohne Angabe (<code>auto</code>) so breit wie ihr Eltern-Element. <code>max-width</code> setzt eine Obergrenze.',
 stage:`<div class="ca-c">${cI(1,'Element')}</div>`,t:['.ca-n1','.box'],
 vals:[['auto',{width:'auto'},'w-auto'],['50%',{width:'50%'},'w-1/2'],['480px',{width:'480px'},'w-[480px]'],['100% + max 480px',{width:'100%','max-width':'480px'},'w-full max-w-[480px]']],
 measure:st=>`Gemessene Breite: ${$('.ca-n1',st).offsetWidth} px`,
 tip:'Feste Breiten brechen auf schmalen Bildschirmen aus dem Layout – zieh das Fenster schmal und vergleiche <code>480px</code> mit „100 % + max 480px“. Das Zweite ist fast immer, was man will.'},
{id:'aspect-ratio',cat:'box',name:'aspect-ratio',sub:'Höhe aus der Breite',mdn:'aspect-ratio',
 desc:'<code>aspect-ratio</code> legt das Seitenverhältnis fest: Die Höhe ergibt sich aus der Breite.',
 stage:`<div class="ca-c">${cI(1,'50 % breit')}</div>`,base:[['.ca-n1','.box',{width:'50%'}]],t:['.ca-n1','.box'],
 vals:[['auto','auto','aspect-auto'],['1 / 1','1 / 1','aspect-square'],['16 / 9','16 / 9','aspect-video'],['4 / 3','4 / 3','aspect-[4/3]']],
 measure:st=>{const e=$('.ca-n1',st);return `${e.offsetWidth} × ${e.offsetHeight} px`},
 tip:'Für Bilder und Videos, die erst nachladen, reserviert <code>aspect-ratio</code> den Platz vorab – kein Layout Shift. Bei <code>&lt;img&gt;</code> reichen dafür die Attribute <code>width</code> und <code>height</code>.'},
/* Typografie */
{id:'font-size',cat:'type',name:'font-size',sub:'Schriftgröße',mdn:'font-size',
 desc:'<code>rem</code> bezieht sich auf die Grundgröße des Browsers, meist 16 px – und wächst mit, wenn jemand sie in den Einstellungen erhöht.',
 stage:`<p class="ca-text">Schriftgröße</p>`,t:['.ca-text','.text'],
 vals:[['1rem','1rem','text-base'],['1.5rem','1.5rem','text-2xl'],['2.25rem','2.25rem','text-4xl'],['clamp(1rem, 4vw, 2.5rem)','clamp(1rem, 4vw, 2.5rem)','text-[clamp(1rem,4vw,2.5rem)]']],
 tip:'<code>px</code>-Schriftgrößen ignorieren die Schrifteinstellung im Browser (<a class="xlink" href="https://daniel-hopium.github.io/pattern-library/#wcag-kriterien/1.4.4">WCAG 1.4.4</a>). <code>clamp(min, bevorzugt, max)</code> wächst mit der Fensterbreite, bleibt aber in Grenzen.'},
{id:'font-weight',cat:'type',name:'font-weight',sub:'Strichstärke',mdn:'font-weight',
 desc:'<code>font-weight</code> bestimmt, wie fett die Schrift ist. Nicht jede Schrift hat jede Stärke.',
 stage:`<p class="ca-text" style="font-size:1.5rem">Gewicht der Schrift</p>`,t:['.ca-text','.text'],
 vals:[['400','400','font-normal'],['500','500','font-medium'],['700','700','font-bold'],['800','800','font-extrabold']],
 tip:'Diese App lädt Atkinson Hyperlegible nur in 400 und 700 – darum sieht 500 hier aus wie 400 und 800 wie 700. Fehlt eine fette Stärke ganz, rechnet der Browser eine unschöne Kunst-Fettung.'},
{id:'line-height',cat:'type',name:'line-height',sub:'Zeilenabstand',mdn:'line-height',
 desc:'<code>line-height</code> ist der Abstand von Zeile zu Zeile. Ohne Einheit ist es ein Faktor der Schriftgröße – und wird richtig vererbt.',
 stage:`<p class="ca-text ca-w360">Zu enge Zeilen kleben aneinander, zu weite zerfallen in einzelne Streifen. Für Fließtext hat sich ein Faktor um 1,5 bewährt, große Überschriften vertragen weniger.</p>`,t:['.ca-text','.text'],
 vals:[['1','1','leading-none'],['1.25','1.25','leading-tight'],['1.5','1.5','leading-normal'],['2','2','leading-loose']],def:2,
 tip:'Mit Einheit (<code>line-height: 24px</code>) erben Kinder mit anderer Schriftgröße einen unpassenden Wert. <a class="xlink" href="https://daniel-hopium.github.io/pattern-library/#wcag-kriterien/1.4.12">WCAG 1.4.12</a> testet genau mit 1,5.'},
{id:'letter-spacing',cat:'type',name:'letter-spacing',sub:'Buchstabenabstand',mdn:'letter-spacing',
 desc:'<code>letter-spacing</code> ändert den Abstand zwischen den Buchstaben. In <code>em</code> angegeben, wächst er mit der Schriftgröße.',
 stage:`<p class="ca-text ca-caps">Kapitelüberschrift</p><p class="ca-text">Normaler Text in Kleinbuchstaben.</p>`,t:['.ca-text','.text'],
 vals:[['-0.025em','-0.025em','tracking-tight'],['normal','normal','tracking-normal'],['0.05em','0.05em','tracking-wider'],['0.1em','0.1em','tracking-widest']],def:1,
 tip:'Großbuchstaben brauchen etwas mehr Abstand, große Überschriften etwas weniger. Fließtext am besten in Ruhe lassen.'},
{id:'text-align',cat:'type',name:'text-align',sub:'Ausrichtung im Absatz',mdn:'text-align',
 desc:'<code>text-align</code> richtet Text innerhalb seines Kastens aus.',
 stage:`<p class="ca-text ca-w360">Linksbündiger Text hat eine feste Kante, an der jede Zeile beginnt. Das Auge springt immer an dieselbe Stelle zurück. Das macht ihn am leichtesten lesbar.</p>`,t:['.ca-text','.text'],
 vals:[['left','left','text-left'],['center','center','text-center'],['right','right','text-right'],['justify','justify','text-justify']],
 tip:'<code>justify</code> reißt im Web Löcher zwischen die Wörter, weil Browser schlecht trennen. Warum Zentrieren bei Absätzen schadet, zeigt <a class="xlink" href="https://daniel-hopium.github.io/pattern-library/#details/centered">Gut &amp; Schlecht</a>.'},
{id:'text-overflow',cat:'type',name:'text-overflow',sub:'Kürzen mit …',mdn:'text-overflow',

  [':where()','& :where(.box) p { color: #BE185D; }\n& .note { color: #047857; }','',':where() zählt null, bleibt also (0,0,1): grün. So bauen Resets Regeln, die man leicht überschreibt.'],
  ['ID','& #ca-x { color: #6D28D9; }\n& .box p.note { color: #047857; }','','Eine ID (1,0,0) schlägt jede Menge Klassen: violett.'],
  ['!important','& .note { color: #047857 !important; }\n& #ca-x { color: #6D28D9; }','','!important sticht jede Spezifität: grün. Danach hilft nur noch ein weiteres !important.']],
 tip:'Hohe Spezifität ist schwer zu überschreiben. Design-Systeme bleiben darum bei flachen Klassen, Tailwind erzeugt fast nur einzelne Klassen – alle mit derselben Spezifität.'}
];
const CA_BY=Object.fromEntries(CSSA.map(e=>[e.id,e]));
const CAT_BY=Object.fromEntries(CA_CATS.map(c=>[c.id,c]));
const caMdn=p=>'https://developer.mozilla.org/en-US/docs/Web/CSS/'+p;
function caVal(e,v){
  if(!Array.isArray(v))v=[v];
  if(e.mode==='sel')return {label:v[0],val:v[0],tw:v[1]||'',note:v[2]||''};
  const [label,val=label,tw='',note='']=v;
  return {label,val:!e.mode&&typeof val==='string'?{[e.name]:val}:val,tw,note};
}
function caApply(e,art,i){
  const st=$('.ca-stage',art),sid='#'+st.id,v=caVal(e,e.vals[i]);
  let code;
  if(e.mode==='sel'){
    $('style',art).textContent=`${sid} ${v.val}{outline:3px solid var(--ca-hl);outline-offset:2px;background:var(--ca-hl-bg)}`;
    code=`<span class="ca-hl">${esc(v.val)}</span> {\n  /* … */\n}`;
  }else if(e.mode==='css'){
    $('style',art).textContent=v.val.replaceAll('&',sid);
    code=v.val?esc(v.val.replaceAll('& ','')):'/* keine Regel */';
  }else{
    const keys=[...new Set(e.vals.flatMap(x=>Object.keys(caVal(e,x).val)))];
    $$(e.t[0],st).forEach(el=>{keys.forEach(k=>el.style.removeProperty(k));Object.entries(v.val).forEach(([k,x])=>{if(x!=='')el.style.setProperty(k,x)})});
    const blocks=new Map();
    const add=(sel,obj,hl)=>{const b=blocks.get(sel)||new Map();Object.entries(obj).forEach(([k,x])=>{if(x!=='')b.set(k,[x,hl])});blocks.set(sel,b)};
    (e.base||[]).forEach(([,sel,obj])=>add(sel,obj,false));
    add(e.t[1],v.val,true);
    code=[...blocks].map(([sel,b])=>`${sel} {\n${b.size?[...b].map(([k,[x,hl]])=>{const l=esc(`  ${k}: ${x};`);return hl?`<span class="ca-hl">${l}</span>`:l}).join('\n'):'  /* Standardwerte */'}\n}`).join('\n\n');
  }
  $('.ca-pre code',art).innerHTML=code;
  const tw=$('.ca-tw',art);tw.hidden=!v.tw;$('code',tw).textContent=v.tw;
  const note=$('.ca-note',art);note.hidden=!v.note;note.textContent=v.note;
  const m=$('.ca-meas',art);let txt='';
  if(e.measure)txt=e.measure(st);
  else if(e.mode==='sel'&&!e.noCount){try{const n=$$(v.val,st).length;txt=n===1?'Trifft 1 Element.':`Trifft ${n} Elemente.`}catch(err){}}
  m.hidden=!txt;m.textContent=txt;
}
const caEntryHTML=e=>`<article class="ca-entry" id="ca-${e.id}" data-id="${e.id}" aria-labelledby="ca-${e.id}-h">
  <h2 id="ca-${e.id}-h" tabindex="-1"><code>${esc(e.name)}</code><span class="ca-sub">${e.sub}</span></h2>
  <p class="ca-desc">${e.desc}</p>
  <fieldset class="ca-vals"><legend class="sr-only">Wert für ${esc(e.name)} wählen</legend>${e.vals.map((v,i)=>`<label><input type="radio" name="ca-${e.id}" value="${i}"${i===(e.def||0)?' checked':''}><code>${esc(caVal(e,v).label)}</code></label>`).join('')}</fieldset>
  <div class="ca-stage" id="ca-st-${e.id}">${e.stage}</div>
  <p class="ca-meas" role="status" hidden></p><p class="ca-note" hidden></p>
  <div class="ca-codebox"><pre class="code ca-pre" tabindex="0" role="region" aria-label="CSS zu ${esc(e.name)}"><code></code></pre><p class="ca-tw" hidden>${e.mode==='sel'?'Tailwind-Variante':'Tailwind'}: <code></code></p></div>
  ${e.tip?`<p class="ca-tip"><b>Stolperfalle:</b> ${e.tip}</p>`:''}
  <p class="ca-links"><a href="${caMdn(e.mdn)}">MDN: ${esc(e.name)} (englisch)</a> · <a href="#${e.cat}/${e.id}">Link zu diesem Eintrag</a></p>
  <style></style>
</article>`;
function caCatHTML(cat){
  const c=CAT_BY[cat],i=CA_CATS.indexOf(c),prev=CA_CATS[i-1],next=CA_CATS[i+1],es=CSSA.filter(e=>e.cat===cat);
  return `<article class="lesson" aria-labelledby="lesson-title">
  <p class="eyebrow">Kapitel ${i+1} von ${CA_CATS.length}</p>
  <h1 id="lesson-title" tabindex="-1">${c.title}</h1>
  <p class="rule">${c.intro}</p>
  <nav aria-label="Einträge in ${c.title}" class="ca-toc"><ul class="chips">${es.map(e=>`<li><a href="#${cat}/${e.id}"><code>${esc(e.name)}</code></a></li>`).join('')}</ul></nav>
  ${es.map(caEntryHTML).join('')}
  <nav class="pager" aria-label="Weitere Kapitel">${prev?`<a class="prev" href="#${prev.id}"><small>← Voriges Kapitel</small>${prev.title}</a>`:`<a class="prev" href="#start"><small>← Zurück zum</small>Überblick</a>`}${next?`<a class="next" href="#${next.id}"><small>Nächstes Kapitel →</small>${next.title}</a>`:`<a class="next" href="#start"><small>Zurück zum</small>Überblick</a>`}</nav>
</article>`;
}
function caCatInit(root,sub){
  $$('.ca-entry',root).forEach(art=>{
    const e=CA_BY[art.dataset.id],st=$('.ca-stage',art);
    (e.base||[]).forEach(([dom,,obj])=>$$(dom,st).forEach(el=>Object.entries(obj).forEach(([k,v])=>el.style.setProperty(k,v))));
    art.addEventListener('change',ev=>{if(ev.target.name===`ca-${e.id}`)caApply(e,art,+ev.target.value);else if(e.mode==='sel')caApply(e,art,+$(`input[name="ca-${e.id}"]:checked`,art).value)});
    st.addEventListener('click',ev=>{if(ev.target.closest('a'))ev.preventDefault()});
    e.init?.(st);
    caApply(e,art,e.def||0);
  });
  const hit=CA_BY[sub]&&$('#ca-'+sub,root);
  if(hit){hit.classList.add('ca-hit');requestAnimationFrame(()=>hit.scrollIntoView({block:'start'}))}
}
function caStartHTML(){
  return `<article class="lesson" aria-labelledby="lesson-title">
  <p class="eyebrow">Überblick</p>
  <h1 id="lesson-title" tabindex="-1">CSS zum Anfassen</h1>
  <p class="rule">${CSSA.length} Eigenschaften und Selektoren, jede mit einer Live-Vorschau: Wert anklicken, Wirkung sehen, CSS und Tailwind-Klasse ablesen. Wie die Tailwind-Doku – nur für das CSS darunter.</p>
  <div class="start-grid">${CA_CATS.map(c=>`<div class="tile"><h3>${c.title}</h3><p>${c.intro}</p><a class="btn btn-secondary" href="#${c.id}">${CSSA.filter(e=>e.cat===c.id).length} Einträge<span class="sr-only"> in ${c.title}</span></a></div>`).join('')}</div>
  <h2>Alle Einträge</h2>
  <div class="field ca-find"><label for="ca-q">Eigenschaft suchen <span class="opt">Name oder Stichwort</span></label><input class="input" id="ca-q" type="search" autocomplete="off" spellcheck="false"></div>
  <p class="count" id="ca-count" role="status"></p>
  <div class="table-wrap" tabindex="0" role="region" aria-label="Alle Einträge im CSS-Atlas"><table class="table ca-index"><caption class="sr-only">Alle Einträge im CSS-Atlas</caption><thead><tr><th scope="col">Eigenschaft</th><th scope="col">Was sie tut</th><th scope="col">Kapitel</th></tr></thead><tbody>${CSSA.map(e=>`<tr data-q="${esc(norm(`${e.name} ${e.sub} ${CAT_BY[e.cat].title} ${e.desc.replace(/<[^>]+>/g,'')}`))}"><td><a href="#${e.cat}/${e.id}"><code>${esc(e.name)}</code></a></td><td>${e.sub}</td><td>${CAT_BY[e.cat].title}</td></tr>`).join('')}</tbody></table></div>
  <nav class="pager" aria-label="Weiter"><a class="next" href="#${CA_CATS[0].id}"><small>Erstes Kapitel →</small>${CA_CATS[0].title}</a></nav>
</article>`;
}
function caStartInit(root){
  const q=$('#ca-q',root),rows=$$('tbody tr',root),count=$('#ca-count',root);let t;
  const upd=typed=>{const s=norm(q.value.trim());let n=0;rows.forEach(r=>{const ok=!s||r.dataset.q.includes(s);r.hidden=!ok;if(ok)n++});
    clearTimeout(t);t=setTimeout(()=>{count.textContent=s?`${n} von ${CSSA.length} Einträgen`:`${CSSA.length} Einträge`},typed?400:0)};
  q.addEventListener('input',()=>upd(true));upd(false);
  return ()=>clearTimeout(t);
}

/* ---------- Seitenleiste ---------- */
const listEl=$('#list'),search=$('#q'),qStatus=$('#q-status');
let current=null,statusTimer=null;
function renderList(){
  const q=norm(search.value.trim());
  const hit=e=>!q||norm(`${e.name} ${e.sub} ${CAT_BY[e.cat].title}`).includes(q);
  let html=q?'':`<ul class="items"><li><a class="item item-page" href="#start" data-id="start"><span class="item-title">Überblick</span><span class="item-short">Alle Kapitel und eine Tabelle aller Einträge.</span></a></li></ul>`,count=0;
  CA_CATS.forEach(c=>{
    const es=CSSA.filter(e=>e.cat===c.id&&hit(e));if(!es.length)return;count+=es.length;
    html+=`<a class="grp" id="grp-${c.id}" href="#${c.id}" data-id="${c.id}">${c.title}</a><ul class="items" aria-labelledby="grp-${c.id}">${es.map(e=>`<li><a class="item" href="#${c.id}/${e.id}" data-id="${c.id}/${e.id}"><code>${esc(e.name)}</code></a></li>`).join('')}</ul>`;
  });
  if(q&&!count)html=`<div class="list-empty">${ic('search')}<p class="le-title">Nichts zu „${esc(search.value.trim())}“</p><p class="hint">Probier eine Eigenschaft wie „gap“, „z-index“ oder ein Stichwort wie „Schatten“.</p><button type="button" class="btn btn-secondary" id="q-reset">Suche zurücksetzen</button></div>`;
  listEl.innerHTML=html;
  markActive(current,false);
  clearTimeout(statusTimer);
  statusTimer=setTimeout(()=>{qStatus.textContent=q?(count===1?'1 Treffer':`${count} Treffer`):`${CSSA.length} Einträge in ${CA_CATS.length} Kapiteln`},q?450:0);
}
function markActive(id,reveal){
  $$('[data-id]',listEl).forEach(a=>{
    if(a.dataset.id===id){a.setAttribute('aria-current','page');if(reveal)a.scrollIntoView({block:'nearest'})}
    else a.removeAttribute('aria-current');
  });
}
search.addEventListener('input',renderList);
listEl.addEventListener('click',e=>{if(e.target.closest('#q-reset')){search.value='';renderList();search.focus()}});

/* ---------- Detailansicht ---------- */
const view=$('#view'),master=$('#master'),detail=$('#hauptinhalt'),shell=$('#shell');
let cleanup=null;
function notFoundHTML(id){
  return `<article class="lesson" aria-labelledby="lesson-title"><div class="empty">${ic('search')}
  <h1 id="lesson-title" tabindex="-1">Diese Seite gibt es nicht</h1>
  <p style="margin:0;max-width:60ch">Unter <code>#${esc(id)}</code> steht kein Eintrag. Vielleicht hat der Link einen Tippfehler.</p>
  <div class="btn-row"><a class="btn btn-primary" href="#start">Zum Überblick</a><button type="button" class="btn btn-secondary" id="nf-search">Eintrag suchen</button></div>
  </div></article>`;
}
function updateTitle(base,sub){
  const c=CAT_BY[base],e=CA_BY[sub];
  document.title=c?(e?`${e.name} · ${c.title} · CSS-Atlas`:`${c.title} · CSS-Atlas`):base==='start'?'CSS-Atlas – CSS zum Anfassen':'Nicht gefunden · CSS-Atlas';
}
let masterScroll=0,lastId=null;
function route(fromUser){
  if(cleanup){try{cleanup()}catch(e){}cleanup=null}
  if(shell.dataset.view==='master')masterScroll=master.scrollTop;
  const id=decodeURIComponent(location.hash.slice(1));
  const overview=id===''||id==='uebersicht';
  let [base,sub='']=id.split(/\/(.*)/);
  // Kurzform #gap springt zum Eintrag im richtigen Kapitel
  if(!CAT_BY[base]&&CA_BY[base]){location.replace(`#${CA_BY[base].cat}/${base}`);return}
  shell.dataset.view=overview?'master':'detail';
  let focusEl=null;
  if(overview||base==='start'){base='start';sub='';view.innerHTML=caStartHTML();cleanup=caStartInit(view)}
  else if(CAT_BY[base]){
    if(CA_BY[sub]?.cat!==base)sub='';
    view.innerHTML=caCatHTML(base);caCatInit(view,sub);
    focusEl=sub&&$('#ca-'+sub+'-h',view);
  }
  else{base=null;sub='';view.innerHTML=notFoundHTML(id)}
  current=base&&sub?`${base}/${sub}`:base;
  markActive(current,true);updateTitle(base,sub);
  if(!fromUser)return;
  if(overview&&isNarrow()){
    master.scrollTop=masterScroll;
    const a=lastId&&$(`[data-id="${lastId}"]`,listEl);
    (a||search).focus({preventScroll:!!a});
  }else{
    if(!sub)detail.scrollTop=0;
    if(focusEl)focusEl.focus({preventScroll:true});else $('#lesson-title').focus({preventScroll:true});
  }
  if(!overview&&current)lastId=current;
}
window.addEventListener('hashchange',()=>route(true));

/* ---------- Globale Ereignisse ---------- */
document.addEventListener('click',e=>{if(e.target.closest('#nf-search'))focusSearch()});
$('#skip').addEventListener('click',e=>{e.preventDefault();if(isNarrow()&&shell.dataset.view==='master'){search.focus();return}($('#lesson-title')||detail).focus()});
function focusSearch(){
  if(isNarrow()&&shell.dataset.view!=='master'){location.hash='uebersicht';setTimeout(()=>search.focus(),0)}
  else search.focus();
}
// Strg+K statt eines einzelnen Buchstabens: Tastenkürzel mit Modifier kollidieren nicht mit Sprachsteuerung (WCAG 2.1.4)
document.addEventListener('keydown',e=>{
  if((e.ctrlKey||e.metaKey)&&!e.altKey&&e.key.toLowerCase()==='k'){e.preventDefault();focusSearch()}
});

/* ---------- Start ---------- */
renderList();
route(false);
})();
</script>
</body>
</html>
