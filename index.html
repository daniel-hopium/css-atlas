<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<style>:root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}img{max-width:100%}[hidden]{display:none!important}</style>
<title>CSS-Atlas – CSS zum Anfassen</title>
<meta name="description" content="CSS-Eigenschaften und Selektoren mit Live-Vorschau: Wert anklicken, Wirkung sehen, CSS und Tailwind-Klasse ablesen.">
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:ital,wght@0,400;0,700;1,400&family=Figtree:wght@600;800&family=JetBrains+Mono:wght@400;500;600;700&display=swap">
<style>
:root{
  --bg:#F3F5F7; --surface:#FFFFFF; --surface-2:#EBEFF3; --ink:#15191F; --muted:#545C6A;
  --line:#D8DDE4; --line-strong:#838C9B;
  --success:#1B6B40; --success-bg:#E3F2E9; --warn:#7A4D00; --warn-bg:#FBF0D9;
  --danger:#B3261E; --danger-bg:#FBE8E6; --danger-ink:#FFFFFF;
  --toast-bg:#1D2229; --toast-ink:#F2F4F7; --toast-ok:#7BD9A1; --toast-err:#FF9A8F;
  --shadow:0 1px 2px rgb(16 24 40 / .06), 0 10px 28px rgb(16 24 40 / .14);

  --brand-l:#1F5FAD; --brand-ink-l:#FFFFFF; --brand-soft-l:#E6EEF8;
  --brand-d:#86B6F2; --brand-ink-d:#0A1A2F; --brand-soft-d:#16263A;
  --radius-ctl:10px; --radius-sm:8px; --radius-lg:14px; --radius-mark:10px;
  --font-display:"Figtree", "Atkinson Hyperlegible", system-ui, sans-serif; --display-wt:800;

  --brand:var(--brand-l); --brand-ink:var(--brand-ink-l); --brand-soft:var(--brand-soft-l);
  --toast-action:var(--brand-d);
  --focus:var(--brand);
  --font-body:"Atkinson Hyperlegible", system-ui, -apple-system, "Segoe UI", sans-serif;
  --font-mono:"JetBrains Mono", ui-monospace, "Cascadia Mono", Consolas, monospace;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    color-scheme:dark;
    --bg:#0E1115; --surface:#161A20; --surface-2:#1E232B; --ink:#E7EAEE; --muted:#A0A8B4;
    --line:#2B313A; --line-strong:#6B7483;
    --success:#74D39B; --success-bg:#15291E; --warn:#F2C063; --warn-bg:#2C2210;
    --danger:#FF8A80; --danger-bg:#34171A; --danger-ink:#2B0A07;
    --toast-bg:#E9ECF0; --toast-ink:#15191F; --toast-ok:#1B6B40; --toast-err:#B3261E;
    --shadow:0 1px 2px rgb(0 0 0 / .4), 0 10px 28px rgb(0 0 0 / .5);
    --brand:var(--brand-d); --brand-ink:var(--brand-ink-d); --brand-soft:var(--brand-soft-d);
    --toast-action:var(--brand-l);
  }
}
:root[data-theme="dark"]{
  color-scheme:dark;
  --bg:#0E1115; --surface:#161A20; --surface-2:#1E232B; --ink:#E7EAEE; --muted:#A0A8B4;
  --line:#2B313A; --line-strong:#6B7483;
  --success:#74D39B; --success-bg:#15291E; --warn:#F2C063; --warn-bg:#2C2210;
  --danger:#FF8A80; --danger-bg:#34171A; --danger-ink:#2B0A07;
  --toast-bg:#E9ECF0; --toast-ink:#15191F; --toast-ok:#1B6B40; --toast-err:#B3261E;
  --shadow:0 1px 2px rgb(0 0 0 / .4), 0 10px 28px rgb(0 0 0 / .5);
  --brand:var(--brand-d); --brand-ink:var(--brand-ink-d); --brand-soft:var(--brand-soft-d);
  --toast-action:var(--brand-l);
}

*,*::before,*::after{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--font-body);font-size:1rem;line-height:1.55;-webkit-font-smoothing:antialiased}
a{color:var(--brand);text-decoration:underline;text-underline-offset:.16em;text-decoration-thickness:.08em}
a:hover{text-decoration-thickness:.14em}
:focus-visible{outline:3px solid var(--focus);outline-offset:2px}
h1[tabindex="-1"]:focus,main:focus,[tabindex="-1"]:focus:not(:focus-visible){outline:none}
code{font-family:var(--font-mono);font-size:.86em;background:var(--surface-2);padding:.1em .35em;border-radius:4px;overflow-wrap:anywhere}
kbd{font-family:var(--font-mono);font-size:.8rem;border:1px solid var(--line-strong);border-bottom-width:2px;border-radius:4px;padding:0 .4em;background:var(--surface);white-space:nowrap}
.sr-only{position:absolute!important;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap;border:0}
.ic{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex:none}

/* Skip link */
.skip{position:absolute;left:12px;top:-100px;z-index:100;background:var(--brand);color:var(--brand-ink);padding:10px 16px;border-radius:var(--radius-ctl);font-weight:700;text-decoration:none}
.skip:focus{top:calc(8px + env(safe-area-inset-top,0px))}

/* App shell */
.app{height:100%;display:grid;grid-template-rows:auto minmax(0,1fr)}
.appbar{display:flex;align-items:center;gap:8px 14px;flex-wrap:wrap;padding:8px 16px;background:var(--surface);border-bottom:1px solid var(--line);position:relative}
.logo{display:flex;align-items:center;gap:10px;margin-right:auto;min-width:0;position:relative}
.logo-mark{width:36px;height:36px;border-radius:var(--radius-mark);background:var(--brand);color:var(--brand-ink);display:grid;place-items:center;font:var(--display-wt) 1.15rem/1 var(--font-display);flex:none}
.logo-name{font:var(--display-wt) 1.125rem/1.15 var(--font-display);letter-spacing:-.01em;margin:0}
.logo-sub{display:block;font:400 .75rem/1.3 var(--font-body);color:var(--muted);letter-spacing:.02em}
.hdr-ctl{display:flex;align-items:center;gap:8px;position:relative}
.hdr-ctl label{font-weight:700;font-size:.9375rem}
.shell{display:grid;grid-template-columns:minmax(280px,340px) minmax(0,1fr);min-height:0}
.master{overflow:auto;background:var(--surface);border-right:1px solid var(--line);position:relative;overscroll-behavior:contain}
.detail{overflow:auto;position:relative;overscroll-behavior:contain}
.detail-top{display:none}
@media (max-width:799px){
  .shell{grid-template-columns:minmax(0,1fr)}
  .master{border-right:0}
  .shell[data-view="detail"] .master{display:none}
  .shell[data-view="master"] .detail{display:none}
  .detail-top{display:block;padding:10px 16px 0}
}

/* Controls */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:44px;padding:0 18px;border-radius:var(--radius-ctl);border:1.5px solid transparent;font:inherit;font-weight:700;line-height:1.2;cursor:pointer;text-decoration:none;transition:background-color .15s,border-color .15s,transform .1s;text-align:center}
.btn:active{transform:translateY(1px)}
.btn-primary{background:var(--brand);color:var(--brand-ink)}
.btn-primary:hover{background:color-mix(in srgb,var(--brand) 86%,var(--ink))}
.btn-secondary{background:var(--surface);color:var(--ink);border-color:var(--line-strong)}
.btn-secondary:hover{background:var(--surface-2)}
.btn-ghost{background:transparent;color:var(--brand)}
.btn-ghost:hover{background:var(--brand-soft)}
.btn-danger{background:var(--danger);color:var(--danger-ink)}
.btn-danger:hover{background:color-mix(in srgb,var(--danger) 86%,var(--ink))}
.btn[aria-disabled="true"]{opacity:.5;cursor:not-allowed}
.btn[aria-disabled="true"]:active{transform:none}
.btn-row{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.icon-btn{width:44px;height:44px;display:inline-grid;place-items:center;border-radius:var(--radius-ctl);background:transparent;border:0;color:var(--ink);cursor:pointer;flex:none}
.icon-btn:hover{background:var(--surface-2)}
.spinner{width:18px;height:18px;border:2.5px solid currentColor;border-right-color:transparent;border-radius:50%;animation:spin .8s linear infinite;display:none;flex:none}
.is-loading .spinner{display:inline-block}
@keyframes spin{to{transform:rotate(360deg)}}
.input,select{min-height:44px;border:1.5px solid var(--line-strong);border-radius:var(--radius-ctl);background:var(--surface);color:var(--ink);font:inherit;padding:0 14px;max-width:100%}
select{padding-right:10px;cursor:pointer}
.input{width:100%}
.input[aria-invalid="true"]{border-color:var(--danger);border-width:2px}
.input-short{max-width:10rem}
.field{display:grid;gap:6px}
.field>label{font-weight:700}
.opt{font-weight:400;color:var(--muted)}
.hint{font-size:.875rem;color:var(--muted);margin:0;line-height:1.45}
.hint-err{color:var(--danger);font-weight:700}
.err{display:flex;gap:6px;align-items:flex-start;font-size:.9rem;color:var(--danger);font-weight:700;margin:0;line-height:1.4}
.err .ic{width:18px;height:18px;margin-top:1px}
.check-row{display:flex;align-items:center;gap:10px;min-height:44px}
.check-row input{width:22px;height:22px;accent-color:var(--brand);margin:0;flex:none}

/* Master list */
.master-top{position:sticky;top:0;z-index:2;background:var(--surface);padding:16px 16px 12px;border-bottom:1px solid var(--line);display:grid;gap:12px}
.search{display:grid;gap:6px;position:relative}
.search label{font-weight:700;font-size:.9375rem;display:flex;justify-content:space-between;align-items:center}
.search-box{position:relative}
.search-box .ic{position:absolute;left:12px;top:50%;transform:translateY(-50%);color:var(--muted);pointer-events:none}
.search-box .input{padding-left:40px}
.q-status{margin:0;font-size:.8125rem;color:var(--muted)}
.side-nav{padding-bottom:24px;position:relative}
.grp{margin:18px 16px 6px 22px;font-size:.75rem;font-weight:700;letter-spacing:.09em;text-transform:uppercase;color:var(--muted)}
.items{list-style:none;margin:0;padding:0 8px}
.items:first-child{padding-top:8px}
.item{display:grid;grid-template-columns:minmax(0,1fr) auto;align-items:baseline;gap:2px 8px;padding:10px 12px 11px 14px;border-radius:var(--radius-sm);color:inherit;text-decoration:none;position:relative;min-height:44px}
.item:hover{background:var(--surface-2)}
.item[aria-current="page"]{background:var(--brand-soft)}
.item[aria-current="page"]::before{content:"";position:absolute;left:3px;top:10px;bottom:10px;width:4px;border-radius:4px;background:var(--brand)}
.item-title{font-weight:700;line-height:1.3}
.item-short{grid-column:1/-1;font-size:.875rem;color:var(--muted);line-height:1.4}
.item-badge{display:inline-flex;align-items:center;gap:3px;font-size:.75rem;font-weight:700;color:var(--success)}
.item-badge .ic{width:15px;height:15px;stroke-width:2.6}
.list-empty{padding:28px 20px;display:grid;justify-items:start;gap:8px}
.list-empty .ic{width:28px;height:28px;color:var(--muted)}
.le-title{font-weight:700;margin:0}

/* Lesson */
.lesson{max-width:48rem;margin:0 auto;padding:28px 28px 96px;container-type:inline-size}
@media (max-width:599px){.lesson{padding:16px 16px 96px}}
.eyebrow{font-size:.8125rem;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--brand);margin:0 0 8px}
.lesson h1{font:var(--display-wt) clamp(1.75rem,1.3rem + 1.8vw,2.375rem)/1.12 var(--font-display);letter-spacing:-.015em;margin:0 0 14px;text-wrap:balance}
.lesson h2{font:700 1.25rem/1.3 var(--font-display);margin:40px 0 12px;text-wrap:balance}
.rule{font-size:1.1875rem;line-height:1.55;margin:20px 0 0;max-width:62ch}
.pager{display:flex;justify-content:space-between;gap:12px;margin-top:24px;flex-wrap:wrap;position:relative}
.pager a{display:flex;flex-direction:column;gap:2px;padding:12px 16px;border:1.5px solid var(--line);border-radius:var(--radius-lg);text-decoration:none;color:inherit;flex:1 1 220px;min-width:0;font-weight:700}
.pager a:hover{border-color:var(--line-strong);background:var(--surface)}
.pager small{font-weight:400;color:var(--muted);font-size:.8125rem}
.pager .next{text-align:right}
.back{display:inline-flex;align-items:center;gap:4px;min-height:44px;padding:0 12px 0 6px;font-weight:700;text-decoration:none;border-radius:var(--radius-ctl);position:relative}
.back:hover{background:var(--surface-2)}

/* Start page */
.start-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px;margin-top:28px}
.tile{padding:16px 18px;border:1.5px solid var(--line);border-radius:var(--radius-lg);background:var(--surface);display:grid;gap:6px;align-content:start}
.tile h3{margin:0;font:700 1rem/1.3 var(--font-body);display:flex;gap:8px;align-items:center}
.tile p{margin:0;font-size:.9375rem;color:var(--muted)}
.tile .btn{justify-self:start;margin-top:6px}
.empty{display:grid;justify-items:start;gap:10px;padding-top:24px}
.empty>.ic{width:40px;height:40px;color:var(--muted)}

/* Toasts */
.toasts{position:fixed;left:0;right:0;bottom:0;z-index:50;display:flex;flex-direction:column;align-items:center;gap:8px;padding:16px 16px calc(16px + env(safe-area-inset-bottom,0px));pointer-events:none}
@media (min-width:800px){.toasts{align-items:flex-end;padding-right:24px}}
.toast{pointer-events:auto;position:relative;display:flex;align-items:center;gap:8px;width:min(100%,440px);padding:8px 6px 8px 14px;min-height:56px;background:var(--toast-bg);color:var(--toast-ink);border-radius:var(--radius-lg);box-shadow:var(--shadow);overflow:hidden;animation:toast-in .24s cubic-bezier(.2,.8,.2,1)}
.toast.leaving{animation:toast-out .16s ease-in forwards}
.toast-ic{display:grid;color:var(--toast-action)}
.toast-success .toast-ic{color:var(--toast-ok)}
.toast-error .toast-ic{color:var(--toast-err)}
.toast-msg{margin:0;flex:1;font-size:.9375rem;line-height:1.4;padding:6px 0}
.toast-action{background:transparent;border:0;color:var(--toast-action);font:inherit;font-weight:700;min-height:44px;padding:0 12px;border-radius:var(--radius-sm);cursor:pointer;flex:none}
.toast-action:hover,.toast .icon-btn:hover{background:color-mix(in srgb,var(--toast-ink) 12%,transparent)}
.toast .icon-btn{color:var(--toast-ink)}
.toast :focus-visible{outline-color:var(--toast-action)}
.toast-timer{position:absolute;left:0;bottom:0;height:3px;width:100%;background:var(--toast-action);transform-origin:left;animation:toast-timer linear forwards}
.toast:hover .toast-timer,.toast:focus-within .toast-timer{animation-play-state:paused}
@keyframes toast-in{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:none}}
@keyframes toast-out{to{opacity:0;transform:translateY(8px)}}
@keyframes toast-timer{from{transform:scaleX(1)}to{transform:scaleX(0)}}

.chips{list-style:none;margin:0;padding:0;display:flex;flex-wrap:wrap;gap:6px}
.chips a{display:inline-flex;align-items:center;gap:6px;min-height:40px;padding:0 12px;border:1.5px solid var(--line-strong);border-radius:var(--radius-ctl);background:var(--surface);color:var(--ink);text-decoration:none;font-weight:700;font-size:.9375rem}
.chips a:hover{background:var(--surface-2)}
.chips a[aria-current="page"]{background:var(--brand);border-color:var(--brand);color:var(--brand-ink)}
.chips .ic{width:18px;height:18px}
.code{margin:0;padding:12px 14px;font:400 .8125rem/1.55 var(--font-mono);overflow-x:auto;white-space:pre;tab-size:2}
.code code{background:none;padding:0;font-size:inherit;overflow-wrap:normal}
.count{margin:16px 0 0;font-weight:700;color:var(--muted);min-height:1.5em}
.table{width:100%;border-collapse:collapse;font-size:.9375rem}
.table th,.table td{text-align:left;padding:8px 10px;border-bottom:1px solid var(--line);vertical-align:top}
.table th{font-weight:700;white-space:nowrap}
.table-wrap{overflow-x:auto;border:1px solid var(--line);border-radius:var(--radius-lg)}
/* Seitenleiste im Stil einer Doku: Kapitel als Überschrift, Einträge darunter */
.grp{display:block;text-decoration:none}
a.grp:hover{color:var(--brand)}
a.grp[aria-current="page"]{color:var(--brand)}
.items .item{grid-template-columns:minmax(0,1fr);min-height:36px;padding:6px 12px 6px 14px}
.item code{background:none;padding:0;font-size:.875rem;font-weight:600}
.item.item-page{padding-top:10px;padding-bottom:11px}
@media (pointer:coarse){.items .item{min-height:44px;align-content:center}}
.hdr-link{display:inline-flex;align-items:center;gap:6px;min-height:44px;padding:0 12px;font-weight:700;text-decoration:none;border-radius:var(--radius-ctl)}
.hdr-link:hover{background:var(--surface-2)}
.hdr-link .ic{width:18px;height:18px}
@media (max-width:479px){.hdr-long{display:none}.appbar{flex-wrap:nowrap}}
.xlink::after{content:" ↗"}
/* CSS-Atlas */
:root{--ca-hl:#DB2777;--ca-hl-bg:rgb(219 39 119 / .14)}
.ca-toc{margin-top:20px;position:relative}
.ca-toc code{background:none;padding:0;font-size:.875rem}
.ca-entry{padding:28px 0 32px;border-bottom:1px solid var(--line);scroll-margin-top:16px;position:relative}
.ca-entry.ca-hit{border:2px solid var(--brand);border-radius:var(--radius-lg);padding:22px 16px 26px;margin:12px -16px 0;box-shadow:0 0 0 4px var(--brand-soft)}
.lesson .ca-entry h2{margin:0;display:flex;flex-wrap:wrap;align-items:baseline;gap:4px 12px}
.ca-entry h2 code{font-size:1.25rem;background:none;padding:0;color:var(--brand)}
.ca-sub{font:400 1rem/1.4 var(--font-body);color:var(--muted)}
.ca-desc{margin:8px 0 14px;max-width:68ch}
.ca-vals{border:0;margin:0 0 12px;padding:0;display:flex;flex-wrap:wrap;gap:6px;min-width:0;position:relative}
.ca-vals label{position:relative;display:inline-flex;align-items:center;min-height:36px;padding:0 10px;border:1.5px solid var(--line-strong);border-radius:var(--radius-sm);background:var(--surface);cursor:pointer}
.ca-vals label:hover{background:var(--surface-2)}
.ca-vals input{position:absolute;inset:0;opacity:0;margin:0;cursor:pointer}
.ca-vals code{background:none;padding:0;font-size:.8125rem}
.ca-vals label:has(input:checked){background:var(--brand);border-color:var(--brand);color:var(--brand-ink)}
.ca-vals label:has(input:focus-visible){outline:3px solid var(--focus);outline-offset:2px}
.ca-stage{position:relative;isolation:isolate;overflow:hidden;padding:20px;min-height:96px;border:1.5px dashed var(--line-strong);border-radius:var(--radius-lg);
  background:radial-gradient(var(--line) 1px,transparent 1.2px) 0 0/14px 14px,var(--surface)}
.ca-meas,.ca-note{margin:8px 0 0;font-size:.875rem;font-weight:700;color:var(--muted)}
.ca-note{color:var(--ink);font-weight:400;padding:8px 12px;border-left:4px solid var(--brand);background:var(--brand-soft);border-radius:0 var(--radius-sm) var(--radius-sm) 0;max-width:68ch}
.ca-codebox{margin-top:12px;border:1.5px solid var(--line);border-radius:var(--radius-lg);background:var(--surface);overflow:hidden;position:relative}
.ca-pre{background:var(--surface)}
.ca-hl{background:var(--brand-soft);color:var(--brand);font-weight:700;border-radius:3px}
.ca-tw{margin:0;padding:8px 14px;border-top:1px solid var(--line);font-size:.8125rem;color:var(--muted);background:var(--surface-2)}
.ca-tw code{background:none;padding:0;color:var(--ink)}
.ca-tip{margin:12px 0 0;padding:10px 14px;border-left:4px solid var(--warn);background:var(--warn-bg);border-radius:0 var(--radius-sm) var(--radius-sm) 0;font-size:.9375rem;max-width:68ch;position:relative}
.ca-links{margin:10px 0 0;font-size:.875rem;color:var(--muted)}
.ca-find{margin:8px 0 0;position:relative}
.ca-index code{background:none;padding:0}
/* Bausteine der Vorschau */
.ca-i{display:grid;place-items:center;min-width:48px;min-height:48px;padding:8px 12px;border-radius:8px;color:#FFFFFF;font:700 .9375rem/1.25 var(--font-mono);text-align:center}
.ca-t1{background:#6D28D9}.ca-t2{background:#BE185D}.ca-t3{background:#0369A1}.ca-t4{background:#047857}
.ca-c{border-radius:8px;outline:1.5px solid color-mix(in srgb,var(--line-strong) 60%,transparent);outline-offset:4px}
.ca-flow{margin:0;line-height:1.9;max-width:44ch}
.ca-flow .ca-i{padding:6px 10px}
.ca-scroll{height:170px;overflow:auto;padding:0 12px;border:1px solid var(--line);border-radius:8px;background:var(--surface)}
.ca-scroll p{margin:10px 0;font-size:.875rem;max-width:40ch}
.ca-pos{width:90px;z-index:1}
.ca-outer{position:relative;min-height:190px;padding:28px 12px 12px;border:1.5px dashed #0369A1;border-radius:8px}
.ca-parent{min-height:110px;margin-top:8px;padding:28px 12px 12px;border:1.5px dashed #BE185D;border-radius:8px;width:62%}
.ca-lbl{position:absolute;margin-top:-22px;font:600 .75rem/1.2 var(--font-mono);color:var(--muted)}
.ca-stack{position:relative;height:150px}
.ca-stack .ca-i{position:absolute;width:110px;height:80px;box-shadow:0 4px 10px rgb(0 0 0 / .25)}
.ca-z1{left:0;top:0}.ca-z2{left:60px;top:30px}.ca-z3{left:120px;top:60px}

/* ---------- Toasts ---------- */
const toastBox=$('#toasts');
let activeUndo=null;
function announce(text,assertive){
  const r=$(assertive?'#live-assert':'#live-polite');
  r.textContent='';
  setTimeout(()=>{r.textContent=text},60);
}
function toast({msg,type='info',action,duration}){
  duration=duration??(action?8000:5000);
  const t=document.createElement('div');
  t.className='toast toast-'+type;
  t.innerHTML=`<span class="toast-ic">${ic(type==='success'?'ok':type==='error'?'alert':'info')}</span><p class="toast-msg"></p>`;
  $('.toast-msg',t).textContent=msg;
  let actionBtn=null;
  if(action){
    actionBtn=document.createElement('button');
    actionBtn.type='button';actionBtn.className='toast-action';actionBtn.textContent=action.label;
    t.append(actionBtn);
  }
  const closeBtn=document.createElement('button');
  closeBtn.type='button';closeBtn.className='icon-btn';closeBtn.setAttribute('aria-label',tx('Meldung schließen','Close message'));closeBtn.innerHTML=ic('x');
  t.append(closeBtn);
  const timer=document.createElement('span');
  timer.className='toast-timer';timer.style.animationDuration=duration+'ms';
  t.append(timer);
  toastBox.append(t);
  while(toastBox.children.length>3) toastBox.firstElementChild.remove();

  let remaining=duration,start=Date.now(),id=setTimeout(close,remaining),closed=false;
  function pause(){clearTimeout(id);remaining-=Date.now()-start}
  function resume(){start=Date.now();clearTimeout(id);id=setTimeout(close,Math.max(remaining,1200))}
  function close(){
    if(closed)return;closed=true;clearTimeout(id);
    if(activeUndo&&activeUndo.toast===t) activeUndo=null;
    const hadFocus=t.contains(document.activeElement);
    const done=()=>{t.remove();if(hadFocus) focusMainHeading()};
    if(reducedMotion()) done(); else {t.classList.add('leaving');setTimeout(done,170)}
  }
  t.addEventListener('mouseenter',pause);
  t.addEventListener('mouseleave',()=>{if(!t.contains(document.activeElement))resume()});
  t.addEventListener('focusin',pause);
  t.addEventListener('focusout',e=>{if(!t.contains(e.relatedTarget)&&!t.matches(':hover'))resume()});
  closeBtn.addEventListener('click',close);
  if(action){
    const run=()=>{action.fn();close()};
    actionBtn.addEventListener('click',run);
    activeUndo={toast:t,run};
  }
  announce(msg+(action?` ${action.label} ${tx('mit Strg plus Z','with Ctrl plus Z')}.`:''),type==='error');
  return close;
}

const CSSA=[

{id:'display',cat:'layout',name:'display',sub:tx('Wie ein Element im Fluss steht','How an element sits in the flow'),mdn:'display',

 stage:`<p class="ca-flow">${tx('Text davor','Text before')} <span class="ca-i ca-t1">1</span> <span class="ca-i ca-t2">2</span> <span class="ca-i ca-t3">3</span> ${tx('und Text danach, damit man sieht, wie die Elemente im Textfluss stehen.','and text after, so you can see how the elements sit in the text flow.')}</p>`,
 t:['.ca-i','span'],vals:[['inline','inline','inline'],['inline-block','inline-block','inline-block'],['block','block','block'],['none','none','hidden']],
 tip:tx('<code>display: none</code> entfernt das Element auch für Screenreader. Nur optisch verstecken: siehe „Verstecken“ unter Rahmen &amp; Effekte.','<code>display: none</code> removes the element for screen readers too. To hide it visually only, see “Hiding” under Borders &amp; effects.')},
{id:'position',cat:'layout',name:'position',sub:tx('Aus dem Fluss nehmen – ganz, teilweise oder gar nicht','Taking it out of the flow – fully, partly or not at all'),mdn:'position',
 desc:tx('<code>position</code> legt fest, ob und wie <code>top</code>, <code>right</code>, <code>bottom</code> und <code>left</code> ein Element verschieben. Scroll im Kasten, um <code>sticky</code> zu sehen.','<code>position</code> decides whether and how <code>top</code>, <code>right</code>, <code>bottom</code> and <code>left</code> move an element. Scroll inside the box to see <code>sticky</code>.'),
 stage:`<div class="ca-scroll" tabindex="0" role="region" aria-label="${tx('Scrollbereich zu position','Scroll area for position')}"><p>${tx('static ist der Normalzustand: Das Element steht, wo es im HTML steht.','static is the default: the element sits where it is in the HTML.')}</p><div class="ca-i ca-t2 ca-pos">${tx('Ziel','Target')}</div><p>${tx('relative verschiebt es optisch, der ursprüngliche Platz bleibt aber reserviert – die Lücke siehst du.','relative shifts it visually, but its original space stays reserved – you can see the gap.')}</p><p>${tx('absolute nimmt es ganz aus dem Fluss und richtet es am nächsten positionierten Vorfahren aus, hier am Scroll-Kasten.','absolute takes it out of the flow entirely and positions it relative to the nearest positioned ancestor, here the scroll box.')}</p><p>${tx('sticky verhält sich normal, bis es beim Scrollen die Kante erreicht – dann klebt es dort.','sticky behaves normally until it reaches the edge while you scroll – then it sticks there.')}</p><p>${tx('Noch etwas Text, damit es etwas zu scrollen gibt.','Some more text so there’s something to scroll.')}</p><p>${tx('Und noch ein Absatz zum Scrollen.','And one more paragraph to scroll.')}</p></div>`,
 base:[['.ca-scroll','.parent',{position:'relative'}]],t:['.ca-pos','.target'],
 vals:[['static',{position:'static'},'static'],['relative',{position:'relative',top:'12px',left:'24px'},'relative top-3 left-6'],['absolute',{position:'absolute',top:'8px',right:'8px'},'absolute top-2 right-2'],['sticky',{position:'sticky',top:'0'},'sticky top-0']],
 tip:tx('<code>fixed</code> fehlt hier absichtlich: Es hängt am Viewport und würde aus dem Kasten ausbrechen. <code>sticky</code> braucht ein <code>top</code> und scheitert, wenn ein Vorfahre <code>overflow: hidden</code> hat.','<code>fixed</code> is left out on purpose: it’s tied to the viewport and would break out of the box. <code>sticky</code> needs a <code>top</code> and fails if an ancestor has <code>overflow: hidden</code>.')},
{id:'containing-block',cat:'layout',name:'position: absolute',sub:tx('Woran richtet es sich aus?','What is it positioned against?'),mdn:'Containing_block',
 desc:tx('Ein absolut positioniertes Element sucht den nächsten Vorfahren, der selbst positioniert ist – alles außer <code>static</code>. Dessen Kasten heißt Containing Block, daran messen sich <code>top</code>, <code>right</code>, <code>bottom</code> und <code>left</code>.','An absolutely positioned element looks for the nearest ancestor that is positioned itself – anything but <code>static</code>. That ancestor’s box is called the containing block, and <code>top</code>, <code>right</code>, <code>bottom</code> and <code>left</code> are measured from it.'),
 stage:`<div class="ca-outer"><span class="ca-lbl">${tx('Vorschau-Kasten (position: relative)','Preview box (position: relative)')}</span><div class="ca-parent"><span class="ca-lbl">${tx('Eltern-Element','Parent element')}</span><div class="ca-i ca-t3 ca-abs">${tx('Kind','Child')}</div></div></div>`,
 base:[['.ca-abs','.child',{position:'absolute',right:'8px',bottom:'8px'}]],t:['.ca-parent','.parent'],
 vals:[['static',{position:'static'},'static'],['relative',{position:'relative'},'relative'],['transform',{transform:'translateZ(0)'},'transform-gpu']],
 tip:tx('Springt ein Element „irgendwohin“, fehlt dem gewünschten Eltern-Element <code>position: relative</code>. Auch <code>transform</code>, <code>filter</code> und <code>contain</code> erzeugen einen Containing Block – darum scrollen <code>fixed</code>-Elemente in animierten Containern plötzlich mit.','If an element jumps “somewhere”, the parent you wanted is missing <code>position: relative</code>. <code>transform</code>, <code>filter</code> and <code>contain</code> create a containing block too – that’s why <code>fixed</code> elements suddenly scroll along inside animated containers.')},
{id:'z-index',cat:'layout',name:'z-index',sub:tx('Was liegt oben?','What’s on top?'),mdn:'z-index',
 desc:tx('<code>z-index</code> ordnet übereinanderliegende positionierte Elemente: Der höhere Wert liegt oben. Ohne Angabe gilt die Reihenfolge im DOM – das spätere Element liegt oben.','<code>z-index</code> orders overlapping positioned elements: the higher value is on top. Without it, DOM order applies – the later element is on top.'),
 stage:`<div class="ca-stack"><div class="ca-i ca-t1 ca-z1">1</div><div class="ca-i ca-t2 ca-z2">2</div><div class="ca-i ca-t3 ca-z3">3</div></div>`,
 base:[['.ca-z2','.card-2',{position:'absolute'}]],t:['.ca-z2','.card-2'],
 vals:[['auto','auto','z-auto'],['10','10','z-10'],['-1','-1','-z-1']],
 tip:tx('<code>z-index</code> wirkt nur innerhalb desselben Stacking Context. <code>opacity</code> unter 1, <code>transform</code> oder <code>isolation: isolate</code> erzeugen einen neuen – dann hilft auch <code>z-index: 9999</code> nicht gegen ein Element außerhalb. Diese Vorschau hat <code>isolation: isolate</code>, sonst würde −1 hinter ihrem Hintergrund verschwinden.','<code>z-index</code> only works within the same stacking context. <code>opacity</code> below 1, <code>transform</code> or <code>isolation: isolate</code> create a new one – and then even <code>z-index: 9999</code> won’t beat an element outside it. This preview has <code>isolation: isolate</code>, otherwise −1 would disappear behind its background.')},
{id:'overflow',cat:'layout',name:'overflow',sub:tx('Wenn der Inhalt größer ist als der Kasten','When the content is bigger than the box'),mdn:'overflow',
 desc:tx('Der gestrichelte Kasten ist 90 px hoch, der Text länger. <code>overflow</code> entscheidet, was mit dem Rest passiert.','The dashed box is 90 px tall, the text is longer. <code>overflow</code> decides what happens to the rest.'),
 stage:`<div class="ca-ovf" tabindex="0" role="region" aria-label="${tx('Kasten mit zu viel Text','Box with too much text')}"><p>${tx('Dieser Text ist länger, als der Kasten hoch ist. visible lässt ihn einfach herausragen, hidden schneidet ihn ab, auto zeigt eine Scrollleiste nur bei Bedarf und scroll immer. Abgeschnittener Text ist für alle weg, die ihn brauchen.','This text is longer than the box is tall. visible simply lets it stick out, hidden cuts it off, auto shows a scrollbar only when needed and scroll always does. Clipped text is gone for everyone who needs it.')}</p></div>`,
 t:['.ca-ovf','.box'],vals:[['visible','visible','overflow-visible'],['hidden','hidden','overflow-hidden'],['auto','auto','overflow-auto'],['scroll','scroll','overflow-scroll']],
 tip:tx('Scrollbare Bereiche brauchen <code>tabindex="0"</code> und einen Namen, sonst kommt man per Tastatur nicht hinein. Und <code>overflow: hidden</code> an einem Vorfahren bricht <code>position: sticky</code>.','Scrollable areas need <code>tabindex="0"</code> and a name, otherwise keyboard users can’t get in. And <code>overflow: hidden</code> on an ancestor breaks <code>position: sticky</code>.')},
{id:'box-sizing',cat:'layout',name:'box-sizing',sub:tx('Was width eigentlich meint','What width actually means'),mdn:'box-sizing',
 desc:tx('Bei <code>content-box</code> (Standard) meint <code>width</code> nur den Inhalt – Padding und Rahmen kommen dazu. Bei <code>border-box</code> ist alles in der Breite enthalten.','With <code>content-box</code> (the default), <code>width</code> means the content only – padding and border are added on top. With <code>border-box</code>, everything is included in the width.'),
 stage:`<div class="ca-i ca-t4 ca-bs">width: 200px</div>`,
 base:[['.ca-bs','.box',{width:'200px',padding:'20px',border:'6px solid #FCD34D'}]],t:['.ca-bs','.box'],
 vals:[['content-box','content-box','box-content'],['border-box','border-box','box-border']],
 measure:st=>`${tx('Gemessene Breite','Measured width')}: ${$('.ca-bs',st).offsetWidth} px`,
 tip:tx('Fast jedes Projekt setzt global <code>*, *::before, *::after { box-sizing: border-box }</code> – Tailwind und diese App auch. Dann heißt 200 px wirklich 200 px.','Almost every project sets <code>*, *::before, *::after { box-sizing: border-box }</code> globally – Tailwind and this app do too. Then 200 px really means 200 px.')},
/* Flexbox */
{id:'flex-direction',cat:'flex',name:'flex-direction',sub:tx('Welche Achse ist die Hauptachse?','Which axis is the main axis?'),mdn:'flex-direction',
 desc:tx('<code>flex-direction</code> legt die Hauptachse fest: waagrecht (<code>row</code>) oder senkrecht (<code>column</code>). <code>justify-content</code> arbeitet immer entlang der Hauptachse, <code>align-items</code> quer dazu.','<code>flex-direction</code> sets the main axis: horizontal (<code>row</code>) or vertical (<code>column</code>). <code>justify-content</code> always works along the main axis, <code>align-items</code> across it.'),
 stage:cC(cN(3)),base:FLEX,t:['.ca-c','.container'],
 vals:[['row','row','flex-row'],['row-reverse','row-reverse','flex-row-reverse'],['column','column','flex-col'],['column-reverse','column-reverse','flex-col-reverse']],
 tip:tx(`<code>-reverse</code> dreht nur die Optik. Tab-Taste und Screenreader folgen weiter dem DOM – das verletzt schnell ${W1412}.`,`<code>-reverse</code> only flips what you see. The Tab key and screen readers still follow the DOM – that can easily violate ${W1412}.`)},
{id:'justify-content',cat:'flex',name:'justify-content',sub:tx('Verteilung entlang der Hauptachse','Distribution along the main axis'),mdn:'justify-content',
 desc:tx('<code>justify-content</code> verteilt den freien Platz entlang der Hauptachse: alles an den Anfang, in die Mitte, ans Ende – oder als Abstand zwischen die Elemente.','<code>justify-content</code> distributes the free space along the main axis: everything at the start, in the middle, at the end – or as spacing between the elements.'),
 stage:cC(cN(3)),base:FLEX,t:['.ca-c','.container'],
 vals:[['flex-start','flex-start','justify-start'],['center','center','justify-center'],['flex-end','flex-end','justify-end'],['space-between','space-between','justify-between'],['space-around','space-around','justify-around'],['space-evenly','space-evenly','justify-evenly']],
 tip:tx('Wirkt nur, wenn Platz übrig ist. Hat ein Element <code>flex: 1</code>, frisst es den ganzen Platz, und <code>justify-content</code> ändert sichtbar nichts.','Only works when there’s space left over. If an element has <code>flex: 1</code>, it eats all the space and <code>justify-content</code> has no visible effect.')},
{id:'align-items',cat:'flex',name:'align-items',sub:tx('Ausrichtung quer zur Hauptachse','Alignment across the main axis'),mdn:'align-items',
 desc:tx('<code>align-items</code> richtet die Elemente quer zur Hauptachse aus. <code>stretch</code> (Standard) zieht sie auf die volle Höhe, <code>baseline</code> richtet die Textgrundlinien aneinander aus.','<code>align-items</code> aligns the elements across the main axis. <code>stretch</code> (the default) pulls them to full height, <code>baseline</code> lines up their text baselines.'),
 stage:cC(`${cI(1)}<div class="ca-i ca-t2 ca-n2" style="padding:26px 14px">2</div><div class="ca-i ca-t3 ca-n3" style="font-size:1.5rem">3</div>`),
 base:[['.ca-c','.container',{display:'flex',gap:'8px','min-height':'150px'}]],t:['.ca-c','.container'],
 vals:[['stretch','stretch','items-stretch'],['flex-start','flex-start','items-start'],['center','center','items-center'],['flex-end','flex-end','items-end'],['baseline','baseline','items-baseline']],
 tip:tx('Das klassische „senkrecht zentrieren“ ist <code>display: flex; align-items: center</code>. Eine feste Höhe am Element schaltet <code>stretch</code> ab.','The classic “center vertically” is <code>display: flex; align-items: center</code>. A fixed height on the element turns <code>stretch</code> off.')},
{id:'flex-wrap',cat:'flex',name:'flex-wrap',sub:tx('Umbrechen oder quetschen','Wrap or squeeze'),mdn:'flex-wrap',
 desc:tx('Standardmäßig bleibt alles in einer Zeile. Mit <code>flex-wrap: wrap</code> brechen Elemente in die nächste Zeile um, sobald der Platz nicht reicht.','By default everything stays on one line. With <code>flex-wrap: wrap</code>, elements wrap onto the next line as soon as there isn’t enough space.'),
 stage:cC(cN(8)),base:[...FLEX,['.ca-i','.item',{width:'72px','flex-shrink':'0'}]],t:['.ca-c','.container'],
 vals:[['nowrap','nowrap','flex-nowrap'],['wrap','wrap','flex-wrap'],['wrap-reverse','wrap-reverse','flex-wrap-reverse']],
 tip:tx('Ohne <code>wrap</code> laufen Inhalte auf schmalen Bildschirmen aus dem Container – ein häufiger Grund für seitliches Scrollen (<a class="xlink" href="https://daniel-hopium.github.io/pattern-library/#wcag-kriterien/1.4.10">WCAG 1.4.10</a>).','Without <code>wrap</code>, content runs out of the container on narrow screens – a common cause of horizontal scrolling (<a class="xlink" href="https://daniel-hopium.github.io/pattern-library/#wcag-kriterien/1.4.10">WCAG 1.4.10</a>).')},
{id:'gap',cat:'flex',name:'gap',sub:tx('Abstand zwischen den Elementen','Space between the elements'),mdn:'gap',
 desc:tx('<code>gap</code> setzt den Abstand zwischen den Elementen – nur dazwischen, nie außen herum. Funktioniert in Flexbox und Grid.','<code>gap</code> sets the space between the elements – only in between, never around the outside. Works in Flexbox and Grid.'),
 stage:cC(cN(6)),base:[['.ca-c','.container',{display:'flex','flex-wrap':'wrap'}]],t:['.ca-c','.container'],
 vals:[['0','0','gap-0'],['8px','8px','gap-2'],['16px','16px','gap-4'],['32px','32px','gap-8']],def:2,
 tip:tx('Früher brauchte man dafür <code>margin</code> an jedem Element und eine negative Margin am Container. Heute nicht mehr. <code>row-gap</code> und <code>column-gap</code> trennen die Richtungen.','You used to need <code>margin</code> on every element plus a negative margin on the container for this. Not anymore. <code>row-gap</code> and <code>column-gap</code> handle the directions separately.')},
{id:'flex',cat:'flex',name:'flex',sub:tx('Wachsen, schrumpfen, Ausgangsgröße','Grow, shrink, starting size'),mdn:'flex',
 desc:tx('<code>flex</code> ist die Kurzform für <code>flex-grow</code>, <code>flex-shrink</code> und <code>flex-basis</code>: Wie stark darf ein Element wachsen, wie stark schrumpfen – und von welcher Größe aus?','<code>flex</code> is shorthand for <code>flex-grow</code>, <code>flex-shrink</code> and <code>flex-basis</code>: how much may an element grow, how much may it shrink – and from what size?'),
 stage:cC(`${cI(1,tx('Kurz','Short'))}${cI(2,tx('Ein deutlich längerer Text','A much longer piece of text'))}${cI(3,tx('Mittel','Medium'))}`),base:FLEX,t:['.ca-i','.item'],
 vals:[['initial','0 1 auto','flex-initial'],['1','1 1 0%','flex-1'],['auto','1 1 auto','flex-auto'],['none','none','flex-none']],
 tip:tx('<code>flex: 1</code> startet bei Breite 0 und verteilt den Platz gleichmäßig – alle Spalten werden gleich breit, egal wie viel Text drinsteht. <code>flex: auto</code> startet bei der Inhaltsbreite: Längerer Text bekommt mehr.','<code>flex: 1</code> starts at width 0 and shares the space evenly – all columns get the same width, no matter how much text is in them. <code>flex: auto</code> starts at the content width: longer text gets more.')},
{id:'min-width-0',cat:'flex',name:'min-width: 0',sub:tx('Warum Text in Flexbox nicht kürzt','Why text in Flexbox won’t truncate'),mdn:'min-width',
 desc:tx('Flex-Elemente schrumpfen standardmäßig nicht unter die Breite ihres Inhalts – <code>min-width</code> steht dort auf <code>auto</code>. Ein langer Dateiname sprengt dann den Container, statt mit … gekürzt zu werden.','By default, flex items don’t shrink below the width of their content – their <code>min-width</code> is <code>auto</code>. A long file name then bursts the container instead of being truncated with ….'),
 stage:cC(`${cI(1,'PDF')}<div class="ca-mw"><p class="ca-trunc">${tx('Rechnung_2026_Kunde_Maier_Jänner_final_v2.pdf','Invoice_2026_Customer_Maier_January_final_v2.pdf')}</p><p class="ca-small">${tx('vor 3 Tagen','3 days ago')}</p></div>`,'ca-narrow'),
 base:[['.ca-c','.row',{display:'flex',gap:'8px','align-items':'center'}]],t:['.ca-mw','.text-col'],
 vals:[['auto',{'min-width':'auto'},'min-w-auto'],['0',{'min-width':'0'},'min-w-0']],
 tip:tx('Die Lösung gehört ans Flex-Element, das den Text enthält – nicht an den Text selbst. In Grid gilt dasselbe: <code>minmax(0, 1fr)</code> statt <code>1fr</code>.','The fix belongs on the flex item that contains the text – not on the text itself. The same goes for Grid: <code>minmax(0, 1fr)</code> instead of <code>1fr</code>.')},
{id:'align-self',cat:'flex',name:'align-self',sub:tx('Ein Element tanzt aus der Reihe','One element breaks ranks'),mdn:'align-self',
 desc:tx('<code>align-self</code> überschreibt <code>align-items</code> für ein einzelnes Element – hier für Nummer 2.','<code>align-self</code> overrides <code>align-items</code> for a single element – here for number 2.'),
 stage:cC(cN(3)),base:[['.ca-c','.container',{display:'flex',gap:'8px','align-items':'flex-start','min-height':'150px'}]],t:['.ca-n2','.item-2'],
 vals:[['auto','auto','self-auto'],['flex-start','flex-start','self-start'],['center','center','self-center'],['flex-end','flex-end','self-end'],['stretch','stretch','self-stretch']],
 tip:tx('Bei <code>stretch</code> darf das Element keine feste Höhe haben, sonst passiert nichts.','For <code>stretch</code>, the element must not have a fixed height, otherwise nothing happens.')},
{id:'order',cat:'flex',name:'order',sub:tx('Reihenfolge nur für das Auge','Order for the eye only'),mdn:'order',
 desc:tx('<code>order</code> ändert die Reihenfolge der Darstellung, ohne das HTML anzufassen. Kleinere Werte kommen zuerst, Standard ist 0. Hier gilt es für Nummer 3.','<code>order</code> changes the display order without touching the HTML. Lower values come first, the default is 0. Here it applies to number 3.'),
 stage:cC(cN(4)),base:FLEX,t:['.ca-n3','.item-3'],
 vals:[['0','0','order-none'],['-1','-1','-order-1'],['9999','9999','order-last']],
 tip:tx(`Nur die Optik ändert sich: Tab-Taste und Screenreader folgen weiter dem DOM. Wer so die Reihenfolge wirklich umbaut, verletzt ${W1412} – besser das HTML umsortieren.`,`Only the visuals change: the Tab key and screen readers still follow the DOM. If you really rearrange the order this way, you violate ${W1412} – reorder the HTML instead.`)},
/* Grid */
{id:'grid-template-columns',cat:'grid',name:'grid-template-columns',sub:tx('Die Spalten festlegen','Defining the columns'),mdn:'grid-template-columns',
 desc:tx('<code>grid-template-columns</code> legt die Spalten fest. <code>fr</code> ist ein Anteil am freien Platz: <code>1fr 2fr</code> heißt, die zweite Spalte bekommt doppelt so viel.','<code>grid-template-columns</code> defines the columns. <code>fr</code> is a share of the free space: <code>1fr 2fr</code> means the second column gets twice as much.'),
 stage:cC(cN(6)),base:GRID,t:['.ca-c','.container'],
 vals:[['repeat(2, 1fr)','repeat(2, 1fr)','grid-cols-2'],['repeat(3, 1fr)','repeat(3, 1fr)','grid-cols-3'],['200px 1fr','200px 1fr','grid-cols-[200px_1fr]'],['1fr 2fr','1fr 2fr','grid-cols-[1fr_2fr]'],['repeat(auto-fit, minmax(90px, 1fr))','repeat(auto-fit, minmax(90px, 1fr))','grid-cols-[repeat(auto-fit,minmax(90px,1fr))]']],
 tip:tx('<code>repeat(auto-fit, minmax(90px, 1fr))</code> ist der Responsive-Klassiker: so viele Spalten, wie mit mindestens 90 px hineinpassen – ganz ohne Media Query. Zieh das Fenster schmaler.','<code>repeat(auto-fit, minmax(90px, 1fr))</code> is the responsive classic: as many columns as fit at 90 px or more – no media query needed. Make the window narrower.')},
{id:'grid-column',cat:'grid',name:'grid-column',sub:tx('Über mehrere Spalten reichen','Spanning several columns'),mdn:'grid-column',
 desc:tx('<code>grid-column</code> legt fest, über wie viele Spalten ein Element reicht – hier Nummer 1 in einem Raster mit drei Spalten.','<code>grid-column</code> sets how many columns an element spans – here number 1 in a three-column grid.'),
 stage:cC(cN(6)),base:[['.ca-c','.container',{display:'grid',gap:'8px','grid-template-columns':'repeat(3, 1fr)'}]],t:['.ca-n1','.item-1'],
 vals:[['auto','auto','col-auto'],['span 2','span 2','col-span-2'],['span 3','span 3','col-span-3'],['1 / -1','1 / -1','col-span-full']],
 tip:tx('<code>1 / -1</code> heißt „von der ersten bis zur letzten Linie“: volle Breite, auch wenn sich die Spaltenzahl ändert. Negative Linien zählen von hinten.','<code>1 / -1</code> means “from the first to the last line”: full width, even if the number of columns changes. Negative lines count from the end.')},
{id:'auto-fill-fit',cat:'grid',name:'auto-fill vs. auto-fit',sub:tx('Leere Spalten behalten oder weglassen','Keep or drop empty columns'),mdn:'repeat',
 desc:tx('Beide erzeugen so viele Spalten, wie hineinpassen. Der Unterschied zeigt sich erst, wenn es weniger Elemente als Spalten gibt: <code>auto-fill</code> behält die leeren Spalten, bei <code>auto-fit</code> fallen sie weg und die vorhandenen Elemente wachsen.','Both create as many columns as fit. The difference only shows when there are fewer elements than columns: <code>auto-fill</code> keeps the empty columns, with <code>auto-fit</code> they collapse and the existing elements grow.'),
 stage:cC(cN(3)),base:GRID,t:['.ca-c','.container'],
 vals:[['auto-fill',{'grid-template-columns':'repeat(auto-fill, minmax(80px, 1fr))'},'grid-cols-[repeat(auto-fill,minmax(80px,1fr))]'],['auto-fit',{'grid-template-columns':'repeat(auto-fit, minmax(80px, 1fr))'},'grid-cols-[repeat(auto-fit,minmax(80px,1fr))]']],
 tip:tx('Für Kartenraster meist <code>auto-fit</code>. <code>auto-fill</code>, wenn wenige Karten nicht riesig werden sollen.','For card grids, usually <code>auto-fit</code>. <code>auto-fill</code> if a few cards shouldn’t become huge.')},
{id:'place-items',cat:'grid',name:'place-items',sub:tx('Wo sitzt das Element in seiner Zelle?','Where does the element sit in its cell?'),mdn:'place-items',
 desc:tx('<code>place-items</code> ist die Kurzform für <code>align-items</code> und <code>justify-items</code>: wo ein Element innerhalb seiner Zelle sitzt, senkrecht und waagrecht.','<code>place-items</code> is shorthand for <code>align-items</code> and <code>justify-items</code>: where an element sits inside its cell, vertically and horizontally.'),
 stage:cC(cN(3)),base:[['.ca-c','.container',{display:'grid',gap:'8px','grid-template-columns':'repeat(3, 1fr)','grid-auto-rows':'100px'}]],t:['.ca-c','.container'],
 vals:[['stretch','stretch','place-items-stretch'],['start','start','place-items-start'],['center','center','place-items-center'],['end','end','place-items-end']],
 tip:tx('<code>display: grid; place-items: center</code> ist die kürzeste Art, etwas in die Mitte zu setzen.','<code>display: grid; place-items: center</code> is the shortest way to center something.')},
{id:'grid-template-areas',cat:'grid',name:'grid-template-areas',sub:tx('Layout als ASCII-Bild','Layout as ASCII art'),mdn:'grid-template-areas',
 desc:tx('Jedes Kind bekommt mit <code>grid-area</code> einen Namen, der Container zeichnet das Layout mit diesen Namen wie ein kleines Bild.','Each child gets a name via <code>grid-area</code>, and the container draws the layout with those names like a little picture.'),
 stage:cC(['head','nav','main','foot'].map((a,i)=>`<div class="ca-i ca-t${i+1}" style="grid-area:${a}">${a}</div>`).join('')),
 base:[['.ca-c','.container',{display:'grid',gap:'8px','min-height':'200px'}]],t:['.ca-c','.container'],
 vals:[['Desktop',{'grid-template-columns':'110px 1fr','grid-template-areas':'"head head" "nav main" "foot foot"'},'grid-cols-[110px_1fr] [grid-template-areas:…]'],[tx('Mobil','Mobile'),{'grid-template-columns':'1fr','grid-template-areas':'"head" "main" "nav" "foot"'},'grid-cols-1 [grid-template-areas:…]'],[tx('Seitenleiste','Sidebar'),{'grid-template-columns':'110px 1fr','grid-template-areas':'"nav head" "nav main" "nav foot"'},'grid-cols-[110px_1fr] [grid-template-areas:…]']],
 tip:tx(`Tailwind hat dafür keine eigene Utility, nur den Umweg über eckige Klammern. Und Vorsicht: In „Mobil“ steht main vor nav, der DOM bleibt aber gleich – ${W1412} im Blick behalten.`,`Tailwind has no dedicated utility for this, only the detour via square brackets. And careful: in “Mobile”, main comes before nav, but the DOM stays the same – keep ${W1412} in mind.`)},
/* Box */
{id:'box-model',cat:'box',name:'Box Model',sub:tx('Inhalt, Padding, Rahmen, Margin','Content, padding, border, margin'),mdn:'CSS_box_model/Introduction_to_the_CSS_box_model',
 desc:tx('Jedes Element ist ein Kasten aus vier Schichten: Inhalt, Padding (Innenabstand, trägt die Hintergrundfarbe), Border (Rahmen) und Margin (Außenabstand, immer durchsichtig). Die Farben entsprechen denen der Browser-DevTools.','Every element is a box made of four layers: content, padding (inner spacing, carries the background color), border and margin (outer spacing, always transparent). The colors match those in the browser DevTools.'),
 stage:`<div class="ca-bm-wrap"><div class="ca-bm"><div class="ca-bm-c">${tx('Inhalt','Content')}</div></div></div><ul class="ca-legend" aria-label="${tx('Legende','Legend')}"><li><i style="background:#8CB6C0"></i>${tx('Inhalt','Content')}</li><li><i style="background:#C3D08B"></i>Padding</li><li><i style="background:#E8C46A"></i>Border</li><li><i class="ca-hatch"></i>Margin</li></ul>`,
 t:['.ca-bm','.box'],
 vals:[[tx('nur Inhalt','content only'),{padding:'0',border:'0 solid #E8C46A',margin:'0'},'p-0'],['+ padding',{padding:'20px',border:'0 solid #E8C46A',margin:'0'},'p-5'],['+ border',{padding:'20px',border:'8px solid #E8C46A',margin:'0'},'p-5 border-8'],['+ margin',{padding:'20px',border:'8px solid #E8C46A',margin:'24px'},'p-5 border-8 m-6']],
 tip:tx('Padding gehört zum Element: Es ist klickbar und hat Hintergrund. Margin ist Abstand zu den Nachbarn. Für Abstände zwischen Geschwistern ist <code>gap</code> am Eltern-Element meist die bessere Wahl.','Padding belongs to the element: it’s clickable and has a background. Margin is the distance to the neighbors. For spacing between siblings, <code>gap</code> on the parent is usually the better choice.')},
{id:'margin-collapse',cat:'box',name:'Margin Collapsing',sub:tx('Warum 24 + 24 nicht 48 ergibt','Why 24 + 24 doesn’t make 48'),mdn:'CSS_box_model/Mastering_margin_collapsing',
 desc:tx('Senkrechte Margins zweier Blöcke untereinander addieren sich nicht, sie fallen zusammen: Es gilt die größere. In Flex- und Grid-Containern passiert das nicht.','The vertical margins of two stacked blocks don’t add up, they collapse: the larger one wins. This doesn’t happen in flex and grid containers.'),
 stage:`<div class="ca-mc">${cI(1,'margin-bottom: 24px')}${cI(2,'margin-top: 24px')}</div>`,
 base:[['.ca-n1','.upper',{'margin-bottom':'24px'}],['.ca-n2','.lower',{'margin-top':'24px'}]],t:['.ca-mc','.container'],
 vals:[['block',{display:'block'},'block'],[tx('flex (Spalte)','flex (column)'),{display:'flex','flex-direction':'column'},'flex flex-col'],['grid',{display:'grid'},'grid']],
 measure:st=>{const a=$('.ca-n1',st).getBoundingClientRect(),b=$('.ca-n2',st).getBoundingClientRect();return `${tx('Abstand zwischen den beiden','Gap between the two')}: ${Math.round(b.top-a.bottom)} px`},
 tip:tx('Auch die Margin eines ersten Kindes kann durch das Eltern-Element „durchfallen“ und außen landen. Abhilfe: Padding am Eltern-Element, <code>display: flow-root</code> – oder gleich <code>gap</code> statt Margin.','A first child’s margin can also “fall through” the parent and end up outside it. The fix: padding on the parent, <code>display: flow-root</code> – or just use <code>gap</code> instead of margin.')},
{id:'width',cat:'box',name:'width & max-width',sub:tx('Feste, relative und begrenzte Breite','Fixed, relative and capped width'),mdn:'width',
 desc:tx('<code>width</code> setzt eine feste oder relative Breite. Block-Elemente sind ohne Angabe (<code>auto</code>) so breit wie ihr Eltern-Element. <code>max-width</code> setzt eine Obergrenze.','<code>width</code> sets a fixed or relative width. Without it (<code>auto</code>), block elements are as wide as their parent. <code>max-width</code> sets an upper limit.'),
 stage:`<div class="ca-c">${cI(1,'Element')}</div>`,t:['.ca-n1','.box'],
 vals:[['auto',{width:'auto'},'w-auto'],['50%',{width:'50%'},'w-1/2'],['480px',{width:'480px'},'w-[480px]'],['100% + max 480px',{width:'100%','max-width':'480px'},'w-full max-w-[480px]']],
 measure:st=>`${tx('Gemessene Breite','Measured width')}: ${$('.ca-n1',st).offsetWidth} px`,
 tip:tx('Feste Breiten brechen auf schmalen Bildschirmen aus dem Layout – zieh das Fenster schmal und vergleiche <code>480px</code> mit „100 % + max 480px“. Das Zweite ist fast immer, was man will.','Fixed widths break out of the layout on narrow screens – make the window narrow and compare <code>480px</code> with “100% + max 480px”. The second is almost always what you want.')},
{id:'aspect-ratio',cat:'box',name:'aspect-ratio',sub:tx('Höhe aus der Breite','Height from width'),mdn:'aspect-ratio',
 desc:tx('<code>aspect-ratio</code> legt das Seitenverhältnis fest: Die Höhe ergibt sich aus der Breite.','<code>aspect-ratio</code> sets the aspect ratio: the height follows from the width.'),
 stage:`<div class="ca-c">${cI(1,tx('50 % breit','50% wide'))}</div>`,base:[['.ca-n1','.box',{width:'50%'}]],t:['.ca-n1','.box'],
 vals:[['auto','auto','aspect-auto'],['1 / 1','1 / 1','aspect-square'],['16 / 9','16 / 9','aspect-video'],['4 / 3','4 / 3','aspect-[4/3]']],
 measure:st=>{const e=$('.ca-n1',st);return `${e.offsetWidth} × ${e.offsetHeight} px`},
 tip:tx('Für Bilder und Videos, die erst nachladen, reserviert <code>aspect-ratio</code> den Platz vorab – kein Layout Shift. Bei <code>&lt;img&gt;</code> reichen dafür die Attribute <code>width</code> und <code>height</code>.','For images and videos that load later, <code>aspect-ratio</code> reserves the space in advance – no layout shift. For <code>&lt;img&gt;</code>, the <code>width</code> and <code>height</code> attributes are enough.')},

/* Typografie */
{id:'font-size',cat:'type',name:'font-size',sub:tx('Schriftgröße','Font size'),mdn:'font-size',
 desc:tx('<code>rem</code> bezieht sich auf die Grundgröße des Browsers, meist 16 px – und wächst mit, wenn jemand sie in den Einstellungen erhöht.','<code>rem</code> is relative to the browser’s base size, usually 16px – and it grows when someone increases that size in their settings.'),
 stage:`<p class="ca-text">${tx('Schriftgröße','Font size')}</p>`,t:['.ca-text','.text'],
 vals:[['1rem','1rem','text-base'],['1.5rem','1.5rem','text-2xl'],['2.25rem','2.25rem','text-4xl'],['clamp(1rem, 4vw, 2.5rem)','clamp(1rem, 4vw, 2.5rem)','text-[clamp(1rem,4vw,2.5rem)]']],
 tip:tx('<code>px</code>-Schriftgrößen ignorieren die Schrifteinstellung im Browser (<a class="xlink" href="https://daniel-hopium.github.io/pattern-library/#wcag-kriterien/1.4.4">WCAG 1.4.4</a>). <code>clamp(min, bevorzugt, max)</code> wächst mit der Fensterbreite, bleibt aber in Grenzen.','<code>px</code> font sizes ignore the browser’s font size setting (<a class="xlink" href="https://daniel-hopium.github.io/pattern-library/#wcag-kriterien/1.4.4">WCAG 1.4.4</a>). <code>clamp(min, preferred, max)</code> grows with the window width but stays within bounds.')},
{id:'font-weight',cat:'type',name:'font-weight',sub:tx('Strichstärke','Stroke weight'),mdn:'font-weight',
 desc:tx('<code>font-weight</code> bestimmt, wie fett die Schrift ist. Nicht jede Schrift hat jede Stärke.','<code>font-weight</code> sets how bold the text is. Not every font comes in every weight.'),
 stage:`<p class="ca-text" style="font-size:1.5rem">${tx('Gewicht der Schrift','The weight of the type')}</p>`,t:['.ca-text','.text'],
 vals:[['400','400','font-normal'],['500','500','font-medium'],['700','700','font-bold'],['800','800','font-extrabold']],
 tip:tx('Diese App lädt Atkinson Hyperlegible nur in 400 und 700 – darum sieht 500 hier aus wie 400 und 800 wie 700. Fehlt eine fette Stärke ganz, rechnet der Browser eine unschöne Kunst-Fettung.','This app loads Atkinson Hyperlegible only in 400 and 700 – that’s why 500 looks like 400 here and 800 like 700. If a bold weight is missing entirely, the browser computes an ugly faux bold.')},
{id:'line-height',cat:'type',name:'line-height',sub:tx('Zeilenabstand','Line spacing'),mdn:'line-height',
 desc:tx('<code>line-height</code> ist der Abstand von Zeile zu Zeile. Ohne Einheit ist es ein Faktor der Schriftgröße – und wird richtig vererbt.','<code>line-height</code> is the distance from one line to the next. Without a unit it’s a factor of the font size – and it’s inherited correctly.'),
 stage:`<p class="ca-text ca-w360">${tx('Zu enge Zeilen kleben aneinander, zu weite zerfallen in einzelne Streifen. Für Fließtext hat sich ein Faktor um 1,5 bewährt, große Überschriften vertragen weniger.','Lines that are too tight stick together, lines that are too loose fall apart into separate strips. For body text a factor around 1.5 has proven itself; large headings can take less.')}</p>`,t:['.ca-text','.text'],
 vals:[['1','1','leading-none'],['1.25','1.25','leading-tight'],['1.5','1.5','leading-normal'],['2','2','leading-loose']],def:2,
 tip:tx('Mit Einheit (<code>line-height: 24px</code>) erben Kinder mit anderer Schriftgröße einen unpassenden Wert. <a class="xlink" href="https://daniel-hopium.github.io/pattern-library/#wcag-kriterien/1.4.12">WCAG 1.4.12</a> testet genau mit 1,5.','With a unit (<code>line-height: 24px</code>), children with a different font size inherit a value that doesn’t fit. <a class="xlink" href="https://daniel-hopium.github.io/pattern-library/#wcag-kriterien/1.4.12">WCAG 1.4.12</a> tests with exactly 1.5.')},
{id:'letter-spacing',cat:'type',name:'letter-spacing',sub:tx('Buchstabenabstand','Letter spacing'),mdn:'letter-spacing',
 desc:tx('<code>letter-spacing</code> ändert den Abstand zwischen den Buchstaben. In <code>em</code> angegeben, wächst er mit der Schriftgröße.','<code>letter-spacing</code> changes the space between letters. Given in <code>em</code>, it grows with the font size.'),
 stage:`<p class="ca-text ca-caps">${tx('Kapitelüberschrift','Chapter heading')}</p><p class="ca-text">${tx('Normaler Text in Kleinbuchstaben.','Normal text in lowercase letters.')}</p>`,t:['.ca-text','.text'],
 vals:[['-0.025em','-0.025em','tracking-tight'],['normal','normal','tracking-normal'],['0.05em','0.05em','tracking-wider'],['0.1em','0.1em','tracking-widest']],def:1,
 tip:tx('Großbuchstaben brauchen etwas mehr Abstand, große Überschriften etwas weniger. Fließtext am besten in Ruhe lassen.','Uppercase letters need a little more spacing, large headings a little less. Best leave body text alone.')},
{id:'text-align',cat:'type',name:'text-align',sub:tx('Ausrichtung im Absatz','Alignment within the paragraph'),mdn:'text-align',
 desc:tx('<code>text-align</code> richtet Text innerhalb seines Kastens aus.','<code>text-align</code> aligns text inside its box.'),
 stage:`<p class="ca-text ca-w360">${tx('Linksbündiger Text hat eine feste Kante, an der jede Zeile beginnt. Das Auge springt immer an dieselbe Stelle zurück. Das macht ihn am leichtesten lesbar.','Left-aligned text has a fixed edge where every line starts. The eye always jumps back to the same spot. That makes it the easiest to read.')}</p>`,t:['.ca-text','.text'],
 vals:[['left','left','text-left'],['center','center','text-center'],['right','right','text-right'],['justify','justify','text-justify']],
 tip:tx('<code>justify</code> reißt im Web Löcher zwischen die Wörter, weil Browser schlecht trennen. Warum Zentrieren bei Absätzen schadet, zeigt <a class="xlink" href="https://daniel-hopium.github.io/pattern-library/#details/centered">Gut &amp; Schlecht</a>.','On the web, <code>justify</code> tears holes between words because browsers hyphenate poorly. Why centering paragraphs hurts is shown in <a class="xlink" href="https://daniel-hopium.github.io/pattern-library/#details/centered">Good &amp; Bad</a>.')},
{id:'text-overflow',cat:'type',name:'text-overflow',sub:tx('Kürzen mit …','Truncating with …'),mdn:'text-overflow',
 desc:tx('Einzeilig kürzen braucht drei Eigenschaften zusammen: <code>overflow: hidden</code>, <code>white-space: nowrap</code> und <code>text-overflow: ellipsis</code>. Für mehrere Zeilen gibt es <code>line-clamp</code>.','Truncating a single line takes three properties together: <code>overflow: hidden</code>, <code>white-space: nowrap</code> and <code>text-overflow: ellipsis</code>. For multiple lines there’s <code>line-clamp</code>.'),
 stage:`<p class="ca-text ca-w260">${tx('Dieser Satz ist absichtlich zu lang für eine Zeile, damit man sieht, wie gekürzt wird und was dabei verloren geht.','This sentence is deliberately too long for one line, so you can see how it gets truncated and what gets lost along the way.')}</p>`,t:['.ca-text','.text'],
 vals:[['normal',{},''],['truncate',{overflow:'hidden','white-space':'nowrap','text-overflow':'ellipsis'},'truncate'],['line-clamp: 2',{overflow:'hidden',display:'-webkit-box','-webkit-box-orient':'vertical','-webkit-line-clamp':'2'},'line-clamp-2']],
 tip:tx('Was abgeschnitten ist, ist weg – auch für Menschen, die es brauchen. Den vollen Text anbieten oder lieber umbrechen lassen, siehe <a class="xlink" href="https://daniel-hopium.github.io/pattern-library/#details/truncation">Gut &amp; Schlecht</a>.','What’s cut off is gone – including for people who need it. Offer the full text or let it wrap instead, see <a class="xlink" href="https://daniel-hopium.github.io/pattern-library/#details/truncation">Good &amp; Bad</a>.')},
{id:'white-space',cat:'type',name:'white-space',sub:tx('Leerzeichen und Umbrüche aus dem Quelltext','Spaces and line breaks from the source'),mdn:'white-space',
 desc:tx('<code>white-space</code> bestimmt, was mit mehrfachen Leerzeichen und Zeilenumbrüchen im Quelltext passiert – und ob der Browser umbrechen darf.','<code>white-space</code> determines what happens to multiple spaces and line breaks in the source – and whether the browser may wrap.'),
 stage:`<p class="ca-text ca-w260">${tx(`Drei    Leerzeichen   hier.
Und ein Zeilenumbruch im Quelltext, gefolgt von einem Satz, der zu lang für eine Zeile ist.`,`Three    spaces   here.
And a line break in the source, followed by a sentence that is too long for one line.`)}</p>`,t:['.ca-text','.text'],
 vals:[['normal','normal','whitespace-normal'],['nowrap','nowrap','whitespace-nowrap'],['pre','pre','whitespace-pre'],['pre-wrap','pre-wrap','whitespace-pre-wrap']],
 tip:tx('<code>pre-wrap</code> passt für Text, den Nutzer eingegeben haben, etwa Kommentare: Ihre Umbrüche bleiben erhalten, lange Zeilen brechen trotzdem um.','<code>pre-wrap</code> suits text that users typed, such as comments: their line breaks are kept, and long lines still wrap.')},
{id:'overflow-wrap',cat:'type',name:'overflow-wrap',sub:tx('Lange Wörter umbrechen','Wrapping long words'),mdn:'overflow-wrap',
 desc:tx('Lange Wörter ohne Leerzeichen – URLs, Dateinamen, deutsche Komposita – laufen sonst aus ihrem Kasten.','Long words without spaces – URLs, file names, German compound nouns – otherwise run out of their box.'),
 stage:tx(`<p class="ca-text ca-w160" lang="de">https://example.org/ein/sehr/langer/pfad und die Donaudampfschifffahrtsgesellschaft</p>`,`<p class="ca-text ca-w160" lang="en">https://example.org/a/very/long/path and the German word <span lang="de">Donaudampfschifffahrtsgesellschaft</span></p>`),t:['.ca-text','.text'],
 vals:[['normal',{},''],['overflow-wrap: anywhere',{'overflow-wrap':'anywhere'},'wrap-anywhere'],['word-break: break-all',{'word-break':'break-all'},'break-all'],['hyphens: auto',{hyphens:'auto'},'hyphens-auto']],
 tip:tx('<code>anywhere</code> bricht nur, wenn es nötig ist. <code>break-all</code> bricht überall, auch mitten in kurzen Wörtern. <code>hyphens: auto</code> trennt korrekt mit Bindestrich, braucht aber ein <code>lang</code>-Attribut.','<code>anywhere</code> only breaks when necessary. <code>break-all</code> breaks everywhere, even in the middle of short words. <code>hyphens: auto</code> hyphenates correctly with a hyphen, but needs a <code>lang</code> attribute.')},
/* Rahmen & Effekte */
{id:'border-radius',cat:'look',name:'border-radius',sub:tx('Ecken abrunden','Rounding corners'),mdn:'border-radius',
 desc:tx('<code>border-radius</code> rundet die Ecken ab. Ein sehr großer Wert macht aus einem Rechteck eine Pille, aus einem Quadrat einen Kreis.','<code>border-radius</code> rounds the corners. A very large value turns a rectangle into a pill and a square into a circle.'),
 stage:`<div class="ca-i ca-t2 ca-sq">${tx('Ecke','Corner')}</div>`,t:['.ca-sq','.box'],
 vals:[['0','0','rounded-none'],['6px','6px','rounded-md'],['12px','12px','rounded-xl'],['9999px','9999px','rounded-full']],
 tip:tx('Innerer Radius = äußerer Radius minus Abstand, sonst wirken verschachtelte Karten an den Ecken dick. In White-Label-Apps ist der Radius ein Design Token – wechsle oben die Marke und schau dir die Buttons an.','Inner radius = outer radius minus padding, otherwise nested cards look thick at the corners. In white-label apps the radius is a design token – switch the brand at the top and look at the buttons.')},
{id:'box-shadow',cat:'look',name:'box-shadow',sub:tx('Schatten und Höhe','Shadows and elevation'),mdn:'box-shadow',
 desc:tx('<code>box-shadow</code> wirft einen Schatten: Versatz x, Versatz y, Unschärfe, Ausdehnung, Farbe. Mehrere Schatten, mit Komma getrennt, wirken natürlicher.','<code>box-shadow</code> casts a shadow: x offset, y offset, blur, spread, color. Several shadows, separated by commas, look more natural.'),
 stage:`<div class="ca-card">${tx('Karte','Card')}</div>`,t:['.ca-card','.card'],
 vals:[['none','none','shadow-none'],['sm','0 1px 3px 0 rgb(0 0 0 / 0.1), 0 1px 2px -1px rgb(0 0 0 / 0.1)','shadow-sm'],['md','0 4px 6px -1px rgb(0 0 0 / 0.1), 0 2px 4px -2px rgb(0 0 0 / 0.1)','shadow-md'],['xl','0 20px 25px -5px rgb(0 0 0 / 0.1), 0 8px 10px -6px rgb(0 0 0 / 0.1)','shadow-xl'],['inset','inset 0 2px 6px rgb(0 0 0 / 0.2)','shadow-[inset_0_2px_6px_rgb(0_0_0/0.2)]']],def:2,
 tip:tx('Schatten zeigen Höhe: Je höher ein Element schwebt – Dropdown, Dialog –, desto größer und weicher. Im Dark Mode sieht man Schatten kaum, dort helfen hellere Flächen.','Shadows show elevation: the higher an element floats – dropdown, dialog –, the larger and softer the shadow. In dark mode shadows are hard to see; lighter surfaces help there.')},
{id:'border-outline',cat:'look',name:'border vs. outline',sub:tx('Warum Fokusringe outline nutzen','Why focus rings use outline'),mdn:'outline',
 desc:tx('<code>border</code> gehört zum Box Model und braucht Platz – die Nachbarn rücken zur Seite. <code>outline</code> wird außen darübergezeichnet und verschiebt nichts. Hier für Nummer 2.','<code>border</code> is part of the box model and takes up space – the neighbors move aside. <code>outline</code> is drawn on top, on the outside, and shifts nothing. Here for item 2.'),
 stage:cC(cN(3)),base:[['.ca-c','.container',{display:'flex',gap:'8px','align-items':'flex-start'}]],t:['.ca-n2','.item-2'],
 vals:[[tx('nichts','nothing'),{},''],['border: 4px',{border:'4px solid #F59E0B'},'border-4 border-amber-500'],['outline: 4px',{outline:'4px solid #F59E0B'},'outline-4 outline-amber-500'],['outline + offset',{outline:'4px solid #F59E0B','outline-offset':'4px'},'outline-4 outline-offset-4']],
 tip:tx('Darum nimmt man für Fokusringe <code>outline</code>: Beim Fokussieren springt nichts. Und nie <code>outline: none</code> ohne Ersatz (<a class="xlink" href="https://daniel-hopium.github.io/pattern-library/#wcag-kriterien/2.4.7">WCAG 2.4.7</a>).','That’s why focus rings use <code>outline</code>: nothing jumps when an element gets focus. And never <code>outline: none</code> without a replacement (<a class="xlink" href="https://daniel-hopium.github.io/pattern-library/#wcag-kriterien/2.4.7">WCAG 2.4.7</a>).')},
{id:'hide',cat:'look',name:tx('Verstecken','Hiding'),sub:'opacity, visibility, display, sr-only',mdn:'visibility',
 desc:tx('Vier Arten, etwas zu verstecken – sie unterscheiden sich darin, ob Platz, Klickbarkeit und Screenreader erhalten bleiben. Nummer 2 ist ein Button: Klick auf die Stelle, wo er war.','Four ways to hide something – they differ in whether the space, clickability and screen reader access are kept. Item 2 is a button: click the spot where it was.'),
 stage:cC(`${cI(1)}<button type="button" class="ca-i ca-t2 ca-n2 ca-btn">2</button>${cI(3)}`),base:FLEX,t:['.ca-n2','.button'],
 vals:[[tx('sichtbar','visible'),{},'',tx('Normalzustand.','Normal state.')],
  ['opacity: 0',{opacity:'0'},'opacity-0',tx('Platz bleibt · trotzdem klickbar und per Tab erreichbar · Screenreader lesen ihn vor. Die gefährlichste Variante.','Space stays · still clickable and reachable with Tab · screen readers read it out. The most dangerous option.')],
  ['visibility: hidden',{visibility:'hidden'},'invisible',tx('Platz bleibt · nicht klickbar · für Screenreader weg.','Space stays · not clickable · gone for screen readers.')],
  ['display: none',{display:'none'},'hidden',tx('Platz verschwindet · nicht klickbar · für Screenreader weg.','Space disappears · not clickable · gone for screen readers.')],
  ['sr-only',{position:'absolute',width:'1px',height:'1px',padding:'0',margin:'-1px',overflow:'hidden',clip:'rect(0, 0, 0, 0)','white-space':'nowrap','border-width':'0'},'sr-only',tx('Unsichtbar und ohne Platz – aber Screenreader lesen ihn vor. Für Zusatztext wie „(öffnet in neuem Tab)“.','Invisible and takes no space – but screen readers read it out. For extra text like “(opens in new tab)”.')]],
 init(st){$('.ca-btn',st).addEventListener('click',()=>toast({msg:tx('Button 2 wurde geklickt.','Button 2 was clicked.'),duration:2500}))}},
{id:'filter',cat:'look',name:'filter',sub:tx('Bildbearbeitung per CSS','Image editing with CSS'),mdn:'filter',
 desc:tx('<code>filter</code> verändert die Darstellung wie ein Bildprogramm: Unschärfe, Graustufen, Helligkeit, Schatten.','<code>filter</code> changes the rendering like an image editor: blur, grayscale, brightness, shadow.'),
 stage:`<div class="ca-row"><div class="ca-photo ca-f" role="img" aria-label="${tx('Bunte Fläche','Colorful area')}"></div><svg class="ca-f ca-shape" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3l2.8 5.8 6.2.9-4.5 4.4 1.1 6.2L12 17.3l-5.6 3 1.1-6.2L3 9.7l6.2-.9z"/></svg></div>`,t:['.ca-f','.image'],
 vals:[['none','none','filter-none'],['blur(4px)','blur(4px)','blur-xs'],['grayscale(1)','grayscale(1)','grayscale'],['brightness(1.25)','brightness(1.25)','brightness-125'],['drop-shadow',{filter:'drop-shadow(0 6px 6px rgb(0 0 0 / 0.4))'},'drop-shadow-[0_6px_6px_rgb(0_0_0/0.4)]']],
 tip:tx('<code>drop-shadow</code> folgt der echten Form – beim Stern sieht man es –, <code>box-shadow</code> immer dem Rechteck. <code>grayscale(1)</code> auf <code>html</code> ist ein schneller Test, ob Farbe allein Bedeutung trägt.','<code>drop-shadow</code> follows the real shape – you can see it on the star –, <code>box-shadow</code> always follows the rectangle. <code>grayscale(1)</code> on <code>html</code> is a quick test of whether color alone carries meaning.')},
{id:'backdrop-filter',cat:'look',name:'backdrop-filter',sub:tx('Milchglas','Frosted glass'),mdn:'backdrop-filter',
 desc:tx('<code>backdrop-filter</code> wendet einen Filter auf das an, was <em>hinter</em> dem Element liegt – der bekannte Milchglas-Effekt.','<code>backdrop-filter</code> applies a filter to whatever lies <em>behind</em> the element – the well-known frosted glass effect.'),
 stage:`<div class="ca-photo ca-bd"><div class="ca-glass">${tx('Milchglas','Frosted glass')}</div></div>`,t:['.ca-glass','.panel'],
 vals:[['none','none','backdrop-blur-none'],['blur(4px)','blur(4px)','backdrop-blur-xs'],['blur(8px)','blur(8px)','backdrop-blur-sm'],['blur(16px)','blur(16px)','backdrop-blur-lg']],
 tip:tx('Wirkt nur mit halbtransparentem Hintergrund. Kontrast prüfen: Je nach Motiv dahinter wird Text auf Milchglas schnell unlesbar.','Only works with a semi-transparent background. Check the contrast: depending on what’s behind it, text on frosted glass quickly becomes unreadable.')},
/* Transform & Transition */
{id:'transform',cat:'motion',name:'transform',sub:tx('Verschieben, drehen, skalieren','Move, rotate, scale'),mdn:'transform',
 desc:tx('<code>transform</code> verschiebt, dreht, skaliert oder verzerrt ein Element – rein optisch. Hier Nummer 2.','<code>transform</code> moves, rotates, scales or skews an element – purely visually. Here item 2.'),
 stage:cC(cN(3)),base:FLEX,t:['.ca-n2','.item-2'],
 vals:[['none','none','transform-none'],['translateX(24px)','translateX(24px)','translate-x-6'],['rotate(12deg)','rotate(12deg)','rotate-12'],['scale(1.25)','scale(1.25)','scale-125'],['skewX(12deg)','skewX(12deg)','skew-x-12']],
 tip:tx('Die Nachbarn bleiben, wo sie sind: <code>transform</code> ändert das Layout nicht. Darum laufen Animationen mit <code>transform</code> flüssig, während <code>width</code>, <code>top</code> oder <code>margin</code> ruckeln – die zwingen den Browser, das Layout neu zu berechnen.','The neighbors stay where they are: <code>transform</code> doesn’t change the layout. That’s why animations with <code>transform</code> run smoothly, while <code>width</code>, <code>top</code> or <code>margin</code> stutter – they force the browser to recalculate the layout.')},
{id:'transform-origin',cat:'motion',name:'transform-origin',sub:tx('Um welchen Punkt gedreht wird','The point it rotates around'),mdn:'transform-origin',
 desc:tx('<code>transform-origin</code> legt den Punkt fest, um den gedreht und skaliert wird. Standard ist die Mitte. Der gestrichelte Rahmen zeigt die Ausgangslage.','<code>transform-origin</code> sets the point that rotation and scaling happen around. The default is the center. The dashed frame shows the starting position.'),
 stage:`<div class="ca-orig"><div class="ca-ghost"></div><div class="ca-i ca-t3 ca-sq ca-rot">${tx('Drehpunkt','Pivot')}</div></div>`,
 base:[['.ca-rot','.box',{transform:'rotate(25deg)'}]],t:['.ca-rot','.box'],
 vals:[['center','center','origin-center'],['top left','top left','origin-top-left'],['bottom right','bottom right','origin-bottom-right']],
 tip:tx('Ein Dropdown, das aus seinem Button herauswachsen soll, braucht <code>transform-origin: top</code> – sonst wächst es aus der Mitte.','A dropdown that should grow out of its button needs <code>transform-origin: top</code> – otherwise it grows out of the center.')},
{id:'transition',cat:'motion',name:'transition',sub:tx('Den Wechsel animieren','Animating the change'),mdn:'transition',
 desc:tx('<code>transition</code> animiert den Wechsel zwischen zwei Zuständen: welche Eigenschaft, wie lange, mit welcher Kurve. Wähl einen Wert und drück „Bewegen“.','<code>transition</code> animates the change between two states: which property, how long, with which curve. Pick a value and press “Move”.'),
 stage:`<div class="ca-track"><div class="ca-i ca-t2 ca-ball" aria-hidden="true"></div></div><button type="button" class="btn btn-secondary ca-go">${tx('Bewegen','Move')}</button>`,t:['.ca-ball','.ball'],
 vals:[['none','none','transition-none'],['150ms ease-out','transform 150ms ease-out','transition-transform duration-150 ease-out'],['400ms ease-in-out','transform 400ms ease-in-out','transition-transform duration-400 ease-in-out'],['1s linear','transform 1s linear','transition-transform duration-1000 ease-linear']],def:1,
 init(st){let on=false;const b=$('.ca-ball',st),tr=$('.ca-track',st);$('.ca-go',st).addEventListener('click',()=>{on=!on;b.style.transform=on?`translateX(${tr.clientWidth-b.offsetWidth-16}px)`:''})},
 tip:tx('Kleine Elemente 100–200 ms, <code>ease-out</code> beim Hereinkommen; <code>linear</code> wirkt mechanisch. Ist in deinem System „Bewegung reduzieren“ an, springt die Kugel sofort – so soll es sein.','Small elements 100–200 ms, <code>ease-out</code> when entering; <code>linear</code> feels mechanical. If “Reduce motion” is on in your system, the ball jumps instantly – that’s how it should be.')},
/* Interaktion */
{id:'cursor',cat:'interact',name:'cursor',sub:tx('Der Mauszeiger','The mouse pointer'),mdn:'cursor',
 desc:tx('<code>cursor</code> legt fest, welchen Mauszeiger man über dem Element sieht. Fahr mit der Maus über den Kasten.','<code>cursor</code> sets which mouse pointer you see over the element. Move your mouse over the box.'),
 stage:`<div class="ca-cur">${tx('Fahr mit der Maus hier drüber','Move your mouse over here')}</div>`,t:['.ca-cur','.element'],
 vals:[['default','default','cursor-default'],['pointer','pointer','cursor-pointer'],['text','text','cursor-text'],['move','move','cursor-move'],['grab','grab','cursor-grab'],['not-allowed','not-allowed','cursor-not-allowed'],['help','help','cursor-help']],
 tip:tx('Die Hand (<code>pointer</code>) zeigen Browser nur bei Links; ob Buttons sie bekommen, ist Geschmackssache – siehe <a class="xlink" href="https://daniel-hopium.github.io/pattern-library/#details/clickable-card">Gut &amp; Schlecht</a>. <code>not-allowed</code> ersetzt keine Erklärung, warum etwas nicht geht.','Browsers show the hand (<code>pointer</code>) only on links; whether buttons get it is a matter of taste – see <a class="xlink" href="https://daniel-hopium.github.io/pattern-library/#details/clickable-card">Good &amp; Bad</a>. <code>not-allowed</code> doesn’t replace an explanation of why something isn’t possible.')},
{id:'pointer-events',cat:'interact',name:'pointer-events',sub:tx('Klicks durchlassen','Letting clicks through'),mdn:'pointer-events',
 desc:tx('<code>pointer-events: none</code> macht ein Element für Maus und Touch durchlässig – Klicks gehen an das, was darunter liegt. Das gestreifte Overlay liegt über dem Button.','<code>pointer-events: none</code> makes an element transparent to mouse and touch – clicks go to whatever lies beneath it. The striped overlay sits on top of the button.'),
 stage:`<div class="ca-pe"><button type="button" class="btn btn-primary ca-pe-btn">${tx('Klick mich','Click me')}</button><div class="ca-pe-over">Overlay</div></div>`,t:['.ca-pe-over','.overlay'],
 vals:[['auto','auto','pointer-events-auto'],['none','none','pointer-events-none']],
 init(st){$('.ca-pe-btn',st).addEventListener('click',()=>toast({msg:tx('Der Button wurde geklickt.','The button was clicked.'),type:'success',duration:2500}));$('.ca-pe-over',st).addEventListener('click',()=>toast({msg:tx('Das Overlay hat den Klick abgefangen.','The overlay intercepted the click.'),duration:2500}))},
 tip:tx('Praktisch für dekorative Overlays, Verläufe und Icons in Eingabefeldern. Tastatur-Fokus und Screenreader betrifft es aber nicht – als „deaktiviert“ taugt es nicht.','Handy for decorative overlays, gradients and icons in input fields. It doesn’t affect keyboard focus or screen readers, though – it’s no good as “disabled”.')},
{id:'user-select',cat:'interact',name:'user-select',sub:tx('Markieren erlauben oder erleichtern','Allowing or easing text selection'),mdn:'user-select',
 desc:tx('<code>user-select</code> steuert, ob und wie sich Text markieren lässt. Versuch, die beiden Zeilen zu markieren – oder klick einmal hinein.','<code>user-select</code> controls whether and how text can be selected. Try selecting the two lines – or click into them once.'),
 stage:`<p class="ca-text ca-us">${tx('Ein Satz zum Markieren mit der Maus.','A sentence to select with the mouse.')}</p><p class="ca-mono ca-us">npm install daumenregel</p>`,t:['.ca-us','.text'],
 vals:[['auto','auto','select-auto'],['none','none','select-none'],['all','all','select-all'],['text','text','select-text']],
 tip:tx('<code>all</code> ist praktisch für Befehle und Codes zum Kopieren: Ein Klick markiert alles. <code>none</code> nur für Bedienelemente – nie für Inhalt, den jemand kopieren will.','<code>all</code> is handy for commands and codes to copy: one click selects everything. Use <code>none</code> only for controls – never for content someone might want to copy.')},
