{id:'scroll-snap',cat:'interact',name:'scroll-snap-type',sub:tx('Einrasten beim Scrollen','Snapping while scrolling'),mdn:'CSS_scroll_snap',
 desc:tx('<code>scroll-snap</code> lässt einen Scroll-Container an bestimmten Punkten einrasten – wie ein Karussell, nur ohne JavaScript. Scroll im Kasten seitwärts.','<code>scroll-snap</code> makes a scroll container snap to certain points – like a carousel, just without JavaScript. Scroll sideways in the box.'),
 stage:`<div class="ca-snap" tabindex="0" role="region" aria-label="${tx('Seitwärts scrollende Karten','Cards scrolling sideways')}">${[1,2,3,4,5,6].map(n=>`<div class="ca-i ca-t${(n-1)%4+1} ca-snapi">${tx('Karte','Card')} ${n}</div>`).join('')}</div>`,
 base:[['.ca-snapi','.card',{'scroll-snap-align':'start'}]],t:['.ca-snap','.container'],
 vals:[['none','none','snap-none'],['x mandatory','x mandatory','snap-x snap-mandatory'],['x proximity','x proximity','snap-x snap-proximity']],def:1,
 tip:tx('<code>mandatory</code> rastet immer ein, <code>proximity</code> nur in der Nähe eines Punkts. Die Kinder brauchen <code>scroll-snap-align</code>. Mit der Tastatur: erst in den Kasten tabben, dann Pfeiltasten.','<code>mandatory</code> always snaps, <code>proximity</code> only near a snap point. The children need <code>scroll-snap-align</code>. With the keyboard: tab into the box first, then use the arrow keys.')},
{id:'accent-color',cat:'interact',name:'accent-color',sub:tx('Native Formularelemente einfärben','Coloring native form controls'),mdn:'accent-color',
 desc:tx('<code>accent-color</code> färbt Checkbox, Radio, Regler und Fortschrittsbalken mit einer Zeile ein.','<code>accent-color</code> colors checkboxes, radio buttons, sliders and progress bars with a single line.'),
 stage:`<div class="ca-form"><label><input type="checkbox" checked> Checkbox</label><label><input type="radio" name="ca-acc" checked> Radio</label><input type="range" value="60" aria-label="${tx('Regler','Slider')}"><progress value="60" max="100">${tx('60 %','60%')}</progress></div>`,t:['.ca-form','.form'],
 vals:[['auto','auto','accent-auto'],['#BE185D','#BE185D','accent-[#BE185D]'],['#047857','#047857','accent-[#047857]'],['#0369A1','#0369A1','accent-[#0369A1]']],def:1,
 tip:tx('Der Browser passt die Farbe des Häkchens selbst an, damit der Kontrast stimmt. Für die meisten Formulare reicht das, statt Checkboxen nachzubauen.','The browser adjusts the checkmark color itself so the contrast holds. For most forms that’s enough – no need to rebuild checkboxes.')},
/* Selektoren */
{id:'combinators',cat:'sel',name:tx('Kombinatoren','Combinators'),sub:tx('Leerzeichen, >, + und ~','Space, >, + and ~'),mode:'sel',mdn:'Child_combinator',
 desc:tx('Kombinatoren verbinden zwei Selektoren und beschreiben die Beziehung im DOM: Nachkomme, Kind oder Geschwister.','Combinators connect two selectors and describe their relationship in the DOM: descendant, child or sibling.'),
 stage:`<div class="box"><h4>${tx('Überschrift','Heading')}</h4><p>${tx('Absatz 1 – Kind von .box','Paragraph 1 – child of .box')}</p><p>${tx('Absatz 2 – Kind von .box','Paragraph 2 – child of .box')}</p><section><p>${tx('Absatz 3 – steckt in einer section','Paragraph 3 – sits inside a section')}</p></section><p>${tx('Absatz 4 – Kind von .box','Paragraph 4 – child of .box')}</p></div>`,
 vals:[['.box p','[&_p]:',tx('Leerzeichen: alle Nachkommen, egal wie tief – auch Absatz 3.','Space: all descendants, however deep – including paragraph 3.')],['.box > p','[&>p]:',tx('>: nur direkte Kinder – Absatz 3 nicht.','>: direct children only – not paragraph 3.')],['h4 + p','',tx('+: nur das direkt folgende Geschwister.','+: only the immediately following sibling.')],['h4 ~ p','',tx('~: alle folgenden Geschwister auf derselben Ebene.','~: all following siblings on the same level.')]]},
{id:'nth-child',cat:'sel',name:':nth-child',sub:tx('Nach Position auswählen','Selecting by position'),mode:'sel',mdn:':nth-child',
 desc:tx('<code>:nth-child</code> wählt Elemente nach ihrer Position unter den Geschwistern – für Zebrastreifen, das erste oder „jedes dritte“.','<code>:nth-child</code> selects elements by their position among their siblings – for zebra stripes, the first one or “every third”.'),
 stage:`<ol class="list">${[1,2,3,4,5,6,7].map(n=>`<li>${tx('Eintrag','Item')} ${n}</li>`).join('')}</ol>`,
 vals:[['li:first-child','first:'],['li:nth-child(2)','nth-2:'],['li:nth-child(odd)','odd:',tx('odd = 1, 3, 5 … – even wären die geraden.','odd = 1, 3, 5 … – even would be the even ones.')],['li:nth-child(3n)','nth-[3n]:',tx('3n = jedes dritte: 3, 6, 9 …','3n = every third: 3, 6, 9 …')],['li:last-child','last:'],['li:nth-last-child(2)','nth-last-2:',tx('Von hinten gezählt.','Counted from the end.')]],
 tip:tx('<code>:nth-child</code> zählt alle Geschwister, auch andere Tags. Steht eine Überschrift zwischen den <code>li</code>, verschiebt sie die Zählung. Dann hilft <code>:nth-of-type</code> oder <code>:nth-child(odd of li)</code>.','<code>:nth-child</code> counts all siblings, including other tags. If a heading sits between the <code>li</code> elements, it shifts the count. Then <code>:nth-of-type</code> or <code>:nth-child(odd of li)</code> helps.')},
{id:'has',cat:'sel',name:':has()',sub:tx('Der Eltern-Selektor','The parent selector'),mode:'sel',mdn:':has',
 desc:tx('<code>:has()</code> wählt ein Element danach aus, was in ihm steckt. Hak die Karten an – die Markierung folgt live.','<code>:has()</code> selects an element based on what’s inside it. Check the cards – the highlight follows live.'),
 stage:`<div class="cards"><label class="card"><input type="checkbox"> ${tx('Tarif','Plan')} S</label><label class="card"><input type="checkbox" checked> ${tx('Tarif','Plan')} M <span class="badge">${tx('Beliebt','Popular')}</span></label><label class="card"><input type="checkbox"> ${tx('Tarif','Plan')} L</label></div>`,
 vals:[['.card:has(input:checked)','has-checked:',tx('Die Karte, deren Checkbox an ist.','The card whose checkbox is on.')],['.card:has(.badge)','has-[.badge]:',tx('Die Karte, die ein Badge enthält.','The card that contains a badge.')],['.cards:has(input:checked) .card:not(:has(input:checked))','',tx('Alle anderen – sobald irgendeine gewählt ist.','All the others – as soon as any one is selected.')]],
 tip:tx('Damit geht ohne JavaScript, wofür man früher Klassen umschalten musste. In dieser App färbt <code>.seg label:has(input:checked)</code> die Segmented Controls.','This does without JavaScript what used to require toggling classes. In this app, <code>.seg label:has(input:checked)</code> colors the segmented controls.')},
{id:'states',cat:'sel',name:tx(':hover, :focus & Co.',':hover, :focus & co.'),sub:tx('Zustände, die der Nutzer auslöst','States the user triggers'),mode:'sel',noCount:true,mdn:':focus-visible',
 desc:tx('Pseudoklassen beschreiben einen Zustand: Maus darüber, gedrückt, fokussiert. Wähl einen aus und probier ihn am Button oder am Feld aus.','Pseudo-classes describe a state: mouse over it, pressed, focused. Pick one and try it on the button or the field.'),
 stage:`<div class="ca-states"><button type="button" class="button btn btn-secondary">Button</button><div class="group"><label for="ca-states-in">Name</label><input class="textbox input" id="ca-states-in"></div></div>`,
 vals:[['.button:hover','hover:',tx('Mit der Maus drüberfahren.','Move the mouse over it.')],['.button:active','active:',tx('Klicken und gedrückt halten.','Click and hold.')],['.button:focus','focus:',tx('Anklicken – und dann per Tab hinspringen. Beide Male markiert.','Click it – then jump to it with Tab. Highlighted both times.')],['.button:focus-visible','focus-visible:',tx('Anklicken: keine Markierung. Per Tab: Markierung. Der Browser zeigt sie nur, wenn sie gebraucht wird.','Click: no highlight. With Tab: highlight. The browser only shows it when it’s needed.')],['.group:focus-within','focus-within:',tx('Ins Feld klicken: Die ganze Gruppe wird markiert.','Click into the field: the whole group gets highlighted.')]],
 tip:tx('Für Fokusringe <code>:focus-visible</code> statt <code>:focus</code>: Nach einem Mausklick kein Ring, mit der Tastatur immer. <code>:hover</code> allein reicht nie – Touch und Tastatur kennen es nicht.','For focus rings, use <code>:focus-visible</code> instead of <code>:focus</code>: no ring after a mouse click, always one with the keyboard. <code>:hover</code> alone is never enough – touch and keyboard don’t have it.')},
{id:'pseudo-elements',cat:'sel',name:'::before & ::after',sub:tx('Pseudo-Elemente','Pseudo-elements'),mode:'css',mdn:'::before',
 desc:tx('<code>::before</code> und <code>::after</code> erzeugen ein zusätzliches Element vor oder nach dem Inhalt – nur mit CSS. <code>::marker</code> gestaltet Listenpunkte, <code>::selection</code> markierten Text.','<code>::before</code> and <code>::after</code> create an extra element before or after the content – with CSS alone. <code>::marker</code> styles list bullets, <code>::selection</code> styles selected text.'),
 stage:`<a class="link" href="#">${tx('Mehr erfahren','Learn more')}</a><p class="notice">${tx('Das ist ein Hinweis zum Markieren.','This is a notice you can select.')}</p><ul class="bullets"><li>${tx('Erster Punkt','First item')}</li><li>${tx('Zweiter Punkt','Second item')}</li></ul>`,
 vals:[[tx('ohne','without'),'',''],['::after','& .link::after { content: " →"; }',"after:content-['_→']"],['::before','& .notice::before { content: "⚠ "; color: #B45309; }',''],['::marker','& .bullets li::marker { content: "✓  "; color: #047857; }','marker:text-emerald-700'],['::selection','& .notice::selection { background: #FDE047; color: #000; }','selection:bg-yellow-300',tx('Markier den Hinweis-Text mit der Maus.','Select the notice text with your mouse.')]],
 tip:tx('Text aus <code>content</code> lesen die meisten Screenreader mit. Rein Dekoratives bekommt einen leeren Alternativtext: <code>content: "→" / ""</code>.','Most screen readers read out text from <code>content</code>. Purely decorative content gets an empty alternative text: <code>content: "→" / ""</code>.')},
{id:'attribute',cat:'sel',name:tx('Attribut-Selektoren','Attribute selectors'),sub:'[href], ^=, $=, data-*',mode:'sel',mdn:'Attribute_selectors',
 desc:tx('Attribut-Selektoren wählen Elemente nach ihren Attributen und deren Werten – ohne zusätzliche Klassen.','Attribute selectors pick elements by their attributes and those attributes’ values – without extra classes.'),
 stage:`<div class="ca-attrs"><a href="https://example.org">${tx('Extern','External')}</a><a href="/intern">${tx('Intern','Internal')}</a><a href="bericht.pdf">${tx('Bericht (PDF)','Report (PDF)')}</a><a>${tx('ohne href','without href')}</a><button type="button" data-state="open" class="btn btn-secondary">${tx('Menü (offen)','Menu (open)')}</button><button type="button" data-state="closed" class="btn btn-secondary">${tx('Suche (zu)','Search (closed)')}</button></div>`,
 vals:[['a[href]','',tx('Alle Links mit href.','All links with href.')],['a[href^="https"]','',tx('^= beginnt mit.','^= starts with.')],['a[href$=".pdf"]','',tx('$= endet mit – etwa für ein PDF-Symbol.','$= ends with – e.g. for a PDF icon.')],['[data-state="open"]','data-[state=open]:',tx('Zustand als data-Attribut, typisch für Komponentenbibliotheken.','State as a data attribute, typical of component libraries.')],['a:not([href])','',tx('Ein a ohne href ist kein Link: nicht fokussierbar, keine Rolle.','An a without href isn’t a link: not focusable, no role.')]],
 tip:tx('<code>[aria-expanded="true"]</code> oder <code>[aria-current="page"]</code> als Styling-Haken koppeln Optik und Barrierefreiheit: Stimmt das Attribut nicht, sieht man es sofort. Diese App stylt den aktiven Eintrag der Seitenleiste genau so.','Using <code>[aria-expanded="true"]</code> or <code>[aria-current="page"]</code> as styling hooks couples visuals and accessibility: if the attribute is wrong, you see it right away. This app styles the active sidebar entry exactly that way.')},
{id:'specificity',cat:'sel',name:tx('Spezifität','Specificity'),sub:tx('Welche Regel gewinnt?','Which rule wins?'),mode:'css',mdn:'Specificity',
 desc:tx('Treffen mehrere Regeln dasselbe Element, gewinnt die spezifischere – erst bei Gleichstand die spätere. Gezählt wird (IDs, Klassen/Attribute/Pseudoklassen, Elemente).','When several rules hit the same element, the more specific one wins – only on a tie does the later one win. The count is (IDs, classes/attributes/pseudo-classes, elements).'),
 stage:`<div class="box"><p class="note" id="ca-x">${tx('Welche Farbe gewinnt?','Which color wins?')}</p></div>`,
 vals:[[tx('Element vs. Klasse','Element vs. class'),'& p { color: #0369A1; }\n& .note { color: #047857; }','',tx('.note (0,1,0) schlägt p (0,0,1): grün.','.note (0,1,0) beats p (0,0,1): green.')],
  [tx('Mehr Teile','More parts'),'& .box p { color: #BE185D; }\n& .note { color: #047857; }','',tx('.box p (0,1,1) schlägt .note (0,1,0): pink – obwohl .note später steht.','.box p (0,1,1) beats .note (0,1,0): pink – even though .note comes later.')],
  [':where()','& :where(.box) p { color: #BE185D; }\n& .note { color: #047857; }','',tx(':where() zählt null, bleibt also (0,0,1): grün. So bauen Resets Regeln, die man leicht überschreibt.',':where() counts as zero, so it stays (0,0,1): green. That’s how resets build rules that are easy to override.')],
  ['ID','& #ca-x { color: #6D28D9; }\n& .box p.note { color: #047857; }','',tx('Eine ID (1,0,0) schlägt jede Menge Klassen: violett.','One ID (1,0,0) beats any number of classes: violet.')],
  ['!important','& .note { color: #047857 !important; }\n& #ca-x { color: #6D28D9; }','',tx('!important sticht jede Spezifität: grün. Danach hilft nur noch ein weiteres !important.','!important trumps any specificity: green. After that, only another !important helps.')]],
 tip:tx('Hohe Spezifität ist schwer zu überschreiben. Design-Systeme bleiben darum bei flachen Klassen, Tailwind erzeugt fast nur einzelne Klassen – alle mit derselben Spezifität.','High specificity is hard to override. That’s why design systems stick to flat classes, and Tailwind generates almost only single classes – all with the same specificity.')}
];

const CA_BY=Object.fromEntries(CSSA.map(e=>[e.id,e]));
const CAT_BY=Object.fromEntries(CA_CATS.map(c=>[c.id,c]));
const caMdn=p=>'https://developer.mozilla.org/en-US/docs/Web/CSS/'+p;
function caVal(e,v){
  if(!Array.isArray(v))v=[v];
  if(e.mode==='sel')return {label:v[0],val:v[0],tw:v[1]||'',note:v[2]||''};
  const [label,val=label,tw='',note='']=v;
  return {label,val:!e.mode&&typeof val==='string'?{[e.name]:val}:val,tw,note};
}
function caApply(e,art,i){
  const st=$('.ca-stage',art),sid='#'+st.id,v=caVal(e,e.vals[i]);
  let code;
  if(e.mode==='sel'){
    $('style',art).textContent=`${sid} ${v.val}{outline:3px solid var(--ca-hl);outline-offset:2px;background:var(--ca-hl-bg)}`;
    code=`<span class="ca-hl">${esc(v.val)}</span> {\n  /* … */\n}`;
  }else if(e.mode==='css'){
    $('style',art).textContent=v.val.replaceAll('&',sid);
    code=v.val?esc(v.val.replaceAll('& ','')):tx('/* keine Regel */','/* no rule */');
  }else{
    const keys=[...new Set(e.vals.flatMap(x=>Object.keys(caVal(e,x).val)))];
    $$(e.t[0],st).forEach(el=>{keys.forEach(k=>el.style.removeProperty(k));Object.entries(v.val).forEach(([k,x])=>{if(x!=='')el.style.setProperty(k,x)})});
    const blocks=new Map();
    const add=(sel,obj,hl)=>{const b=blocks.get(sel)||new Map();Object.entries(obj).forEach(([k,x])=>{if(x!=='')b.set(k,[x,hl])});blocks.set(sel,b)};
    (e.base||[]).forEach(([,sel,obj])=>add(sel,obj,false));
    add(e.t[1],v.val,true);
    code=[...blocks].map(([sel,b])=>`${sel} {\n${b.size?[...b].map(([k,[x,hl]])=>{const l=esc(`  ${k}: ${x};`);return hl?`<span class="ca-hl">${l}</span>`:l}).join('\n'):tx('  /* Standardwerte */','  /* default values */')}\n}`).join('\n\n');
  }
  $('.ca-pre code',art).innerHTML=code;
  const tw=$('.ca-tw',art);tw.hidden=!v.tw;$('code',tw).textContent=v.tw;
  const note=$('.ca-note',art);note.hidden=!v.note;note.textContent=v.note;
  const m=$('.ca-meas',art);let txt='';
  if(e.measure)txt=e.measure(st);
  else if(e.mode==='sel'&&!e.noCount){try{const n=$$(v.val,st).length;txt=tx(n===1?'Trifft 1 Element.':`Trifft ${n} Elemente.`,n===1?'Matches 1 element.':`Matches ${n} elements.`)}catch(err){}}
  m.hidden=!txt;m.textContent=txt;
}
const caEntryHTML=e=>`<article class="ca-entry" id="ca-${e.id}" data-id="${e.id}" aria-labelledby="ca-${e.id}-h">
  <h2 id="ca-${e.id}-h" tabindex="-1"><code>${esc(e.name)}</code><span class="ca-sub">${e.sub}</span></h2>
  <p class="ca-desc">${e.desc}</p>
  <fieldset class="ca-vals"><legend class="sr-only">${tx(`Wert für ${esc(e.name)} wählen`,`Choose a value for ${esc(e.name)}`)}</legend>${e.vals.map((v,i)=>`<label><input type="radio" name="ca-${e.id}" value="${i}"${i===(e.def||0)?' checked':''}><code>${esc(caVal(e,v).label)}</code></label>`).join('')}</fieldset>
  <div class="ca-stage" id="ca-st-${e.id}">${e.stage}</div>
  <p class="ca-meas" role="status" hidden></p><p class="ca-note" hidden></p>
  <div class="ca-codebox"><pre class="code ca-pre" tabindex="0" role="region" aria-label="${tx('CSS zu','CSS for')} ${esc(e.name)}"><code></code></pre><p class="ca-tw" hidden>${e.mode==='sel'?tx('Tailwind-Variante','Tailwind variant'):'Tailwind'}: <code></code></p></div>
  ${e.tip?`<p class="ca-tip"><b>${tx('Stolperfalle','Gotcha')}:</b> ${e.tip}</p>`:''}
  <p class="ca-links"><a href="${caMdn(e.mdn)}">MDN: ${esc(e.name)}${tx(' (englisch)','')}</a> · <a href="#${e.cat}/${e.id}">${tx('Link zu diesem Eintrag','Link to this entry')}</a></p>
  <style></style>
</article>`;
function caCatHTML(cat){
  const c=CAT_BY[cat],i=CA_CATS.indexOf(c),prev=CA_CATS[i-1],next=CA_CATS[i+1],es=CSSA.filter(e=>e.cat===cat);
  return `<article class="lesson" aria-labelledby="lesson-title">
  <p class="eyebrow">${tx(`Kapitel ${i+1} von ${CA_CATS.length}`,`Chapter ${i+1} of ${CA_CATS.length}`)}</p>
  <h1 id="lesson-title" tabindex="-1">${c.title}</h1>
  <p class="rule">${c.intro}</p>
  <nav aria-label="${tx('Einträge in','Entries in')} ${c.title}" class="ca-toc"><ul class="chips">${es.map(e=>`<li><a href="#${cat}/${e.id}"><code>${esc(e.name)}</code></a></li>`).join('')}</ul></nav>
  ${es.map(caEntryHTML).join('')}
  <nav class="pager" aria-label="${tx('Weitere Kapitel','More chapters')}">${prev?`<a class="prev" href="#${prev.id}"><small>${tx('← Voriges Kapitel','← Previous chapter')}</small>${prev.title}</a>`:`<a class="prev" href="#start"><small>${tx('← Zurück zum','← Back to the')}</small>${tx('Überblick','overview')}</a>`}${next?`<a class="next" href="#${next.id}"><small>${tx('Nächstes Kapitel →','Next chapter →')}</small>${next.title}</a>`:`<a class="next" href="#start"><small>${tx('Zurück zum','Back to the')}</small>${tx('Überblick','overview')}</a>`}</nav>
</article>`;
}
function caCatInit(root,sub){
  $$('.ca-entry',root).forEach(art=>{
    const e=CA_BY[art.dataset.id],st=$('.ca-stage',art);
    (e.base||[]).forEach(([dom,,obj])=>$$(dom,st).forEach(el=>Object.entries(obj).forEach(([k,v])=>el.style.setProperty(k,v))));
    art.addEventListener('change',ev=>{if(ev.target.name===`ca-${e.id}`)caApply(e,art,+ev.target.value);else if(e.mode==='sel')caApply(e,art,+$(`input[name="ca-${e.id}"]:checked`,art).value)});
    st.addEventListener('click',ev=>{if(ev.target.closest('a'))ev.preventDefault()});
    e.init?.(st);
    caApply(e,art,e.def||0);
  });
  const hit=CA_BY[sub]&&$('#ca-'+sub,root);
  if(hit){hit.classList.add('ca-hit');requestAnimationFrame(()=>hit.scrollIntoView({block:'start'}))}
}
function caStartHTML(){
  return `<article class="lesson" aria-labelledby="lesson-title">
  <p class="eyebrow">${tx('Überblick','Overview')}</p>
  <h1 id="lesson-title" tabindex="-1">${tx('CSS zum Anfassen','CSS you can touch')}</h1>
  <p class="rule">${tx(`${CSSA.length} Eigenschaften und Selektoren, jede mit einer Live-Vorschau: Wert anklicken, Wirkung sehen, CSS und Tailwind-Klasse ablesen. Wie die Tailwind-Doku – nur für das CSS darunter.`,`${CSSA.length} properties and selectors, each with a live preview: click a value, see the effect, read the CSS and the Tailwind class. Like the Tailwind docs – but for the CSS underneath.`)}</p>
  <div class="start-grid">${CA_CATS.map(c=>`<div class="tile"><h3>${c.title}</h3><p>${c.intro}</p><a class="btn btn-secondary" href="#${c.id}">${tx(`${CSSA.filter(e=>e.cat===c.id).length} Einträge`,`${CSSA.filter(e=>e.cat===c.id).length} entries`)}<span class="sr-only"> in ${c.title}</span></a></div>`).join('')}</div>
  <h2>${tx('Alle Einträge','All entries')}</h2>
  <div class="field ca-find"><label for="ca-q">${tx('Eigenschaft suchen','Search properties')} <span class="opt">${tx('Name oder Stichwort','name or keyword')}</span></label><input class="input" id="ca-q" type="search" autocomplete="off" spellcheck="false"></div>
  <p class="count" id="ca-count" role="status"></p>
  <div class="table-wrap" tabindex="0" role="region" aria-label="${tx('Alle Einträge im CSS-Atlas','All entries in the CSS Atlas')}"><table class="table ca-index"><caption class="sr-only">${tx('Alle Einträge im CSS-Atlas','All entries in the CSS Atlas')}</caption><thead><tr><th scope="col">${tx('Eigenschaft','Property')}</th><th scope="col">${tx('Was sie tut','What it does')}</th><th scope="col">${tx('Kapitel','Chapter')}</th></tr></thead><tbody>${CSSA.map(e=>`<tr data-q="${esc(norm(`${e.name} ${e.sub} ${CAT_BY[e.cat].title} ${e.desc.replace(/<[^>]+>/g,'')}`))}"><td><a href="#${e.cat}/${e.id}"><code>${esc(e.name)}</code></a></td><td>${e.sub}</td><td>${CAT_BY[e.cat].title}</td></tr>`).join('')}</tbody></table></div>
  <nav class="pager" aria-label="${tx('Weiter','Next')}"><a class="next" href="#${CA_CATS[0].id}"><small>${tx('Erstes Kapitel →','First chapter →')}</small>${CA_CATS[0].title}</a></nav>
</article>`;
}
function caStartInit(root){
  const q=$('#ca-q',root),rows=$$('tbody tr',root),count=$('#ca-count',root);let t;
  const upd=typed=>{const s=norm(q.value.trim());let n=0;rows.forEach(r=>{const ok=!s||r.dataset.q.includes(s);r.hidden=!ok;if(ok)n++});
    clearTimeout(t);t=setTimeout(()=>{count.textContent=s?tx(`${n} von ${CSSA.length} Einträgen`,`${n} of ${CSSA.length} entries`):tx(`${CSSA.length} Einträge`,`${CSSA.length} entries`)},typed?400:0)};
  q.addEventListener('input',()=>upd(true));upd(false);
  return ()=>clearTimeout(t);
}

/* ---------- Seitenleiste ---------- */
const listEl=$('#list'),search=$('#q'),qStatus=$('#q-status');
let current=null,statusTimer=null;
function renderList(){
  const q=norm(search.value.trim());
  const hit=e=>!q||norm(`${e.name} ${e.sub} ${CAT_BY[e.cat].title}`).includes(q);
  let html=q?'':`<ul class="items"><li><a class="item item-page" href="#start" data-id="start"><span class="item-title">${tx('Überblick','Overview')}</span><span class="item-short">${tx('Alle Kapitel und eine Tabelle aller Einträge.','All chapters and a table of all entries.')}</span></a></li></ul>`,count=0;
  CA_CATS.forEach(c=>{
    const es=CSSA.filter(e=>e.cat===c.id&&hit(e));if(!es.length)return;count+=es.length;
    html+=`<a class="grp" id="grp-${c.id}" href="#${c.id}" data-id="${c.id}">${c.title}</a><ul class="items" aria-labelledby="grp-${c.id}">${es.map(e=>`<li><a class="item" href="#${c.id}/${e.id}" data-id="${c.id}/${e.id}"><code>${esc(e.name)}</code></a></li>`).join('')}</ul>`;
  });
  if(q&&!count)html=`<div class="list-empty">${ic('search')}<p class="le-title">${tx(`Nichts zu „${esc(search.value.trim())}“`,`Nothing for “${esc(search.value.trim())}”`)}</p><p class="hint">${tx('Probier eine Eigenschaft wie „gap“, „z-index“ oder ein Stichwort wie „Schatten“.','Try a property like “gap”, “z-index” or a keyword like “shadow”.')}</p><button type="button" class="btn btn-secondary" id="q-reset">${tx('Suche zurücksetzen','Clear search')}</button></div>`;
  listEl.innerHTML=html;
  markActive(current,false);
  clearTimeout(statusTimer);
  statusTimer=setTimeout(()=>{qStatus.textContent=q?tx(count===1?'1 Treffer':`${count} Treffer`,count===1?'1 result':`${count} results`):tx(`${CSSA.length} Einträge in ${CA_CATS.length} Kapiteln`,`${CSSA.length} entries in ${CA_CATS.length} chapters`)},q?450:0);
}
function markActive(id,reveal){
  $$('[data-id]',listEl).forEach(a=>{
    if(a.dataset.id===id){a.setAttribute('aria-current','page');if(reveal)a.scrollIntoView({block:'nearest'})}
    else a.removeAttribute('aria-current');
  });
}
search.addEventListener('input',renderList);
listEl.addEventListener('click',e=>{if(e.target.closest('#q-reset')){search.value='';renderList();search.focus()}});

/* ---------- Detailansicht ---------- */
const view=$('#view'),master=$('#master'),detail=$('#hauptinhalt'),shell=$('#shell');
let cleanup=null;
function notFoundHTML(id){
  return `<article class="lesson" aria-labelledby="lesson-title"><div class="empty">${ic('search')}
  <h1 id="lesson-title" tabindex="-1">${tx('Diese Seite gibt es nicht','This page doesn’t exist')}</h1>
  <p style="margin:0;max-width:60ch">${tx(`Unter <code>#${esc(id)}</code> steht kein Eintrag. Vielleicht hat der Link einen Tippfehler.`,`There is no entry at <code>#${esc(id)}</code>. Maybe the link has a typo.`)}</p>
  <div class="btn-row"><a class="btn btn-primary" href="#start">${tx('Zum Überblick','Go to overview')}</a><button type="button" class="btn btn-secondary" id="nf-search">${tx('Eintrag suchen','Search entries')}</button></div>
  </div></article>`;
}
function updateTitle(base,sub){
  const c=CAT_BY[base],e=CA_BY[sub];
  document.title=c?(e?`${e.name} · ${c.title} · CSS-Atlas`:`${c.title} · CSS-Atlas`):base==='start'?tx('CSS-Atlas – CSS zum Anfassen','CSS Atlas – CSS you can touch'):tx('Nicht gefunden · CSS-Atlas','Not found · CSS Atlas');
}
let masterScroll=0,lastId=null;
function route(fromUser){
  if(cleanup){try{cleanup()}catch(e){}cleanup=null}
  if(shell.dataset.view==='master')masterScroll=master.scrollTop;
  const id=decodeURIComponent(location.hash.slice(1));
  const overview=id===''||id==='uebersicht';
  let [base,sub='']=id.split(/\/(.*)/);
  // Kurzform #gap springt zum Eintrag im richtigen Kapitel
  if(!CAT_BY[base]&&CA_BY[base]){location.replace(`#${CA_BY[base].cat}/${base}`);return}
  shell.dataset.view=overview?'master':'detail';
  let focusEl=null;
  if(overview||base==='start'){base='start';sub='';view.innerHTML=caStartHTML();cleanup=caStartInit(view)}
  else if(CAT_BY[base]){
    if(CA_BY[sub]?.cat!==base)sub='';
    view.innerHTML=caCatHTML(base);caCatInit(view,sub);
    focusEl=sub&&$('#ca-'+sub+'-h',view);
  }
  else{base=null;sub='';view.innerHTML=notFoundHTML(id)}
  withLang(view);
  current=base&&sub?`${base}/${sub}`:base;
  markActive(current,true);updateTitle(base,sub);
  if(!fromUser)return;
  if(overview&&isNarrow()){
    master.scrollTop=masterScroll;
    const a=lastId&&$(`[data-id="${lastId}"]`,listEl);
    (a||search).focus({preventScroll:!!a});
  }else{
    if(!sub)detail.scrollTop=0;
    if(focusEl)focusEl.focus({preventScroll:true});else $('#lesson-title').focus({preventScroll:true});
  }
  if(!overview&&current)lastId=current;
}
window.addEventListener('hashchange',()=>{route(true);updateLangLink()});

/* ---------- Globale Ereignisse ---------- */
document.addEventListener('click',e=>{if(e.target.closest('#nf-search'))focusSearch()});
$('#skip').addEventListener('click',e=>{e.preventDefault();if(isNarrow()&&shell.dataset.view==='master'){search.focus();return}($('#lesson-title')||detail).focus()});
function focusSearch(){
  if(isNarrow()&&shell.dataset.view!=='master'){location.hash='uebersicht';setTimeout(()=>search.focus(),0)}
  else search.focus();
}
// Strg+K statt eines einzelnen Buchstabens: Tastenkürzel mit Modifier kollidieren nicht mit Sprachsteuerung (WCAG 2.1.4)
document.addEventListener('keydown',e=>{
  if((e.ctrlKey||e.metaKey)&&!e.altKey&&e.key.toLowerCase()==='k'){e.preventDefault();focusSearch()}
});

/* ---------- Sprachumschalter ----------
   Ein Link, kein Button: er führt zu einer anderen Adresse (?lang=…) und behält den Hash. Beschriftet in der
   Zielsprache selbst, mit lang-Attribut, damit Screenreader „English“ englisch aussprechen (WCAG 3.1.2). */
function updateLangLink(){const a=$('#lang-link'),o=tx('en','de');a.href=langHref(o);a.hreflang=o;a.lang=o;a.textContent=tx('English','Deutsch')}

/* ---------- Start ---------- */
withLang(document);
updateLangLink();
renderList();
route(false);
})();
</script>
</body>
</html>
