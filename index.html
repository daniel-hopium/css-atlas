 stage:`<div class="ca-mask-frame"><div class="ca-scroll ca-mask-s" tabindex="0" role="region" aria-label="${tx('Scrollbereich zu mask-image','Scroll area for mask-image')}"><p>${tx('Die Maske wirkt auf den Kasten, nicht auf den Inhalt: Beim Scrollen bleibt der Verlauf am Rand stehen, der Text läuft darunter durch.','The mask applies to the box, not to the content: while you scroll, the gradient stays at the edge and the text runs underneath it.')}</p><p>${tx('Schwarz in der Maske heißt sichtbar, transparent heißt unsichtbar. Die Farbe selbst spielt keine Rolle, nur die Deckkraft.','Black in the mask means visible, transparent means invisible. The color itself doesn’t matter, only the opacity.')}</p><p>${tx('Ein Verlauf nach unten blendet die letzten Zeilen aus und zeigt: Hier geht es weiter.','A gradient towards the bottom fades out the last lines and signals: there’s more here.')}</p><p>${tx('Mit Verläufen an beiden Rändern verschwindet der Text oben und unten weich.','With gradients at both edges, the text fades softly at the top and the bottom.')}</p><p>${tx('Letzter Absatz – dank Innenabstand kann er aus dem Verlauf herausscrollen.','Last paragraph – thanks to the padding, it can scroll out of the fade.')}</p></div></div>`,
 base:[['.ca-mask-s','.scroller',{'padding-block':'24px'}]],t:['.ca-mask-s','.scroller'],
 vals:[['none','none','mask-none'],
  [tx('unten','bottom'),'linear-gradient(to bottom, #000 80%, transparent)','mask-b-from-80%',tx('Die unteren 20 % laufen von deckend nach transparent aus.','The bottom 20% fades from opaque to transparent.')],
  [tx('oben und unten','top and bottom'),'linear-gradient(to bottom, transparent, #000 24px, #000 calc(100% - 24px), transparent)','mask-[linear-gradient(to_bottom,transparent,#000_24px,#000_calc(100%-24px),transparent)]',tx('Je 24 px Verlauf an beiden Rändern, dazwischen voll sichtbar.','A 24 px fade at each edge, fully visible in between.')]],def:1,
 tip:tx('Die Maske weiß nicht, wo du gerade scrollst – auch am Ende bleibt der Rand ausgeblendet. Darum der Innenabstand (<code>padding-block</code>) mindestens so hoch wie der Verlauf: Dann kann die letzte Zeile ganz herausscrollen. Und: Die Maske schneidet alles außerhalb der Border-Box ab, also auch den Fokusring. Hier sitzt er darum am umgebenden Rahmen – tab in den Kasten.','The mask doesn’t know where you’ve scrolled to – even at the end, the edge stays faded. That’s why the padding (<code>padding-block</code>) should be at least as tall as the fade: then the last line can scroll out of it completely. Also: the mask clips everything outside the border box, including the focus ring. That’s why here it sits on the surrounding frame – tab into the box.')},
/* Bewegung */
{id:'transform',cat:'motion',name:'transform',sub:tx('Verschieben, drehen, skalieren','Move, rotate, scale'),mdn:'transform',
 desc:tx('<code>transform</code> verschiebt, dreht, skaliert oder verzerrt ein Element – rein optisch. Hier Nummer 2.','<code>transform</code> moves, rotates, scales or skews an element – purely visually. Here item 2.'),
 stage:cC(cN(3)),base:FLEX,t:['.ca-n2','.item-2'],
 vals:[['none','none','transform-none'],['translateX(24px)','translateX(24px)','translate-x-6'],['rotate(12deg)','rotate(12deg)','rotate-12'],['scale(1.25)','scale(1.25)','scale-125'],['skewX(12deg)','skewX(12deg)','skew-x-12']],
 tip:tx('Die Nachbarn bleiben, wo sie sind: <code>transform</code> ändert das Layout nicht. Darum laufen Animationen mit <code>transform</code> flüssig, während <code>width</code>, <code>top</code> oder <code>margin</code> ruckeln – die zwingen den Browser, das Layout neu zu berechnen.','The neighbors stay where they are: <code>transform</code> doesn’t change the layout. That’s why animations with <code>transform</code> run smoothly, while <code>width</code>, <code>top</code> or <code>margin</code> stutter – they force the browser to recalculate the layout.')},
{id:'transform-origin',cat:'motion',name:'transform-origin',sub:tx('Um welchen Punkt gedreht wird','The point it rotates around'),mdn:'transform-origin',
 desc:tx('<code>transform-origin</code> legt den Punkt fest, um den gedreht und skaliert wird. Standard ist die Mitte. Der gestrichelte Rahmen zeigt die Ausgangslage.','<code>transform-origin</code> sets the point that rotation and scaling happen around. The default is the center. The dashed frame shows the starting position.'),
 stage:`<div class="ca-orig"><div class="ca-ghost"></div><div class="ca-i ca-t3 ca-sq ca-rot">${tx('Drehpunkt','Pivot')}</div></div>`,
 base:[['.ca-rot','.box',{transform:'rotate(25deg)'}]],t:['.ca-rot','.box'],
 vals:[['center','center','origin-center'],['top left','top left','origin-top-left'],['bottom right','bottom right','origin-bottom-right']],
 tip:tx('Ein Dropdown, das aus seinem Button herauswachsen soll, braucht <code>transform-origin: top</code> – sonst wächst es aus der Mitte.','A dropdown that should grow out of its button needs <code>transform-origin: top</code> – otherwise it grows out of the center.')},
{id:'transition',cat:'motion',name:'transition',sub:tx('Den Wechsel animieren','Animating the change'),mdn:'transition',
 desc:tx('<code>transition</code> animiert den Wechsel zwischen zwei Zuständen: welche Eigenschaft, wie lange, mit welcher Kurve. Wähl einen Wert und drück „Bewegen“.','<code>transition</code> animates the change between two states: which property, how long, with which curve. Pick a value and press “Move”.'),
 stage:`<div class="ca-track"><div class="ca-i ca-t2 ca-ball" aria-hidden="true"></div></div><button type="button" class="btn btn-secondary ca-go">${tx('Bewegen','Move')}</button>`,t:['.ca-ball','.ball'],
 vals:[['none','none','transition-none'],['150ms ease-out','transform 150ms ease-out','transition-transform duration-150 ease-out'],['400ms ease-in-out','transform 400ms ease-in-out','transition-transform duration-400 ease-in-out'],['1s linear','transform 1s linear','transition-transform duration-1000 ease-linear']],def:1,
 init(st){let on=false;const b=$('.ca-ball',st),tr=$('.ca-track',st);$('.ca-go',st).addEventListener('click',()=>{on=!on;b.style.transform=on?`translateX(${tr.clientWidth-b.offsetWidth-16}px)`:''})},
 tip:tx('Kleine Elemente 100–200 ms, <code>ease-out</code> beim Hereinkommen; <code>linear</code> wirkt mechanisch. Ist in deinem System „Bewegung reduzieren“ an, springt die Kugel sofort – so soll es sein.','Small elements 100–200 ms, <code>ease-out</code> when entering; <code>linear</code> feels mechanical. If “Reduce motion” is on in your system, the ball jumps instantly – that’s how it should be.')},
{id:'animation',cat:'motion',name:'animation',sub:tx('@keyframes abspielen: Dauer, Kurve, Wiederholung, Richtung','Playing @keyframes: duration, curve, repetition, direction'),mode:'css',mdn:'animation',
 desc:tx('<code>@keyframes</code> beschreibt die Stationen einer Animation, <code>animation</code> spielt sie ab: Name, Dauer, Kurve, Verzögerung, Wiederholungen, Richtung. Fehlt <code>from</code>, startet sie beim normalen Stil. Die Vorschau startet nur auf Knopfdruck und lässt sich jederzeit stoppen – aus Rücksicht auf alle, die „Bewegung reduzieren“ eingeschaltet haben.','<code>@keyframes</code> describes the stations of an animation, <code>animation</code> plays it: name, duration, curve, delay, repetitions, direction. If <code>from</code> is missing, it starts at the normal style. The preview only starts when you press the button and can be stopped at any time – out of consideration for everyone who has “Reduce motion” turned on.'),
 stage:`<div class="ca-track ca-kf-track"><div class="ca-i ca-t2 ca-ball ca-kf-mv ball" aria-hidden="true"></div></div><div class="btn-row"><button type="button" class="btn btn-secondary ca-kf-play">${tx('Abspielen','Play')}</button><button type="button" class="btn btn-secondary ca-kf-stop">${tx('Stopp','Stop')}</button></div>`,
 vals:[['1s ease-in-out','@keyframes glide {\n  to { transform: translateX(200px); }\n}\n& .ball {\n  animation: glide 1s ease-in-out;\n}','animate-[glide_1s_ease-in-out]',tx('Einmal hin – danach springt die Kugel zurück, weil nach dem Ende wieder der normale Stil gilt.','Once across – then the ball jumps back, because the normal style applies again after the end.')],
  ['infinite alternate','@keyframes glide {\n  to { transform: translateX(200px); }\n}\n& .ball {\n  animation: glide 1s ease-in-out infinite alternate;\n}','animate-[glide_1s_ease-in-out_infinite_alternate]',tx('Endlos hin und her: alternate spielt jede zweite Runde rückwärts.','Back and forth forever: alternate plays every second round backwards.')],
  ['600ms linear 3','@keyframes glide {\n  to { transform: translateX(200px); }\n}\n& .ball {\n  animation: glide 600ms linear 3;\n}','animate-[glide_600ms_linear_3]',tx('Dreimal, jedes Mal von vorn: Ohne alternate springt die Kugel zwischen den Runden zurück an den Start.','Three times, each from the start: without alternate the ball jumps back to the start between rounds.')],
  ['steps(5) reverse','@keyframes glide {\n  to { transform: translateX(200px); }\n}\n& .ball {\n  animation: glide 1.5s steps(5) reverse;\n}','animate-[glide_1.5s_steps(5)_reverse]',tx('steps(5) bewegt in fünf Sprüngen statt fließend, reverse spielt von to nach from.','steps(5) moves in five jumps instead of smoothly, reverse plays from to back to from.')]],
 measure:st=>reducedMotion()?tx('Dein System meldet „Bewegung reduzieren“. Die Vorschau läuft trotzdem, wenn du „Abspielen“ drückst – das ist eine ausdrückliche Bitte. In deinem eigenen Code gehört Deko-Bewegung in den @media-Block (siehe prefers-reduced-motion).','Your system reports “Reduce motion”. The preview still runs when you press “Play” – that’s an explicit request. In your own code, decorative motion belongs in the @media block (see prefers-reduced-motion).'):'',
 init(st){
  const art=st.closest('.ca-entry'),state=$('.ca-kf-state',st),say=t=>{if(state)state.textContent=t};
  const run=()=>{st.classList.remove('ca-kf-on');void st.offsetWidth;st.classList.add('ca-kf-on');say(tx('Wartet …','Waiting …'))};
  $('.ca-kf-play',st).addEventListener('click',run);
  $('.ca-kf-stop',st).addEventListener('click',()=>{st.classList.remove('ca-kf-on');say('')});
  st.addEventListener('animationstart',()=>say(tx('Läuft …','Running …')));
  st.addEventListener('animationend',()=>say(tx('Fertig – jetzt entscheidet animation-fill-mode.','Done – now animation-fill-mode decides.')));
  art.addEventListener('change',ev=>{if(ev.target.name==='ca-'+art.dataset.id&&st.classList.contains('ca-kf-on'))run()});
 },
 tip:tx('In der Kurzform ist die erste Zeitangabe immer die Dauer, die zweite die Verzögerung. Und die Kurzform setzt alles zurück, was du nicht nennst: Ein späteres <code>animation: glide 1s</code> löscht ein vorher gesetztes <code>animation-delay</code>. Eigene Keyframes kommen in Tailwind v4 in den <code>@theme</code>-Block, zusammen mit <code>--animate-glide: glide 1s ease-in-out</code> – daraus wird die Klasse <code>animate-glide</code>.','In the shorthand, the first time value is always the duration, the second the delay. And the shorthand resets everything you don’t mention: a later <code>animation: glide 1s</code> wipes out an <code>animation-delay</code> set earlier. In Tailwind v4, your own keyframes go into the <code>@theme</code> block, together with <code>--animate-glide: glide 1s ease-in-out</code> – which gives you the class <code>animate-glide</code>.')},
{id:'animation-fill-mode',cat:'motion',name:'animation-fill-mode',sub:tx('Was vor dem Start und nach dem Ende gilt','What applies before the start and after the end'),mode:'css',mdn:'animation-fill-mode',
 desc:tx('Während der Verzögerung und nach dem Ende gilt normalerweise der normale Stil. <code>animation-fill-mode</code> lässt die Animation in diese Zeiten hineinreichen. Hier wartet die Kugel 1 s und läuft dann von <em>from</em> (100 px) nach <em>to</em> (200 px) – drück „Abspielen“ und achte auf Start und Ende.','During the delay and after the end, the normal style usually applies. <code>animation-fill-mode</code> lets the animation reach into those periods. Here the ball waits 1 s and then runs from <em>from</em> (100 px) to <em>to</em> (200 px) – press “Play” and watch the start and the end.'),
 stage:`<div class="ca-track ca-kf-track"><span class="ca-kf-mark ca-kf-from" aria-hidden="true">from</span><span class="ca-kf-mark ca-kf-to" aria-hidden="true">to</span><div class="ca-i ca-t3 ca-ball ca-kf-mv ball" aria-hidden="true"></div></div><div class="btn-row"><button type="button" class="btn btn-secondary ca-kf-play">${tx('Abspielen','Play')}</button><button type="button" class="btn btn-secondary ca-kf-stop">${tx('Stopp','Stop')}</button></div><p class="ca-small ca-kf-state"></p>`,
 vals:[['none','@keyframes nudge {\n  from { transform: translateX(100px); }\n  to { transform: translateX(200px); }\n}\n& .ball {\n  animation: nudge 1s ease-in-out 1s;\n  animation-fill-mode: none;\n}','animate-[nudge_1s_ease-in-out_1s]',tx('Während der Verzögerung steht die Kugel am Start, springt dann auf from – und nach dem Ende zurück an den Start.','During the delay the ball sits at the start, then jumps to from – and back to the start after the end.')],
  ['forwards','@keyframes nudge {\n  from { transform: translateX(100px); }\n  to { transform: translateX(200px); }\n}\n& .ball {\n  animation: nudge 1s ease-in-out 1s;\n  animation-fill-mode: forwards;\n}','animate-[nudge_1s_ease-in-out_1s_forwards]',tx('Nach dem Ende bleibt der Stil von to stehen. Am Anfang springt sie trotzdem.','After the end, the style of to stays. It still jumps at the beginning.')],
  ['backwards','@keyframes nudge {\n  from { transform: translateX(100px); }\n  to { transform: translateX(200px); }\n}\n& .ball {\n  animation: nudge 1s ease-in-out 1s;\n  animation-fill-mode: backwards;\n}','animate-[nudge_1s_ease-in-out_1s_backwards]',tx('Schon während der Verzögerung gilt from – kein Sprung beim Start. Nach dem Ende geht es zurück.','from already applies during the delay – no jump at the start. After the end it goes back.')],
  ['both','@keyframes nudge {\n  from { transform: translateX(100px); }\n  to { transform: translateX(200px); }\n}\n& .ball {\n  animation: nudge 1s ease-in-out 1s;\n  animation-fill-mode: both;\n}','animate-[nudge_1s_ease-in-out_1s_both]',tx('Beides: from während der Verzögerung, to nach dem Ende. Typisch für verzögerte Einblend-Animationen.','Both: from during the delay, to after the end. Typical for delayed entrance animations.')]],
 measure:st=>CA_BY.animation.measure(st),
 init(st){CA_BY.animation.init(st)},
 tip:tx('Was <code>forwards</code> festhält, hat Animations-Vorrang: Es schlägt jede normale Regel – ein späteres <code>:hover</code> oder eine per JavaScript gesetzte Klasse ändert an der Eigenschaft nichts mehr. Besser: den Endzustand als normalen Stil setzen und <code>backwards</code> nehmen.','Whatever <code>forwards</code> holds on to has animation priority: it beats every normal rule – a later <code>:hover</code> or a class set by JavaScript no longer changes that property. Better: set the end state as the normal style and use <code>backwards</code>.')},
{id:'starting-style',cat:'motion',name:'@starting-style',sub:tx('Einblenden aus display: none','Fading in from display: none'),mode:'css',mdn:'@starting-style',
 desc:tx('Aus <code>display: none</code> heraus gibt es keinen Startwert – eine <code>transition</code> hat nichts, wovon sie überblenden kann, das Element ploppt einfach auf. <code>@starting-style</code> liefert diesen Startwert für den ersten Auftritt. Fürs Ausblenden muss <code>display</code> selbst mitspielen: <code>transition-behavior: allow-discrete</code> hält es bis zum Ende der Transition auf <code>block</code>.','Coming out of <code>display: none</code> there is no starting value – a <code>transition</code> has nothing to fade from, so the element just pops up. <code>@starting-style</code> supplies that starting value for its first appearance. For fading out, <code>display</code> itself has to play along: <code>transition-behavior: allow-discrete</code> keeps it at <code>block</code> until the transition ends.'),
 stage:`<button type="button" class="btn btn-secondary ca-ss-btn" aria-expanded="false" aria-controls="ca-ss-panel">${tx('Hinweis zeigen','Show notice')}</button><div class="panel ca-ss-panel" id="ca-ss-panel"><b>${tx('Gespeichert.','Saved.')}</b> ${tx('Blendet sanft ein – wenn @starting-style den Startwert liefert.','Fades in smoothly – if @starting-style supplies the starting value.')}</div>`,
 vals:[[tx('nur transition','transition only'),'& .panel {\n  display: none;\n  opacity: 0;\n  transition: opacity .4s, transform .4s;\n}\n& .panel.is-open {\n  display: block;\n  opacity: 1;\n}','',tx('Ploppt auf und verschwindet schlagartig: Die Transition hat keinen Startwert, und display springt sofort.','Pops up and vanishes abruptly: the transition has no starting value, and display switches instantly.')],
  ['+ @starting-style','& .panel {\n  display: none;\n  opacity: 0;\n  transition: opacity .4s, transform .4s;\n}\n& .panel.is-open {\n  display: block;\n  opacity: 1;\n}\n@starting-style {\n  & .panel.is-open {\n    opacity: 0;\n    transform: translateY(8px);\n  }\n}','starting:opacity-0 starting:translate-y-2',tx('Blendet sanft ein. Beim Schließen verschwindet es aber noch schlagartig – display springt sofort auf none.','Fades in smoothly. When closing, though, it still vanishes abruptly – display switches to none instantly.')],
  ['+ allow-discrete','& .panel {\n  display: none;\n  opacity: 0;\n  transform: translateY(8px);\n  transition: opacity .4s, transform .4s, display .4s;\n  transition-behavior: allow-discrete;\n}\n& .panel.is-open {\n  display: block;\n  opacity: 1;\n  transform: none;\n}\n@starting-style {\n  & .panel.is-open {\n    opacity: 0;\n    transform: translateY(8px);\n  }\n}','transition-discrete starting:opacity-0 starting:translate-y-2',tx('Ein- und Ausblenden: display wechselt erst am Ende der Transition auf none.','Fading in and out: display only switches to none at the end of the transition.')]],def:1,
 measure:st=>reducedMotion()?tx('Dein System meldet „Bewegung reduzieren“: Die Vorschau blendet darum nur über, ohne zu verschieben.','Your system reports “Reduce motion”: so the preview only fades, without moving.'):'',
 init(st){const b=$('.ca-ss-btn',st),p=$('.ca-ss-panel',st);b.addEventListener('click',()=>{const o=p.classList.toggle('is-open');b.setAttribute('aria-expanded',String(o));b.textContent=o?tx('Hinweis ausblenden','Hide notice'):tx('Hinweis zeigen','Show notice')})},
 tip:tx('Neu: seit 2024 in Chrome, Safari und Firefox (Baseline 2024). Ältere Browser zeigen das Element einfach ohne Animation – ein sauberer Fallback. Bei Popover und <code>&lt;dialog&gt;</code> gehört zusätzlich <code>overlay</code> in die Transition-Liste, sonst verlässt das Element beim Schließen sofort die oberste Ebene; <code>overlay</code> kennen noch nicht alle Browser.','New: in Chrome, Safari and Firefox since 2024 (Baseline 2024). Older browsers simply show the element without animation – a clean fallback. For popovers and <code>&lt;dialog&gt;</code>, <code>overlay</code> also belongs in the transition list, otherwise the element leaves the top layer immediately on close; not every browser supports <code>overlay</code> yet.')},
{id:'prefers-reduced-motion',cat:'motion',name:'prefers-reduced-motion',sub:tx('Die Systemeinstellung „Bewegung reduzieren“','The “Reduce motion” system setting'),mode:'css',mdn:'@media/prefers-reduced-motion',
 desc:tx('Die Media Query fragt ab, ob im Betriebssystem „Bewegung reduzieren“ eingeschaltet ist (Windows: „Animationseffekte“ aus). Menschen mit vestibulären Störungen wird von großer Bewegung schwindlig oder übel. Oben in der Vorschau steht, was dein System gerade meldet.','The media query checks whether “Reduce motion” is turned on in the operating system (Windows: “Animation effects” off). Large motion makes people with vestibular disorders dizzy or nauseous. The top of the preview shows what your system is reporting right now.'),
 stage:`<p class="ca-mono ca-rm-sys"></p><div class="ca-track ca-kf-track"><div class="ca-i ca-t4 ca-ball ca-kf-mv ball" aria-hidden="true"></div></div><div class="btn-row"><button type="button" class="btn btn-secondary ca-kf-play">${tx('Abspielen','Play')}</button><button type="button" class="btn btn-secondary ca-kf-stop">${tx('Stopp','Stop')}</button></div>`,
 vals:[[tx('ohne Abfrage','no query'),'@keyframes glide {\n  to { transform: translateX(200px); }\n}\n& .ball {\n  animation: glide 1s ease-in-out infinite alternate;\n}','animate-[glide_1s_ease-in-out_infinite_alternate]',tx('Läuft für alle – auch für Menschen, denen Bewegung Schwindel oder Übelkeit macht.','Runs for everyone – including people who get dizzy or nauseous from motion.')],
  ['reduce → none','@keyframes glide {\n  to { transform: translateX(200px); }\n}\n& .ball {\n  animation: glide 1s ease-in-out infinite alternate;\n}\n@media (prefers-reduced-motion: reduce) {\n  & .ball { animation: none; }\n}','motion-reduce:animate-none',tx('Meldet das System reduce, bleibt die Kugel stehen.','If the system reports reduce, the ball stays put.')],
  ['no-preference','@keyframes glide {\n  to { transform: translateX(200px); }\n}\n@media (prefers-reduced-motion: no-preference) {\n  & .ball {\n    animation: glide 1s ease-in-out infinite alternate;\n  }\n}','motion-safe:animate-[glide_1s_ease-in-out_infinite_alternate]',tx('Andersherum gedacht: Bewegung nur, wenn das System nichts dagegen hat. Browser, die die Abfrage nicht kennen, bekommen gar keine Animation – der sichere Standard.','The other way round: motion only if the system has no objection. Browsers that don’t know the query get no animation at all – the safe default.')],
  ['reduce → pulse','@keyframes glide {\n  to { transform: translateX(200px); }\n}\n@keyframes pulse {\n  50% { opacity: .5; }\n}\n& .ball {\n  animation: glide 1s ease-in-out infinite alternate;\n}\n@media (prefers-reduced-motion: reduce) {\n  & .ball {\n    animation: pulse 2s cubic-bezier(0.4, 0, 0.6, 1) infinite;\n  }\n}','motion-reduce:animate-pulse',tx('Reduzieren heißt nicht streichen: Statt die Kugel zu bewegen, pulsiert sie nur in der Deckkraft. Überblenden ohne Ortswechsel ist meist unbedenklich.','Reduce doesn’t mean remove: instead of moving, the ball only pulses in opacity. Fading without changing position is usually fine.')]],
 measure:st=>reducedMotion()?tx('Dein System meldet reduce – „Bewegung reduzieren“ ist an. Die Varianten mit Abfrage verhalten sich darum anders als „ohne Abfrage“.','Your system reports reduce – “Reduce motion” is on. So the variants with a query behave differently from “no query”.'):tx('Dein System meldet no-preference – darum sieht „reduce → none“ hier aus wie „ohne Abfrage“. Zum Testen: Windows → Barrierefreiheit → Visuelle Effekte → Animationseffekte aus; macOS/iOS → Bedienungshilfen → Bewegung reduzieren; oder in den Chrome-DevTools unter „Rendering“ emulieren.','Your system reports no-preference – that’s why “reduce → none” looks like “no query” here. To test: Windows → Accessibility → Visual effects → Animation effects off; macOS/iOS → Accessibility → Reduce motion; or emulate it in Chrome DevTools under “Rendering”.'),
 init(st){
  CA_BY.animation.init(st);
  const art=st.closest('.ca-entry'),out=$('.ca-rm-sys',st),mq=matchMedia('(prefers-reduced-motion: reduce)');
  const upd=first=>{if(!st.isConnected){mq.removeEventListener('change',upd);return}out.textContent='prefers-reduced-motion: '+(mq.matches?'reduce':'no-preference');if(first!==true)caApply(CA_BY['prefers-reduced-motion'],art,+$('input[name="ca-prefers-reduced-motion"]:checked',art).value)};
  upd(true);mq.addEventListener('change',upd);
 },
 tip:tx('Auf Stufe A/AA ist die Abfrage keine WCAG-Pflicht: „Animation from Interactions“ (2.3.3) ist AAA. Pflicht ist <a class="xlink" href="https://daniel-hopium.github.io/pattern-library/#wcag-kriterien/2.2.2">WCAG 2.2.2</a>: Was sich von selbst länger als 5 Sekunden bewegt, braucht Pause oder Stopp – egal, was das System meldet. Darum startet in diesem Kapitel keine Vorschau von selbst.','At levels A/AA the query isn’t a WCAG requirement: “Animation from Interactions” (2.3.3) is AAA. What is required is <a class="xlink" href="https://daniel-hopium.github.io/pattern-library/#wcag-kriterien/2.2.2">WCAG 2.2.2</a>: anything that moves on its own for more than 5 seconds needs pause or stop – no matter what the system reports. That’s why no preview in this chapter starts by itself.')},
/* Interaktion */
{id:'cursor',cat:'interact',name:'cursor',sub:tx('Der Mauszeiger','The mouse pointer'),mdn:'cursor',
 desc:tx('<code>cursor</code> legt fest, welchen Mauszeiger man über dem Element sieht. Fahr mit der Maus über den Kasten.','<code>cursor</code> sets which mouse pointer you see over the element. Move your mouse over the box.'),
 stage:`<div class="ca-cur">${tx('Fahr mit der Maus hier drüber','Move your mouse over here')}</div>`,t:['.ca-cur','.element'],
 vals:[['default','default','cursor-default'],['pointer','pointer','cursor-pointer'],['text','text','cursor-text'],['move','move','cursor-move'],['grab','grab','cursor-grab'],['not-allowed','not-allowed','cursor-not-allowed'],['help','help','cursor-help']],
 tip:tx('Die Hand (<code>pointer</code>) zeigen Browser nur bei Links; ob Buttons sie bekommen, ist Geschmackssache – siehe <a class="xlink" href="https://daniel-hopium.github.io/pattern-library/#details/clickable-card">Gut &amp; Schlecht</a>. <code>not-allowed</code> ersetzt keine Erklärung, warum etwas nicht geht.','Browsers show the hand (<code>pointer</code>) only on links; whether buttons get it is a matter of taste – see <a class="xlink" href="https://daniel-hopium.github.io/pattern-library/#details/clickable-card">Good &amp; Bad</a>. <code>not-allowed</code> doesn’t replace an explanation of why something isn’t possible.')},
{id:'pointer-events',cat:'interact',name:'pointer-events',sub:tx('Klicks durchlassen','Letting clicks through'),mdn:'pointer-events',
 desc:tx('<code>pointer-events: none</code> macht ein Element für Maus und Touch durchlässig – Klicks gehen an das, was darunter liegt. Das gestreifte Overlay liegt über dem Button.','<code>pointer-events: none</code> makes an element transparent to mouse and touch – clicks go to whatever lies beneath it. The striped overlay sits on top of the button.'),
 stage:`<div class="ca-pe"><button type="button" class="btn btn-primary ca-pe-btn">${tx('Klick mich','Click me')}</button><div class="ca-pe-over">Overlay</div></div>`,t:['.ca-pe-over','.overlay'],
 vals:[['auto','auto','pointer-events-auto'],['none','none','pointer-events-none']],
 init(st){$('.ca-pe-btn',st).addEventListener('click',()=>toast({msg:tx('Der Button wurde geklickt.','The button was clicked.'),type:'success',duration:2500}));$('.ca-pe-over',st).addEventListener('click',()=>toast({msg:tx('Das Overlay hat den Klick abgefangen.','The overlay intercepted the click.'),duration:2500}))},
 tip:tx('Praktisch für dekorative Overlays, Verläufe und Icons in Eingabefeldern. Tastatur-Fokus und Screenreader betrifft es aber nicht – als „deaktiviert“ taugt es nicht.','Handy for decorative overlays, gradients and icons in input fields. It doesn’t affect keyboard focus or screen readers, though – it’s no good as “disabled”.')},
{id:'user-select',cat:'interact',name:'user-select',sub:tx('Markieren erlauben oder erleichtern','Allowing or easing text selection'),mdn:'user-select',
 desc:tx('<code>user-select</code> steuert, ob und wie sich Text markieren lässt. Versuch, die beiden Zeilen zu markieren – oder klick einmal hinein.','<code>user-select</code> controls whether and how text can be selected. Try selecting the two lines – or click into them once.'),
 stage:`<p class="ca-text ca-us">${tx('Ein Satz zum Markieren mit der Maus.','A sentence to select with the mouse.')}</p><p class="ca-mono ca-us">npm install daumenregel</p>`,t:['.ca-us','.text'],
 vals:[['auto','auto','select-auto'],['none','none','select-none'],['all','all','select-all'],['text','text','select-text']],
 tip:tx('<code>all</code> ist praktisch für Befehle und Codes zum Kopieren: Ein Klick markiert alles. <code>none</code> nur für Bedienelemente – nie für Inhalt, den jemand kopieren will.','<code>all</code> is handy for commands and codes to copy: one click selects everything. Use <code>none</code> only for controls – never for content someone might want to copy.')},
{id:'scroll-snap',cat:'interact',name:'scroll-snap-type',sub:tx('Einrasten beim Scrollen','Snapping while scrolling'),mdn:'CSS_scroll_snap',
 desc:tx('<code>scroll-snap-type</code> lässt einen Scroll-Container an bestimmten Punkten einrasten – wie ein Karussell, nur ohne JavaScript. Scroll im Kasten seitwärts.','<code>scroll-snap-type</code> makes a scroll container snap to certain points – like a carousel, just without JavaScript. Scroll sideways in the box.'),
 stage:`<div class="ca-snap" tabindex="0" role="region" aria-label="${tx('Seitwärts scrollende Karten','Cards scrolling sideways')}">${[1,2,3,4,5,6].map(n=>`<div class="ca-i ca-t${(n-1)%4+1} ca-snapi">${tx('Karte','Card')} ${n}</div>`).join('')}</div>`,
 base:[['.ca-snapi','.card',{'scroll-snap-align':'start'}]],t:['.ca-snap','.container'],
 vals:[['none','none','snap-none'],['x mandatory','x mandatory','snap-x snap-mandatory'],['x proximity','x proximity','snap-x snap-proximity']],def:1,
 tip:tx('<code>mandatory</code> rastet immer ein, <code>proximity</code> nur in der Nähe eines Punkts. Die Kinder brauchen <code>scroll-snap-align</code>. Mit der Tastatur: erst in den Kasten tabben, dann Pfeiltasten.','<code>mandatory</code> always snaps, <code>proximity</code> only near a snap point. The children need <code>scroll-snap-align</code>. With the keyboard: tab into the box first, then use the arrow keys.')},
{id:'accent-color',cat:'interact',name:'accent-color',sub:tx('Native Formularelemente einfärben','Coloring native form controls'),mdn:'accent-color',
 desc:tx('<code>accent-color</code> färbt Checkbox, Radio, Regler und Fortschrittsbalken mit einer Zeile ein.','<code>accent-color</code> colors checkboxes, radio buttons, sliders and progress bars with a single line.'),
 stage:`<div class="ca-form"><label><input type="checkbox" checked> Checkbox</label><label><input type="radio" name="ca-acc" checked> Radio</label><input type="range" value="60" aria-label="${tx('Regler','Slider')}"><progress value="60" max="100">${tx('60 %','60%')}</progress></div>`,t:['.ca-form','.form'],
 vals:[['auto','auto','accent-auto'],['#BE185D','#BE185D','accent-[#BE185D]'],['#047857','#047857','accent-[#047857]'],['#0369A1','#0369A1','accent-[#0369A1]']],def:1,
 tip:tx('Der Browser passt die Farbe des Häkchens selbst an, damit der Kontrast stimmt. Für die meisten Formulare reicht das, statt Checkboxen nachzubauen.','The browser adjusts the checkmark color itself so the contrast holds. For most forms that’s enough – no need to rebuild checkboxes.')},
{id:'scroll-margin',cat:'interact',name:'scroll-margin-top',sub:tx('Sprungziele nicht unter der Sticky-Kopfzeile – auch mit scroll-padding-top','Keeping jump targets out from under the sticky header – also with scroll-padding-top'),mode:'css',mdn:'scroll-margin-top',
 desc:tx('Springt ein Anker-Link zu einer Überschrift, landet sie ganz oben – und eine Sticky-Kopfzeile deckt sie zu. <code>scroll-margin-top</code> am Ziel oder <code>scroll-padding-top</code> am Scroll-Container hält den Platz frei. Die Kopfzeile im Kasten ist 40 px hoch; spring mit den Buttons zu einem Abschnitt.','When an anchor link jumps to a heading, it lands right at the top – and a sticky header covers it. <code>scroll-margin-top</code> on the target or <code>scroll-padding-top</code> on the scroll container keeps the space free. The header in the box is 40 px tall; use the buttons to jump to a section.'),
 stage:`<div class="btn-row">${[2,3,4].map(n=>`<button type="button" class="btn btn-secondary ca-sm-go" data-to="${n}" aria-label="${tx('Springe zu Abschnitt','Jump to section')} ${n}">${tx('Abschnitt','Section')} ${n}</button>`).join('')}</div><div class="ca-scroll ca-sm-box scroller" tabindex="0" role="region" aria-label="${tx('Scrollbereich mit Sticky-Kopfzeile','Scroll area with sticky header')}"><div class="ca-sm-head">${tx('Sticky-Kopfzeile · 40 px','Sticky header · 40 px')}</div>${[1,2,3,4].map(n=>`<h4 class="target ca-sm-t" tabindex="-1" data-n="${n}">${tx('Abschnitt','Section')} ${n}</h4><p>${tx(`Text von Abschnitt ${n}. Springst du hierher, soll die Überschrift darüber sichtbar sein – nicht unter der Kopfzeile.`,`Text of section ${n}. When you jump here, the heading above should be visible – not hidden under the header.`)}</p>`).join('')}</div>`,
 vals:[[tx('ohne','without'),'','',tx('Die Überschrift landet ganz oben – unter der Kopfzeile. Sichtbar ist nur der Text darunter.','The heading lands right at the top – under the header. Only the text below it is visible.')],
  ['scroll-margin-top','& .target {\n  scroll-margin-top: 48px;\n}','scroll-mt-12',tx('Am Ziel: Beim Hinspringen hält es 48 px Abstand zum oberen Rand. Muss an jedes mögliche Ziel.','On the target: when jumped to, it keeps 48 px from the top edge. Has to go on every possible target.')],
  ['scroll-padding-top','& .scroller {\n  scroll-padding-top: 48px;\n}','scroll-pt-12',tx('Am Scroll-Container: einmal gesetzt, gilt es für alle Ziele darin.','On the scroll container: set once, it applies to every target inside.')]],
 init(st){const box=$('.ca-sm-box',st);$$('.ca-sm-go',st).forEach(b=>b.addEventListener('click',()=>{
  const t=$(`.ca-sm-t[data-n="${b.dataset.to}"]`,st),keep=[];for(let p=box.parentElement;p;p=p.parentElement)keep.push([p,p.scrollTop,p.scrollLeft]);
  t.scrollIntoView({block:'start'});keep.forEach(([p,y,x])=>{p.scrollTop=y;p.scrollLeft=x});t.focus({preventScroll:true})}))},
 tip:tx('Für die ganze Seite gehört <code>scroll-padding-top</code> an <code>html</code>, in der Höhe der Kopfzeile – etwa <code>html { scroll-padding-top: 4rem }</code>. Browser beachten das auch, wenn sie zum Tab-Fokus scrollen: Fokussierte Elemente rutschen dann nicht mehr unter die Kopfzeile – genau darum geht es in <a class="xlink" href="https://daniel-hopium.github.io/pattern-library/#wcag-kriterien/2.4.11">WCAG 2.4.11</a>.','For the whole page, <code>scroll-padding-top</code> goes on <code>html</code>, matching the header height – e.g. <code>html { scroll-padding-top: 4rem }</code>. Browsers also respect it when scrolling to keyboard focus: focused elements no longer slide under the header – which is exactly what <a class="xlink" href="https://daniel-hopium.github.io/pattern-library/#wcag-kriterien/2.4.11">WCAG 2.4.11</a> is about.')},
{id:'scroll-behavior',cat:'interact',name:'scroll-behavior',sub:tx('Springen oder gleiten','Jumping or gliding'),mdn:'scroll-behavior',
 desc:tx('<code>scroll-behavior</code> legt fest, ob Sprünge per Anker-Link oder JavaScript (<code>scrollTo</code>, <code>scrollIntoView</code>) sofort passieren oder sanft gleiten. Drück die Buttons.','<code>scroll-behavior</code> decides whether jumps via anchor links or JavaScript (<code>scrollTo</code>, <code>scrollIntoView</code>) happen instantly or glide smoothly. Press the buttons.'),
 stage:`<div class="btn-row"><button type="button" class="btn btn-secondary ca-sb-down">${tx('Ans Ende','To the end')}</button><button type="button" class="btn btn-secondary ca-sb-up">${tx('Zum Anfang','To the start')}</button></div><div class="ca-scroll ca-sb-box" tabindex="0" role="region" aria-label="${tx('Scrollbereich zu scroll-behavior','Scroll area for scroll-behavior')}">${Array.from({length:14},(_,i)=>`<p>${tx('Zeile','Line')} ${i+1}</p>`).join('')}</div>`,
 t:['.ca-sb-box','.scroller'],
 vals:[['auto','auto','scroll-auto',tx('Sofortiger Sprung.','Instant jump.')],['smooth','smooth','scroll-smooth',tx('Gleitet zum Ziel.','Glides to the target.')]],def:1,
 measure:st=>reducedMotion()?tx('Dein System meldet „Bewegung reduzieren“ – darum springt die Vorschau auch bei smooth sofort. So wie mit dem @media-Block aus der Stolperfalle.','Your system reports “Reduce motion” – that’s why the preview jumps instantly even with smooth. Just like with the @media block from the gotcha.'):'',
 init(st){const box=$('.ca-sb-box',st);$('.ca-sb-down',st).addEventListener('click',()=>box.scrollTo({top:box.scrollHeight}));$('.ca-sb-up',st).addEventListener('click',()=>box.scrollTo({top:0}))},
 tip:tx('Wirkt nur auf Sprünge per Link und JavaScript, nicht wenn jemand selbst scrollt. Global gehört es in eine Abfrage: <code>@media (prefers-reduced-motion: no-preference) { html { scroll-behavior: smooth } }</code> – wer Bewegung reduziert, bekommt den Sprung. Und JavaScript, das direkt nach <code>scrollTo</code> die Position liest, bekommt bei smooth noch den alten Wert.','Only affects jumps via links and JavaScript, not when someone scrolls themselves. Globally, it belongs inside a query: <code>@media (prefers-reduced-motion: no-preference) { html { scroll-behavior: smooth } }</code> – people who reduce motion get the jump. And JavaScript that reads the position right after <code>scrollTo</code> still gets the old value with smooth.')},
{id:'overscroll-behavior',cat:'interact',name:'overscroll-behavior',sub:tx('Am Ende nicht die Seite mitreißen','Not dragging the page along at the end'),mdn:'overscroll-behavior',
 desc:tx('Ist ein Scrollbereich am Ende, reicht der Browser das weitere Scrollen an die Seite dahinter weiter – Scroll-Chaining. Bei Seitenleisten und Modals nervt das. Scroll im Kasten mit Mausrad oder Finger bis ganz nach unten – und dann noch einmal weiter.','When a scroll area reaches its end, the browser passes further scrolling on to the page behind it – scroll chaining. With sidebars and modals that’s annoying. Scroll to the very bottom of the box with the mouse wheel or your finger – and then keep going.'),
 stage:`<div class="ca-scroll ca-os-box" tabindex="0" role="region" aria-label="${tx('Seitenleiste zum Scrollen','Sidebar to scroll')}">${Array.from({length:9},(_,i)=>`<p>${tx('Menüpunkt','Menu item')} ${i+1}</p>`).join('')}</div><p class="ca-small ca-os-log" role="status"></p>`,
 t:['.ca-os-box','.sidebar'],
 vals:[['auto','auto','overscroll-auto',tx('Am Ende angekommen, scrollt die Seite weiter.','Once at the end, the page keeps scrolling.')],['contain','contain','overscroll-contain',tx('Am Ende ist Schluss, die Seite bleibt stehen. Das Nachfedern am Handy bleibt im Kasten.','At the end it stops, the page stays put. The bounce on phones stays inside the box.')],['none','none','overscroll-none',tx('Wie contain, zusätzlich ohne Nachfedern oder Leuchten am Rand. Am Desktop siehst du keinen Unterschied zu contain.','Like contain, plus no bounce or glow at the edge. On desktop you won’t see a difference from contain.')]],
 init(st){
  const art=st.closest('.ca-entry'),box=$('.ca-os-box',st),log=$('.ca-os-log',st),page=st.closest('.detail')||document.scrollingElement;let t=0;
  const mark=()=>{t=Date.now()};box.addEventListener('wheel',mark,{passive:true});box.addEventListener('touchmove',mark,{passive:true});
  const msg=tx('Die Seite ist mitgescrollt – Scroll-Chaining.','The page scrolled along – scroll chaining.');
  const on=()=>{if(!st.isConnected){page.removeEventListener('scroll',on);return}if(Date.now()-t<250&&log.textContent!==msg)log.textContent=msg};
  page.addEventListener('scroll',on,{passive:true});
  art.addEventListener('change',()=>{log.textContent=''});
 },
 tip:tx('Wirkt nur auf einen Scroll-Container. Scrollt der Inhalt eines Modals gar nicht, verhalten sich Browser unterschiedlich – sicherer sperrst du die Seite, solange das Modal offen ist. Diese App setzt <code>overscroll-behavior: contain</code> auf Seitenleiste und Inhalt, damit am Handy nicht die ganze Seite mitschwingt.','Only works on a scroll container. If a modal’s content doesn’t scroll at all, browsers behave differently – it’s safer to lock the page while the modal is open. This app sets <code>overscroll-behavior: contain</code> on the sidebar and the content, so the whole page doesn’t swing along on phones.')},
{id:'touch-action',cat:'interact',name:'touch-action',sub:tx('Welche Touch-Gesten der Browser übernimmt','Which touch gestures the browser handles'),mdn:'touch-action',
 desc:tx('<code>touch-action</code> sagt dem Browser vorab, welche Gesten er selbst übernehmen darf – Scrollen, Zoomen – und welche an dein JavaScript gehen. Zeichne mit dem Finger in die Fläche. Mit der Maus ändert sich nichts: <code>touch-action</code> gilt nur für Touch (je nach Browser auch für den Stift).','<code>touch-action</code> tells the browser up front which gestures it may handle itself – scrolling, zooming – and which go to your JavaScript. Draw in the area with your finger. With a mouse nothing changes: <code>touch-action</code> only applies to touch (and, depending on the browser, pen).'),
 stage:`<canvas class="ca-ta-pad" role="img" aria-label="${tx('Zeichenfläche für Finger oder Maus','Drawing area for finger or mouse')}"></canvas><p class="ca-small ca-ta-log">${tx('Noch nichts gezeichnet.','Nothing drawn yet.')}</p>`,
 t:['.ca-ta-pad','.pad'],
 vals:[['auto','auto','touch-auto',tx('Der Browser darf alles: Wischen scrollt die Seite, Doppeltippen zoomt. Am Handy bricht dein Strich nach wenigen Pixeln mit pointercancel ab.','The browser may do everything: swiping scrolls the page, double-tapping zooms. On a phone your stroke breaks off after a few pixels with pointercancel.')],
  ['manipulation','manipulation','touch-manipulation',tx('Scrollen und Zwei-Finger-Zoom bleiben, nur der Doppeltipp-Zoom fällt weg. Früher der Trick gegen die 300-ms-Verzögerung beim Tippen – mit width=device-width im Viewport-Meta-Tag gibt es die heute ohnehin nicht mehr.','Scrolling and pinch zoom stay, only double-tap zoom goes away. It used to be the trick against the 300 ms tap delay – with width=device-width in the viewport meta tag that delay is gone anyway today.')],
  ['pan-y','pan-y','touch-pan-y',tx('Senkrecht wischen scrollt die Seite, waagrecht bekommt dein JavaScript – typisch für Slider und Karussells.','Vertical swipes scroll the page, horizontal ones go to your JavaScript – typical for sliders and carousels.')],
  ['none','none','touch-none',tx('Alles geht an dein JavaScript: Zeichnen klappt, aber auf dieser Fläche lässt sich die Seite weder scrollen noch zoomen.','Everything goes to your JavaScript: drawing works, but on this area the page can be neither scrolled nor zoomed.')]],
 init(st){
  const c=$('.ca-ta-pad',st),log=$('.ca-ta-log',st);let ctx,n=0,down=false;
  const pt=e=>{const r=c.getBoundingClientRect();return [e.clientX-r.left,e.clientY-r.top]};
  c.addEventListener('pointerdown',e=>{const r=c.getBoundingClientRect(),d=window.devicePixelRatio||1;c.width=Math.round(r.width*d);c.height=Math.round(r.height*d);ctx=c.getContext('2d');ctx.scale(d,d);ctx.lineWidth=4;ctx.lineCap='round';ctx.lineJoin='round';ctx.strokeStyle=getComputedStyle(c).color;ctx.beginPath();ctx.moveTo(...pt(e));n=0;down=true;try{c.setPointerCapture(e.pointerId)}catch(err){}log.textContent=`pointerdown (${e.pointerType}) …`});
  c.addEventListener('pointermove',e=>{if(!down)return;n++;ctx.lineTo(...pt(e));ctx.stroke()});
  const end=(e,cancel)=>{if(!down)return;down=false;log.textContent=cancel?tx(`${e.pointerType}: ${n}× pointermove, dann pointercancel – der Browser hat die Geste übernommen (Scrollen oder Zoomen).`,`${e.pointerType}: ${n}× pointermove, then pointercancel – the browser took over the gesture (scrolling or zooming).`):tx(`${e.pointerType}: ${n}× pointermove bis zum Loslassen – dein JavaScript hat die ganze Geste bekommen.`,`${e.pointerType}: ${n}× pointermove until release – your JavaScript got the whole gesture.`)};
  c.addEventListener('pointerup',e=>end(e,false));c.addEventListener('pointercancel',e=>end(e,true));
 },
 tip:tx('<code>none</code> nur auf kleinen Flächen wie Zeichenfeld, Regler-Griff oder Karte: Füllt so eine Fläche den Bildschirm, kommt man am Handy nicht mehr weiter. <code>touch-action</code> wird nicht vererbt, wirkt aber mit den Vorfahren zusammen – erlaubt ist nur, was alle erlauben.','Use <code>none</code> only on small areas like a drawing field, a slider thumb or a map: if such an area fills the screen, people on phones get stuck. <code>touch-action</code> isn’t inherited, but it combines with the ancestors – only what all of them allow is allowed.')},
/* Kaskade */
{id:'custom-properties',cat:'cascade',name:'--* & var()',sub:tx('Eigene Variablen – und sie erben','Your own variables – and they inherit'),mdn:'CSS_cascading_variables/Using_CSS_custom_properties',
 desc:tx('Eine Custom Property (<code>--accent</code>) speichert einen Wert, <code>var(--accent, Ersatz)</code> liest ihn aus. Sie erbt wie <code>color</code>: An Karte 2 gesetzt, gilt sie für alles darin – Karte 1 nimmt weiter den Ersatzwert nach dem Komma.','A custom property (<code>--accent</code>) stores a value, <code>var(--accent, fallback)</code> reads it. It inherits like <code>color</code>: set on card 2, it applies to everything inside – card 1 keeps using the fallback after the comma.'),
 stage:`<div class="ca-cp-row">${[1,2].map(n=>`<div class="ca-cp-card ca-cp-${n}"><p class="ca-cp-title">${tx('Karte','Card')} ${n}</p><span class="ca-cp-pill">${tx('Neu','New')}</span></div>`).join('')}</div>`,
 base:[['.ca-cp-card','.card',{'border-left':'6px solid var(--accent, #6D28D9)'}],['.ca-cp-pill','.card .badge',{background:'var(--accent, #6D28D9)',color:'var(--accent-ink, #FFFFFF)'}]],t:['.ca-cp-2','.card-2'],
 vals:[[tx('nicht gesetzt','not set'),{},'',tx('Keine Variable da: Beide Karten nehmen den Ersatzwert – violett.','No variable there: both cards use the fallback – violet.')],
  ['#BE185D',{'--accent':'#BE185D'},'[--accent:#BE185D]'],
  ['#0369A1',{'--accent':'#0369A1'},'[--accent:#0369A1]'],
  ['#047857',{'--accent':'#047857'},'[--accent:#047857]'],
  [tx('Design-Token','design token'),{'--accent':'var(--brand)','--accent-ink':'var(--brand-ink)'},'[--accent:var(--brand)]',tx('Eine Variable darf auf eine andere zeigen. --brand ist das Token dieser App und wechselt im Dark Mode mit – die Karte auch.','A variable may point to another one. --brand is this app’s token and changes in dark mode – and so does the card.')]],
 tip:tx('Der Ersatzwert greift nur, wenn die Variable fehlt – nicht, wenn Unsinn drinsteht. Mit <code>--accent: 20px</code> wird <code>background: var(--accent, violet)</code> nicht violett, sondern ungültig und fällt auf <code>unset</code> zurück: durchsichtig. Außerdem zählt Groß- und Kleinschreibung, <code>--Accent</code> ist eine andere Variable. In Tailwind v4 liest <code>bg-(--accent)</code> eine Variable aus.','The fallback only kicks in when the variable is missing – not when it holds nonsense. With <code>--accent: 20px</code>, <code>background: var(--accent, violet)</code> doesn’t turn violet; it becomes invalid and falls back to <code>unset</code>: transparent. Also, case matters: <code>--Accent</code> is a different variable. In Tailwind v4, <code>bg-(--accent)</code> reads a variable.')},
{id:'inheritance',cat:'cascade',name:'inherit, initial, unset, revert',sub:tx('Erben oder zurücksetzen','Inherit or reset'),mdn:'CSS_cascade/Inheritance',
 desc:tx('Manche Eigenschaften erben vom Eltern-Element – <code>color</code>, <code>font-*</code>, <code>line-height</code> –, die meisten nicht: <code>border</code>, <code>padding</code>, <code>display</code>. Vier Schlüsselwörter steuern das für jede Eigenschaft. Sie gelten hier für das innere div; das äußere hat pinke Schrift und einen gestrichelten Rahmen.','Some properties inherit from the parent – <code>color</code>, <code>font-*</code>, <code>line-height</code> –, most don’t: <code>border</code>, <code>padding</code>, <code>display</code>. Four keywords control this for any property. Here they apply to the inner div; the outer one has pink text and a dashed border.'),
 stage:`<div class="ca-ih-parent">${tx('Eltern-Element','Parent element')}<div class="ca-ih-child">${tx('Kind-Element (ein div)','Child element (a div)')}</div></div>`,
 base:[['.ca-ih-parent','.parent',{color:'#9D174D',border:'3px dashed #9D174D'}]],t:['.ca-ih-child','.child'],
 vals:[[tx('Standard','default'),{},'',tx('color erbt, border und display nicht: pinke Schrift, kein Rahmen, ein Block.','color inherits, border and display don’t: pink text, no border, a block.')],
  ['inherit',{color:'inherit',border:'inherit',display:'inherit'},'',tx('Alles kommt vom Eltern-Element – jetzt auch der Rahmen.','Everything comes from the parent – now the border too.')],
  ['initial',{color:'initial',border:'initial',display:'initial'},'',tx('Der Startwert aus der Spezifikation: schwarze Schrift, kein Rahmen – und display: inline, obwohl es ein div ist.','The initial value from the spec: black text, no border – and display: inline, even though it’s a div.')],
  ['unset',{color:'unset',border:'unset',display:'unset'},'',tx('Erbende Eigenschaften erben, alle anderen gehen auf initial: pink, kein Rahmen, inline.','Inherited properties inherit, all others go to initial: pink, no border, inline.')],
  ['revert',{color:'revert',border:'revert',display:'revert'},'',tx('Zurück zum Stil des Browsers: pink (der Browser setzt keine Farbe), kein Rahmen – und das div ist wieder ein Block.','Back to the browser’s style: pink (the browser sets no color), no border – and the div is a block again.')]],
 tip:tx('<code>initial</code> heißt nicht „Browser-Standard“, sondern Startwert der Spezifikation – darum wird ein div mit <code>display: initial</code> inline. Wer „wie ohne mein CSS“ meint, will <code>revert</code>. <code>all: unset</code> setzt alles auf einmal zurück, etwa um einen Button ganz neu zu gestalten – dabei verschwindet aber auch der Fokusring, den musst du selbst wieder setzen.','<code>initial</code> doesn’t mean “browser default” but the spec’s initial value – that’s why a div with <code>display: initial</code> becomes inline. If you mean “as if my CSS weren’t there”, you want <code>revert</code>. <code>all: unset</code> resets everything at once, e.g. to restyle a button from scratch – but the focus ring disappears too, so you have to add it back yourself.')},
{id:'layer',cat:'cascade',name:'@layer',sub:tx('Reihenfolge schlägt Spezifität','Order beats specificity'),mode:'css',mdn:'@layer',
 desc:tx('<code>@layer</code> sortiert Regeln in Ebenen. Zwischen zwei Ebenen entscheidet nur deren Reihenfolge, die <a href="#sel/specificity">Spezifität</a> zählt erst innerhalb derselben Ebene. Die erste Zeile legt die Reihenfolge fest: Die zuletzt genannte Ebene gewinnt.','<code>@layer</code> sorts rules into layers. Between two layers only their order matters; <a href="#sel/specificity">specificity</a> only counts within the same layer. The first line sets the order: the layer named last wins.'),
 stage:`<div class="box"><span class="cta ca-ly-cta">${tx('Jetzt kaufen','Buy now')}</span></div>`,
 vals:[[tx('ohne Layer','no layers'),'& .box .cta { background: #BE185D; }\n& .cta { background: #047857; }','',tx('Normale Kaskade: .box .cta ist spezifischer und gewinnt – pink.','Normal cascade: .box .cta is more specific and wins – pink.')],
  [tx('mit Layern','with layers'),'@layer ca-layer-base, ca-layer-theme;\n\n@layer ca-layer-base {\n  & .box .cta { background: #BE185D; }\n}\n@layer ca-layer-theme {\n  & .cta { background: #047857; }\n}','',tx('ca-layer-theme steht später in der Liste und gewinnt – grün, obwohl .cta weniger spezifisch ist.','ca-layer-theme comes later in the list and wins – green, even though .cta is less specific.')],
  [tx('Reihenfolge getauscht','order swapped'),'@layer ca-layer-theme, ca-layer-base;\n\n@layer ca-layer-base {\n  & .box .cta { background: #BE185D; }\n}\n@layer ca-layer-theme {\n  & .cta { background: #047857; }\n}','',tx('Nur die erste Zeile ist anders: Jetzt steht ca-layer-base hinten und gewinnt – pink.','Only the first line changed: now ca-layer-base comes last and wins – pink.')],
  [tx('ohne Layer gewinnt','unlayered wins'),'@layer ca-layer-base {\n  & .box .cta { background: #BE185D; }\n}\n& .cta { background: #047857; }','',tx('Regeln außerhalb jeder Ebene schlagen alle Ebenen – grün, trotz geringerer Spezifität.','Rules outside any layer beat all layers – green, despite lower specificity.')],
  ['!important','@layer ca-layer-base {\n  & .cta { background: #BE185D !important; }\n}\n& .cta { background: #047857 !important; }','',tx('Bei !important dreht sich die Reihenfolge um: Jetzt schlägt die Ebene das CSS ohne Ebene – pink.','With !important the order flips: now the layer beats the unlayered CSS – pink.')]],
 measure:st=>{const c=getComputedStyle($('.cta',st)).backgroundColor;return `${tx('Es gewinnt','The winner is')}: ${c==='rgb(4, 120, 87)'?tx('grün','green')+' (#047857)':c==='rgb(190, 24, 93)'?'pink (#BE185D)':c}`},
 tip:tx('Tailwind v4 legt sein ganzes CSS in <code>@layer theme, base, components, utilities</code>. Eigenes CSS ohne <code>@layer</code> schlägt darum jede Utility-Klasse – leg es in <code>@layer components</code>, wenn Utilities es überschreiben sollen. Ebenen-Namen gelten im ganzen Dokument; hier tragen sie darum das Präfix <code>ca-layer-</code>, in Projekten heißen sie meist <code>reset</code>, <code>base</code>, <code>components</code>.','Tailwind v4 puts all of its CSS into <code>@layer theme, base, components, utilities</code>. Your own CSS without <code>@layer</code> therefore beats every utility class – put it in <code>@layer components</code> if utilities should be able to override it. Layer names apply to the whole document; that’s why they carry the prefix <code>ca-layer-</code> here – in projects they’re usually called <code>reset</code>, <code>base</code>, <code>components</code>.')},
{id:'nesting',cat:'cascade',name:tx('Verschachtelung','Nesting'),sub:tx('Regeln ineinander schreiben – ohne Sass','Rules inside rules – without Sass'),mode:'css',mdn:'CSS_nesting',
 desc:tx('Seit Ende 2023 verstehen alle großen Browser verschachteltes CSS. Eine Regel in einer Regel meint einen Nachfahren, <code>&amp;</code> steht für das äußere Element selbst. Fahr mit der Maus über die Karte oder spring per Tab zum Link.','Since late 2023, all major browsers understand nested CSS. A rule inside a rule means a descendant, <code>&amp;</code> stands for the outer element itself. Hover over the card or tab to the link.'),
 stage:`<div class="panel ca-ns-panel"><p class="title">${tx('Kartentitel','Card title')}</p><p>${tx('Ein kurzer Text in der Karte.','A short text inside the card.')}</p><a href="#">${tx('Mehr erfahren','Learn more')}</a></div>`,
 vals:[[tx('flach','flat'),'& .panel { border: 3px solid #0369A1; }\n& .panel .title { text-transform: uppercase; }\n& .panel:hover,\n& .panel:focus-within { outline: 3px solid #BE185D; }','',tx('Die klassische Schreibweise: drei Regeln, dreimal .panel.','The classic way: three rules, .panel three times.')],
  [tx('verschachtelt','nested'),'& .panel {\n  border: 3px solid #0369A1;\n  .title { text-transform: uppercase; }\n  &:hover, &:focus-within { outline: 3px solid #BE185D; }\n}','',tx('Dieselbe Wirkung, .panel steht nur einmal da.','Same effect, .panel appears only once.')],
  [tx('ohne &','without &'),'& .panel {\n  border: 3px solid #0369A1;\n  .title { text-transform: uppercase; }\n  :hover, :focus-within { outline: 3px solid #BE185D; }\n}','',tx('Ohne & wird :hover zu .panel :hover – jetzt bekommen die Kinder den Rahmen, nicht die Karte.','Without &, :hover becomes .panel :hover – now the children get the outline, not the card.')],
  ['@media','& .panel {\n  border: 3px solid #0369A1;\n  @media (min-width: 40rem) {\n    border-width: 8px;\n  }\n}','',tx('Auch @media und @container dürfen hinein, sogar mit Deklarationen direkt darin. Zieh das Fenster schmaler als 640 px.','@media and @container can go inside too, even with declarations directly in them. Make the window narrower than 640px.')]],
 init(st){const s=st.parentElement.querySelector(':scope > style'),re=new RegExp('#'+st.id+'(?=[:.\\[])','g');
  /* caApply ersetzt jedes & durch die Vorschau-ID. Beim verschachtelten &:hover muss das & aber bleiben – hier zurücktauschen. */
  new MutationObserver(()=>{const a=s.textContent,b=a.replace(re,'&');if(a!==b)s.textContent=b}).observe(s,{childList:true,characterData:true,subtree:true})},
 tip:tx('Ohne <code>&amp;</code> ist jeder verschachtelte Selektor ein Nachfahre – für Zustände der Karte selbst also immer <code>&amp;:hover</code>. Anders als in Sass geht <code>&amp;__title</code> (BEM) nativ nicht: <code>&amp;</code> setzt keine Namen zusammen. Und nicht zu tief verschachteln – jede Ebene erhöht die <a href="#sel/specificity">Spezifität</a> wie ein langer Selektor.','Without <code>&amp;</code>, every nested selector is a descendant – so for states of the card itself, always use <code>&amp;:hover</code>. Unlike Sass, <code>&amp;__title</code> (BEM) doesn’t work natively: <code>&amp;</code> doesn’t concatenate names. And don’t nest too deep – every level raises the <a href="#sel/specificity">specificity</a> like a long selector.')},
{id:'supports',cat:'cascade',name:'@supports',sub:tx('Kann der Browser das?','Can the browser do this?'),mode:'css',mdn:'@supports',
 desc:tx('<code>@supports</code> wendet Regeln nur an, wenn der Browser eine Eigenschaft mit Wert – oder mit <code>selector()</code> einen Selektor – versteht. So baust du einen Fallback und einen modernen Zweig. Welcher greift, entscheidet dein Browser.','<code>@supports</code> applies rules only if the browser understands a property with a value – or, with <code>selector()</code>, a selector. That’s how you build a fallback and a modern branch. Your browser decides which one applies.'),
 stage:`<p class="result ca-su"><span class="modern ca-su-yes">✓ ${tx('Moderner Zweig: Der Browser kann es.','Modern branch: the browser supports it.')}</span><span class="fallback ca-su-no">✗ ${tx('Fallback: Der Browser kann es nicht.','Fallback: the browser doesn’t support it.')}</span></p>`,
 vals:[['display: grid','& .modern { display: none; }\n\n@supports (display: grid) {\n  & .modern { display: inline-block; }\n  & .fallback { display: none; }\n}','supports-[display:grid]:',tx('Grid kann heute jeder Browser – der moderne Zweig.','Every browser supports grid today – the modern branch.')],
  [':has()','& .modern { display: none; }\n\n@supports selector(:has(a)) {\n  & .modern { display: inline-block; }\n  & .fallback { display: none; }\n}','supports-[selector(:has(a))]:',tx('Selektoren prüfst du mit selector(). :has() ist seit Ende 2023 in allen großen Browsern.','You test selectors with selector(). :has() has been in all major browsers since late 2023.')],
  ['anchor-name','& .modern { display: none; }\n\n@supports (anchor-name: --a) {\n  & .modern { display: inline-block; }\n  & .fallback { display: none; }\n}','supports-[anchor-name:--a]:',tx('Anchor Positioning ist neu und kam nicht überall gleichzeitig – je nach Browser landest du hier im Fallback.','Anchor positioning is new and didn’t arrive everywhere at once – depending on your browser, you end up in the fallback here.')],
  ['not','& .modern { display: none; }\n\n@supports not (display: grid) {\n  & .modern { display: inline-block; }\n  & .fallback { display: none; }\n}','not-supports-[display:grid]:',tx('not dreht die Bedingung um: Nur Browser ohne Grid nehmen den Zweig – deiner nicht.','not flips the condition: only browsers without grid take the branch – yours doesn’t.')]],
 measure:st=>{const q=['display: grid','selector(:has(a))','anchor-name: --a','not (display: grid)'][+$('.ca-vals input:checked',st.parentElement).value];return `${tx('Dieser Browser','This browser')}: CSS.supports("${q}") → ${CSS.supports(q)}`},
 tip:tx('<code>@supports</code> prüft nur, ob der Browser Eigenschaft und Wert versteht – nicht, ob er sie fehlerfrei umsetzt. Die Klammern sind Pflicht: <code>@supports display: grid</code> ist ungültig. Oft brauchst du es gar nicht: Unbekannte Deklarationen überspringt der Browser, also reicht der Fallback davor – <code>height: 100vh; height: 100dvh;</code>.','<code>@supports</code> only checks whether the browser understands the property and value – not whether it implements them correctly. The parentheses are required: <code>@supports display: grid</code> is invalid. Often you don’t need it at all: the browser skips unknown declarations, so a fallback in front is enough – <code>height: 100vh; height: 100dvh;</code>.')},
{id:'logical-properties',cat:'cascade',name:tx('Logische Eigenschaften','Logical properties'),sub:tx('Anfang und Ende statt links und rechts','Start and end instead of left and right'),mdn:'CSS_logical_properties_and_values',
 desc:tx('<code>inline</code> ist die Richtung, in der die Zeile läuft, <code>block</code> die, in der Absätze aufeinander folgen. <code>margin-inline-start</code> heißt also „am Zeilenanfang“ – links im Deutschen, rechts im Arabischen oder Hebräischen. Schalte mit dem Button auf <code>dir="rtl"</code> und vergleiche mit <code>margin-left</code>.','<code>inline</code> is the direction a line runs in, <code>block</code> the direction paragraphs follow each other. So <code>margin-inline-start</code> means “at the start of the line” – left in English, right in Arabic or Hebrew. Switch to <code>dir="rtl"</code> with the button and compare with <code>margin-left</code>.'),
 stage:`<button type="button" class="btn btn-secondary ca-lp-dir" aria-pressed="false">${tx('Von rechts nach links','Right to left')} (dir="rtl")</button><div class="ca-lp-wrap" dir="ltr"><div class="ca-i ca-t3 ca-lp-el">${tx('Zeilenanfang','Line start')}</div></div>`,
 t:['.ca-lp-el','.item'],
 vals:[['margin-left',{'margin-left':'48px'},'ml-12'],
  ['margin-inline-start',{'margin-inline-start':'48px'},'ms-12'],
  ['border-left',{'border-left':'8px solid #FDE047'},'border-l-8 border-l-[#FDE047]'],
  ['border-inline-start',{'border-inline-start':'8px solid #FDE047'},'border-s-8 border-s-[#FDE047]'],
  ['padding-inline',{'padding-inline':'12px 64px'},'ps-3 pe-16',tx('Zwei Werte: Anfang, dann Ende.','Two values: start, then end.')],
  ['padding-block',{'padding-block':'24px'},'py-6',tx('block ist in waagrechter Schrift oben und unten – dir ändert daran nichts, erst writing-mode.','In horizontal text, block is top and bottom – dir doesn’t change that, only writing-mode does.')]],
 init(st){const b=$('.ca-lp-dir',st),w=$('.ca-lp-wrap',st);b.addEventListener('click',()=>{const on=b.getAttribute('aria-pressed')!=='true';b.setAttribute('aria-pressed',String(on));w.dir=on?'rtl':'ltr'})},
 tip:tx('Tailwind v4 schreibt <code>px-*</code> und <code>py-*</code> schon als <code>padding-inline</code> und <code>padding-block</code>. Für eine Seite gibt es <code>ms-*</code>/<code>me-*</code>, <code>ps-*</code>/<code>pe-*</code> und <code>border-s</code>/<code>border-e</code>, fürs Positionieren <code>inset-inline-start</code>. Wer von Anfang an logisch schreibt, braucht für Arabisch kein zweites Stylesheet. Pfeil-Icons drehen sich aber nicht mit – dafür gibt es <code>:dir(rtl)</code>.','Tailwind v4 already writes <code>px-*</code> and <code>py-*</code> as <code>padding-inline</code> and <code>padding-block</code>. For one side there are <code>ms-*</code>/<code>me-*</code>, <code>ps-*</code>/<code>pe-*</code> and <code>border-s</code>/<code>border-e</code>, and <code>inset-inline-start</code> for positioning. If you write logically from the start, you don’t need a second stylesheet for Arabic. Arrow icons don’t flip, though – that’s what <code>:dir(rtl)</code> is for.')},
/* Selektoren */
{id:'combinators',cat:'sel',name:tx('Kombinatoren','Combinators'),sub:tx('Leerzeichen, >, + und ~','Space, >, + and ~'),mode:'sel',mdn:'CSS_selectors/Selectors_and_combinators',
 desc:tx('Kombinatoren verbinden zwei Selektoren und beschreiben die Beziehung im DOM: Nachkomme, Kind oder Geschwister.','Combinators connect two selectors and describe their relationship in the DOM: descendant, child or sibling.'),
 stage:`<div class="box"><h4>${tx('Überschrift','Heading')}</h4><p>${tx('Absatz 1 – Kind von .box','Paragraph 1 – child of .box')}</p><p>${tx('Absatz 2 – Kind von .box','Paragraph 2 – child of .box')}</p><section><p>${tx('Absatz 3 – steckt in einer section','Paragraph 3 – sits inside a section')}</p></section><p>${tx('Absatz 4 – Kind von .box','Paragraph 4 – child of .box')}</p></div>`,
 vals:[['.box p','[&_p]:',tx('Leerzeichen: alle Nachkommen, egal wie tief – auch Absatz 3.','Space: all descendants, however deep – including paragraph 3.')],['.box > p','[&>p]:',tx('>: nur direkte Kinder – Absatz 3 nicht.','>: direct children only – not paragraph 3.')],['h4 + p','',tx('+: nur das direkt folgende Geschwister.','+: only the immediately following sibling.')],['h4 ~ p','',tx('~: alle folgenden Geschwister auf derselben Ebene.','~: all following siblings on the same level.')]]},
{id:'nth-child',cat:'sel',name:':nth-child',sub:tx('Nach Position auswählen','Selecting by position'),mode:'sel',mdn:':nth-child',
 desc:tx('<code>:nth-child</code> wählt Elemente nach ihrer Position unter den Geschwistern – für Zebrastreifen, das erste oder „jedes dritte“.','<code>:nth-child</code> selects elements by their position among their siblings – for zebra stripes, the first one or “every third”.'),
 stage:`<ol class="list">${[1,2,3,4,5,6,7].map(n=>`<li>${tx('Eintrag','Item')} ${n}</li>`).join('')}</ol>`,
 vals:[['li:first-child','first:'],['li:nth-child(2)','nth-2:'],['li:nth-child(odd)','odd:',tx('odd = 1, 3, 5 … – even wären die geraden.','odd = 1, 3, 5 … – even would be the even ones.')],['li:nth-child(3n)','nth-[3n]:',tx('3n = jedes dritte: 3, 6, 9 …','3n = every third: 3, 6, 9 …')],['li:last-child','last:'],['li:nth-last-child(2)','nth-last-2:',tx('Von hinten gezählt.','Counted from the end.')]],
 tip:tx('<code>:nth-child</code> zählt alle Geschwister, auch andere Tags. Steht etwa eine Überschrift zwischen Absätzen, verschiebt sie die Zählung von <code>p:nth-child(odd)</code>. Dann hilft <code>p:nth-of-type(odd)</code> oder <code>:nth-child(odd of p)</code>.','<code>:nth-child</code> counts all siblings, including other tags. If, say, a heading sits between paragraphs, it shifts the count for <code>p:nth-child(odd)</code>. Then <code>p:nth-of-type(odd)</code> or <code>:nth-child(odd of p)</code> helps.')},
{id:'has',cat:'sel',name:':has()',sub:tx('Der Eltern-Selektor','The parent selector'),mode:'sel',mdn:':has',
 desc:tx('<code>:has()</code> wählt ein Element danach aus, was in ihm steckt. Hak die Karten an – die Markierung folgt live.','<code>:has()</code> selects an element based on what’s inside it. Check the cards – the highlight follows live.'),
 stage:`<div class="cards"><label class="card"><input type="checkbox"> ${tx('Tarif','Plan')} S</label><label class="card"><input type="checkbox" checked> ${tx('Tarif','Plan')} M <span class="badge">${tx('Beliebt','Popular')}</span></label><label class="card"><input type="checkbox"> ${tx('Tarif','Plan')} L</label></div>`,
 vals:[['.card:has(input:checked)','has-checked:',tx('Die Karte, deren Checkbox an ist.','The card whose checkbox is on.')],['.card:has(.badge)','has-[.badge]:',tx('Die Karte, die ein Badge enthält.','The card that contains a badge.')],['.cards:has(input:checked) .card:not(:has(input:checked))','',tx('Alle anderen – sobald irgendeine gewählt ist.','All the others – as soon as any one is selected.')]],
 tip:tx('Damit geht ohne JavaScript, wofür man früher Klassen umschalten musste. In dieser App färbt <code>.ca-vals label:has(input:checked)</code> den gewählten Wert über jeder Vorschau.','This does without JavaScript what used to require toggling classes. In this app, <code>.ca-vals label:has(input:checked)</code> colors the selected value above each preview.')},
{id:'states',cat:'sel',name:tx(':hover, :focus & Co.',':hover, :focus & co.'),sub:tx('Zustände, die der Nutzer auslöst','States the user triggers'),mode:'sel',noCount:true,mdn:':focus-visible',
 desc:tx('Pseudoklassen beschreiben einen Zustand: Maus darüber, gedrückt, fokussiert. Wähl einen aus und probier ihn am Button oder am Feld aus.','Pseudo-classes describe a state: mouse over it, pressed, focused. Pick one and try it on the button or the field.'),
 stage:`<div class="ca-states"><button type="button" class="button btn btn-secondary">Button</button><div class="group"><label for="ca-states-in">Name</label><input class="textbox input" id="ca-states-in"></div></div>`,
 vals:[['.button:hover','hover:',tx('Mit der Maus drüberfahren.','Move the mouse over it.')],['.button:active','active:',tx('Klicken und gedrückt halten.','Click and hold.')],['.button:focus','focus:',tx('Anklicken – und dann per Tab hinspringen. Beide Male markiert.','Click it – then jump to it with Tab. Highlighted both times.')],['.button:focus-visible','focus-visible:',tx('Anklicken: keine Markierung. Per Tab: Markierung. Der Browser zeigt sie nur, wenn sie gebraucht wird.','Click: no highlight. With Tab: highlight. The browser only shows it when it’s needed.')],['.group:focus-within','focus-within:',tx('Ins Feld klicken: Die ganze Gruppe wird markiert.','Click into the field: the whole group gets highlighted.')]],
 tip:tx('Für Fokusringe <code>:focus-visible</code> statt <code>:focus</code>: Nach einem Mausklick kein Ring, mit der Tastatur immer. <code>:hover</code> allein reicht nie – Touch und Tastatur kennen es nicht.','For focus rings, use <code>:focus-visible</code> instead of <code>:focus</code>: no ring after a mouse click, always one with the keyboard. <code>:hover</code> alone is never enough – touch and keyboard don’t have it.')},
{id:'pseudo-elements',cat:'sel',name:'::before & ::after',sub:tx('Pseudo-Elemente','Pseudo-elements'),mode:'css',mdn:'::before',
 desc:tx('<code>::before</code> und <code>::after</code> erzeugen ein zusätzliches Element vor oder nach dem Inhalt – nur mit CSS. <code>::marker</code> gestaltet Listenpunkte, <code>::selection</code> markierten Text.','<code>::before</code> and <code>::after</code> create an extra element before or after the content – with CSS alone. <code>::marker</code> styles list bullets, <code>::selection</code> styles selected text.'),
 stage:`<a class="link" href="#">${tx('Mehr erfahren','Learn more')}</a><p class="notice">${tx('Das ist ein Hinweis zum Markieren.','This is a notice you can select.')}</p><ul class="bullets"><li>${tx('Erster Punkt','First item')}</li><li>${tx('Zweiter Punkt','Second item')}</li></ul>`,
 vals:[[tx('ohne','without'),'',''],['::after','& .link::after { content: " →"; }',"after:content-['_→']"],['::before','& .notice::before { content: "⚠ "; color: #B45309; }',''],['::marker','& .bullets li::marker { content: "✓  "; color: #047857; }','marker:text-emerald-700'],['::selection','& .notice::selection { background: #FDE047; color: #000; }','selection:bg-yellow-300',tx('Markier den Hinweis-Text mit der Maus.','Select the notice text with your mouse.')]],
 tip:tx('Text aus <code>content</code> lesen die meisten Screenreader mit. Rein Dekoratives bekommt einen leeren Alternativtext: <code>content: "→" / ""</code>.','Most screen readers read out text from <code>content</code>. Purely decorative content gets an empty alternative text: <code>content: "→" / ""</code>.')},
{id:'attribute',cat:'sel',name:tx('Attribut-Selektoren','Attribute selectors'),sub:'[href], ^=, $=, data-*',mode:'sel',mdn:'Attribute_selectors',
 desc:tx('Attribut-Selektoren wählen Elemente nach ihren Attributen und deren Werten – ohne zusätzliche Klassen.','Attribute selectors pick elements by their attributes and those attributes’ values – without extra classes.'),
 stage:`<div class="ca-attrs"><a href="https://example.org">${tx('Extern','External')}</a><a href="/intern">${tx('Intern','Internal')}</a><a href="bericht.pdf">${tx('Bericht (PDF)','Report (PDF)')}</a><a>${tx('ohne href','without href')}</a><button type="button" data-state="open" class="btn btn-secondary">${tx('Menü (offen)','Menu (open)')}</button><button type="button" data-state="closed" class="btn btn-secondary">${tx('Suche (zu)','Search (closed)')}</button></div>`,
 vals:[['a[href]','',tx('Alle Links mit href.','All links with href.')],['a[href^="https"]','',tx('^= beginnt mit.','^= starts with.')],['a[href$=".pdf"]','',tx('$= endet mit – etwa für ein PDF-Symbol.','$= ends with – e.g. for a PDF icon.')],['[data-state="open"]','data-[state=open]:',tx('Zustand als data-Attribut, typisch für Komponentenbibliotheken.','State as a data attribute, typical of component libraries.')],['a:not([href])','',tx('Ein a ohne href ist kein Link: nicht fokussierbar, keine Rolle.','An a without href isn’t a link: not focusable, no role.')]],
 tip:tx('<code>[aria-expanded="true"]</code> oder <code>[aria-current="page"]</code> als Styling-Haken koppeln Optik und Barrierefreiheit: Stimmt das Attribut nicht, sieht man es sofort. Diese App stylt den aktiven Eintrag der Seitenleiste genau so.','Using <code>[aria-expanded="true"]</code> or <code>[aria-current="page"]</code> as styling hooks couples visuals and accessibility: if the attribute is wrong, you see it right away. This app styles the active sidebar entry exactly that way.')},
{id:'specificity',cat:'sel',name:tx('Spezifität','Specificity'),sub:tx('Welche Regel gewinnt?','Which rule wins?'),mode:'css',mdn:'Specificity',
 desc:tx('Treffen mehrere Regeln dasselbe Element, gewinnt die spezifischere – erst bei Gleichstand die spätere. Gezählt wird (IDs, Klassen/Attribute/Pseudoklassen, Elemente).','When several rules hit the same element, the more specific one wins – only on a tie does the later one win. The count is (IDs, classes/attributes/pseudo-classes, elements).'),
 stage:`<div class="box"><p class="note" id="ca-x">${tx('Welche Farbe gewinnt?','Which color wins?')}</p></div>`,
 vals:[[tx('Element vs. Klasse','Element vs. class'),'& p { color: #0369A1; }\n& .note { color: #047857; }','',tx('.note (0,1,0) schlägt p (0,0,1): grün.','.note (0,1,0) beats p (0,0,1): green.')],
  [tx('Mehr Teile','More parts'),'& .box p { color: #BE185D; }\n& .note { color: #047857; }','',tx('.box p (0,1,1) schlägt .note (0,1,0): pink – obwohl .note später steht.','.box p (0,1,1) beats .note (0,1,0): pink – even though .note comes later.')],
  [':where()','& :where(.box) p { color: #BE185D; }\n& .note { color: #047857; }','',tx(':where() zählt null, bleibt also (0,0,1): grün. So bauen Resets Regeln, die man leicht überschreibt.',':where() counts as zero, so it stays (0,0,1): green. That’s how resets build rules that are easy to override.')],
  ['ID','& #ca-x { color: #6D28D9; }\n& .box p.note { color: #047857; }','',tx('Eine ID (1,0,0) schlägt jede Menge Klassen: violett.','One ID (1,0,0) beats any number of classes: violet.')],
  ['!important','& .note { color: #047857 !important; }\n& #ca-x { color: #6D28D9; }','',tx('!important sticht jede Spezifität: grün. Danach hilft nur noch ein weiteres !important.','!important trumps any specificity: green. After that, only another !important helps.')]],
 tip:tx('Hohe Spezifität ist schwer zu überschreiben. Design-Systeme bleiben darum bei flachen Klassen, Tailwind erzeugt fast nur einzelne Klassen – alle mit derselben Spezifität.','High specificity is hard to override. That’s why design systems stick to flat classes, and Tailwind generates almost only single classes – all with the same specificity.')},
{id:'is-where',cat:'sel',name:':is() & :where()',sub:tx('Selektoren bündeln','Grouping selectors'),mode:'sel',mdn:':is',
 desc:tx('<code>:is()</code> fasst eine Liste zusammen: <code>:is(.post, .sidebar) a</code> statt <code>.post a, .sidebar a</code>. <code>:where()</code> macht dasselbe, zählt bei der Spezifität aber null. Beide verzeihen ungültige Teile der Liste.','<code>:is()</code> groups a list: <code>:is(.post, .sidebar) a</code> instead of <code>.post a, .sidebar a</code>. <code>:where()</code> does the same but counts as zero for specificity. Both forgive invalid parts of the list.'),
 stage:`<div class="ca-isw"><div class="post"><h3>${tx('Beitrag','Post')}</h3><p>${tx('Text mit einem','Text with a')} <a href="#">Link</a>.</p></div><div class="sidebar"><h4>${tx('Seitenleiste','Sidebar')}</h4><p><a href="#">${tx('Noch ein Link','Another link')}</a></p></div><div class="footer"><p>Footer: <a href="#">${tx('Impressum','Legal notice')}</a></p></div></div>`,
 vals:[[':is(.post, .sidebar) a','',tx('Eine Regel für zwei Bereiche – der Link im Footer bleibt außen vor.','One rule for two areas – the link in the footer stays out.')],
  [':is(h3, h4)','',tx('Alle Überschriften der Ebenen 3 und 4.','All headings of levels 3 and 4.')],
  [':where(.post, .sidebar) a','',tx('Trifft genau dasselbe wie :is(), zählt aber null – mehr dazu unter „Spezifität“.','Matches exactly the same as :is(), but counts as zero – more under “Specificity”.')],
  ['h3, h4, :hovered','',tx('Tippfehler: :hovered gibt es nicht. In einer normalen Liste macht ein ungültiger Teil die ganze Regel ungültig – nichts wird markiert.','Typo: :hovered doesn’t exist. In a plain list, one invalid part makes the whole rule invalid – nothing gets highlighted.')],

const CA_BY=Object.fromEntries(CSSA.map(e=>[e.id,e]));
const CAT_BY=Object.fromEntries(CA_CATS.map(c=>[c.id,c]));
const caMdn=p=>'https://developer.mozilla.org/en-US/docs/Web/CSS/'+p;
function caVal(e,v){
  if(!Array.isArray(v))v=[v];
  if(e.mode==='sel')return {label:v[0],val:v[0],tw:v[1]||'',note:v[2]||''};
  const [label,val=label,tw='',note='']=v;
  return {label,val:!e.mode&&typeof val==='string'?{[e.name]:val}:val,tw,note};
}
function caApply(e,art,i){
  const st=$('.ca-stage',art),sid='#'+st.id,v=caVal(e,e.vals[i]);
  let code;
  if(e.mode==='sel'){
    $('style',art).textContent=`${sid} ${v.val}{outline:3px solid var(--ca-hl);outline-offset:2px;background:var(--ca-hl-bg)}`;
    code=`<span class="ca-hl">${esc(v.val)}</span> {\n  /* … */\n}`;
  }else if(e.mode==='css'){
    $('style',art).textContent=v.val.replaceAll('&',sid);
    code=v.val?esc(v.val.replaceAll('& ','')):tx('/* keine Regel */','/* no rule */');
  }else{
    const keys=[...new Set(e.vals.flatMap(x=>Object.keys(caVal(e,x).val)))];
    $$(e.t[0],st).forEach(el=>{keys.forEach(k=>el.style.removeProperty(k));Object.entries(v.val).forEach(([k,x])=>{if(x!=='')el.style.setProperty(k,x)})});
    const blocks=new Map();
    const add=(sel,obj,hl)=>{const b=blocks.get(sel)||new Map();Object.entries(obj).forEach(([k,x])=>{if(x!=='')b.set(k,[x,hl])});blocks.set(sel,b)};
    (e.base||[]).forEach(([,sel,obj])=>add(sel,obj,false));
    add(e.t[1],v.val,true);
    code=[...blocks].map(([sel,b])=>`${sel} {\n${b.size?[...b].map(([k,[x,hl]])=>{const l=esc(`  ${k}: ${x};`);return hl?`<span class="ca-hl">${l}</span>`:l}).join('\n'):tx('  /* Standardwerte */','  /* default values */')}\n}`).join('\n\n');
  }
  $('.ca-pre code',art).innerHTML=code;
  const tw=$('.ca-tw',art);tw.hidden=!v.tw;$('code',tw).textContent=v.tw;
  const note=$('.ca-note',art);note.hidden=!v.note;note.textContent=v.note;
  const m=$('.ca-meas',art);let txt='';
  if(e.measure)txt=e.measure(st);
  else if(e.mode==='sel'&&!e.noCount){try{const n=$$(v.val,st).length;txt=tx(n===1?'Trifft 1 Element.':`Trifft ${n} Elemente.`,n===1?'Matches 1 element.':`Matches ${n} elements.`)}catch(err){}}
  m.hidden=!txt;m.textContent=txt;
}

  <div class="ca-stage" id="ca-st-${e.id}">${e.stage}</div>

</article>`;
function caCatHTML(cat){
  const c=CAT_BY[cat],i=CA_CATS.indexOf(c),prev=CA_CATS[i-1],next=CA_CATS[i+1],es=CSSA.filter(e=>e.cat===cat);
  return `<article class="lesson" aria-labelledby="lesson-title">
  <p class="eyebrow">${tx(`Kapitel ${i+1} von ${CA_CATS.length}`,`Chapter ${i+1} of ${CA_CATS.length}`)}</p>
  <h1 id="lesson-title" tabindex="-1">${c.title}</h1>
